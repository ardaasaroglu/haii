      setTimeout(()=>{patchHistoryRow(b.dataset.retry,b);loadFeed();},6000);
    }catch(e){toast("err","Could not retry",e.message);b.disabled=false;b.textContent="Retry";}
  });
}
// Today / Yesterday / a readable date, off the runtime's own local clock only, same as this row's
// own timestamp above and DEVICE_TZ elsewhere in this file. The PWA runs on the user's device, so
// browser-local already IS the user's zone; a second, explicit tz lookup would be answering a
// question the client never has to ask.
const localDayKey=d=>d.toLocaleDateString("en-CA"); // YYYY-MM-DD local, same trick as tz.dayKeyInTz
function dayLabel(d){
  const now=new Date();
  const y=new Date(now);y.setDate(y.getDate()-1);
  const k=localDayKey(d);
  if(k===localDayKey(now))return"Today";
  if(k===localDayKey(y))return"Yesterday";
  const opts=d.getFullYear()===now.getFullYear()
    ?{weekday:"short",month:"short",day:"numeric"}
    :{weekday:"short",month:"short",day:"numeric",year:"numeric"};
  return d.toLocaleDateString([],opts);
}
// Load-more state for this tab only, reset on each renderHistory() (tab open). histSeen guards the
// one known offset-pagination edge case (see the comment on GET /api/v1/history): a new decision
// landing at the very top while the user is mid-scroll shifts the window under them and can
// re-return a row already on screen; skipping an id already rendered turns that into a silent
// no-op instead of a visible duplicate row. histSeq guards the other edge: a renderHistory() that
// fires (tab revisit) while histLoadMore() is still in flight must not let that stale page land on
// the list it just reset, same as feedSeq does for loadFeed().
let histOffset=0,histMore=false,histLastDay="",histSeen=new Set(),histSeq=0;

// Appends one page's worth of rows to the already-visible list, inserting a day heading whenever
// the day changes. Never for an empty group: a heading is only ever written together with that
// day's first row, in the same loop step, so a day with zero rows never gets one. Built off-DOM so
// wiring each retry button here can never touch a row that belongs to an earlier chunk.
function histAppend(container,cards){
  const parts=[];
  for(const c of cards){
    if(histSeen.has(c.id))continue;
    histSeen.add(c.id);
    const day=dayLabel(new Date(c.decidedAt||c.createdAt));
    if(day!==histLastDay){
      parts.push(`<div class="row-lbl"${histLastDay?' style="margin-top:18px"':""}><span class="t">${esc(day)}</span></div>`);
      histLastDay=day;
    }
    parts.push(histRow(c));
  }
  if(!parts.length)return;
  const scratch=document.createElement("div");
  scratch.innerHTML=parts.join("");
  scratch.querySelectorAll("[data-retry]").forEach(wireRetry);
  while(scratch.firstChild)container.appendChild(scratch.firstChild);
}

async function histLoadMore(btn){
  if(btn.disabled)return;
  const seq=histSeq;
  btn.disabled=true;btn.textContent="Loading…";
  try{
    const h=await api(`/api/v1/history?offset=${histOffset}`);
    if(seq!==histSeq)return; // renderHistory() started a new generation while this was in flight
    const cards=h.cards||[];
    histOffset+=cards.length;
    histMore=Boolean(h.has_more);
    histAppend($("#histRows"),cards);
    if(histMore){btn.disabled=false;btn.textContent="Load more";}
    else{$("#histCtrl").innerHTML=`<div class="hempty">That's everything.</div>`;}
  }catch(e){
    if(seq!==histSeq)return;
    toast("err","Could not load more",e.message);
    btn.disabled=false;btn.textContent="Load more";
  }
}

async function renderHistory(){
  const v=$("#vHistory");
  v.innerHTML=`<div class="say"><div class="eyeb">Your call log</div><h1>Every decision feeds the loop.</h1></div><div class="hempty">Loading…</div>`;
  histSeq++;histOffset=0;histMore=false;histLastDay="";histSeen=new Set();
  try{
    const h=await api("/api/v1/history");
    const cards=h.cards||[];
    histOffset=cards.length;
    histMore=Boolean(h.has_more);
    // The to-do list that used to live at the bottom of this page moved to Follow-ups. History is
    // the decision log: past tense, immutable. A mutable worklist never belonged inside it.
    v.innerHTML=`<div class="say"><div class="eyeb">Your call log</div><h1>Every decision feeds the loop.</h1></div>
      <div id="histRows"></div><div id="histCtrl"></div>`;
    if(!cards.length){
      $("#histRows").innerHTML=`<div class="hempty">No decisions yet. Nod or shake the deck in Today.</div>`;
    }else{
      histAppend($("#histRows"),cards);
    }
    if(histMore){
      $("#histCtrl").innerHTML=`<div style="display:flex;justify-content:center;margin-top:4px"><button class="fbtn" id="histMoreBtn">Load more</button></div>`;
      $("#histMoreBtn").addEventListener("click",e=>histLoadMore(e.currentTarget));
    }
  }catch(e){v.innerHTML+=`<div class="hempty">${esc(e.message)}</div>`;}
}

/* ---------------- follow-ups ----------------
   Everything promised that has not closed yet, grouped by who closes it. Two groups, not three:
   an approved action runs within the undo grace, so a "Haii is doing this" group would be empty
   almost always and would only be History arriving a few seconds early. */
// Items promoStatus() should stop calling "Sending…": pollPromote gave up watching them without
// ever seeing a resolved status, so it would otherwise imply work is still current when nothing is
// checking anymore.
const promoteGaveUp=new Set();
// A single 6s recheck assumed the executor would always be done by then; a slower one (or a slow
// Jira call) left the row saying "Sending to Jira…" forever with nothing left watching it. Recheck
// a bounded number of times with a widening gap, then stop and say so plainly instead of implying
// work that may already be long done or long failed.
function pollPromote(id){
  const gaps=[6000,10000,20000];
  const attempt=n=>setTimeout(async()=>{
    if(n===gaps.length-1)promoteGaveUp.add(id);
    await renderFollow();
    if(n<gaps.length-1)attempt(n+1);
  },gaps[n]);
  attempt(0);
}
/** A due date as a person reads it, plus which of the three states it is in.
 *
 *  The list used to render the raw `2026-08-06`, which asks the reader to know today's date and do
 *  arithmetic on every row, and looked identical whether it was last week or next month.
 *
 *  Compares LOCAL CALENDAR DAYS, never instants. Parsing "2026-08-06" with Date.parse gives UTC
 *  midnight, so east of Greenwich "due today" would flip to "1 day late" in the small hours, which
 *  is the one moment a person is least able to argue with it. Building the date from its parts
 *  gives local midnight, and Math.round absorbs the 23 and 25 hour days.
 *
 *  Null for anything unparseable, so the caller can fall back to showing the raw string rather than
 *  silently hiding a date we failed to read. */
function dueLabel(due){
  const d=String(due||"").trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return null;
  const [Y,Mo,D]=d.split("-").map(Number);
  const due0=new Date(Y,Mo-1,D);
  const now=new Date();
  const today0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const days=Math.round((due0-today0)/86400000);
  // Blunt on purpose, and this was a deliberate choice over the gentler "Was due Friday": the whole
  // product exists because promises slip quietly, and a soft phrase is how they keep slipping.
  if(days<0)return{cls:"late",text:days===-1?"1 day late":`${-days} days late`};
  if(days===0)return{cls:"today",text:"Due today"};
  // Marked, not coloured: today and tomorrow should catch the eye, but a
  // deadline that is merely ARRIVING is not a state to recover from, which is what amber means
  // here, and a third colour would spend the alarm that makes red work.
  if(days===1)return{cls:"soon",text:"Due tomorrow"};
  // en-GB, NOT the device locale, and this is the one place in the client where that is the right
  // call. lib/tz.hhmmForUser deliberately honours the user's locale, but that decides how a NUMBER
  // is spelled: 14:00 against 2:00 PM, correct either way. A weekday is a WORD, and the app has no
  // localisation, so honouring the device gave "Due Pazar" and "Due 4 Eyl" on a Turkish machine:
  // one Turkish word inside an English sentence, which reads as broken rather than as translated.
  // Caught in testing on 2026-08-04. dayLabel() on History still follows the device locale.
  const L="en-GB";
  // Inside a week a weekday name is the fastest thing to read; past that it stops being unambiguous.
  if(days<7)return{cls:"",text:`Due ${due0.toLocaleDateString(L,{weekday:"long"})}`};
  const opts=due0.getFullYear()===now.getFullYear()
    ?{day:"numeric",month:"short"}
    :{day:"numeric",month:"short",year:"numeric"};
  return{cls:"",text:`Due ${due0.toLocaleDateString(L,opts)}`};
}

/* ---------------- follow-ups: fetch and paint are separate ----------------
   EVERY action on this page used to call renderFollow(), which blanked the view to "Loading…",
   re-fetched, and rebuilt the DOM from scratch. Ticking one checkbox or nudging one row up threw
   away the scroll position and bounced the user to the top of the list, and moving an item five
   places meant five taps, five round trips and five jumps to the top.

   So: fCache holds the last payload, paintFollow() draws from it and RESTORES SCROLL, and the
   network write happens behind an order the user can already see. Fetching is now something that
   happens when the page opens, not something every gesture drags along with it. */
let fCache=null;      // last payload from the server, mutated in place by optimistic edits
let fYours=null;      // the "Yours to do" array as currently painted, in painted order
let fOrderTimer=null; // debounce handle for the reorder write
let fOrderIds=null;   // the order waiting to be written
let fFilter="all";    // which due-state the open list is showing
let fClosedOpen=false;// the Closed pile starts folded away
let fOpenQuotes=new Set(); // rows whose evidence the user has expanded, kept across repaints

/** Which bucket a due date falls in. Local calendar days, same arithmetic as dueLabel, because a
 *  filter that disagreed with the label on the row it is filtering would be worse than no filter. */
function dueBucket(due){
  const d=String(due||"").trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return "none";
  const [Y,Mo,D]=d.split("-").map(Number);
  const now=new Date();
  const days=Math.round((new Date(Y,Mo-1,D)-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
  if(days<0)return "late";
  if(days===0)return "today";
  if(days<7)return "week";
  return "later";
}
/** The chips, and what each one counts. "This week" INCLUDES today and the late ones on purpose:
 *  the question a person is asking is "what is on me before the weekend", and an overdue item is
 *  the most on them of all. Overlapping buckets are fine because these are alternatives, not
 *  additive filters. */
const F_FILTERS=[
  {id:"all",   label:"All",       hit:()=>true},
  {id:"late",  label:"Late",      hit:b=>b==="late"},
  {id:"today", label:"Today",     hit:b=>b==="today"},
  {id:"week",  label:"This week", hit:b=>b==="late"||b==="today"||b==="week"},
  {id:"none",  label:"No date",   hit:b=>b==="none"},
];

/** Has this reader ever reordered? Wrapped because localStorage throws in some privacy modes, and
 *  a hint line is never worth breaking the page for. */
function fReorderKnown(){ try{ return localStorage.getItem("haii_reorder_known")==="1"; }catch(e){ return false; } }
function fMarkReorderKnown(){ try{ localStorage.setItem("haii_reorder_known","1"); }catch(e){} }

/** Stamp a new order locally, repaint at once, and write it ONCE when the user stops moving things.
 *  Five taps up the list is now five instant repaints and a single request, where it used to be
 *  five requests each followed by a full reload. */
function applyOrder(ids){
  fMarkReorderKnown();
  const pos=new Map(ids.map((id,n)=>[id,n]));
  // Stamp every visible position, not just the moved one. sort_order is null until somebody has an
  // opinion; leaving the neighbours null lets them keep sorting by due date around the moved row,
  // which reads as the item springing back.
  (fCache&&fCache.items||[]).forEach(it=>{ if(pos.has(it.id)) it.sort_order=pos.get(it.id); });
  paintFollow();
  fOrderIds=ids;
  if(fOrderTimer)clearTimeout(fOrderTimer);
  fOrderTimer=setTimeout(flushOrder,450);
}
async function flushOrder(){
  const ids=fOrderIds; fOrderIds=null; fOrderTimer=null;
  if(!ids||!ids.length)return;
  try{ await api("/api/v1/todos/reorder",{method:"POST",body:JSON.stringify({ids})}); }
  // Only here does the user learn anything went wrong, and only then do we go back to the server.
  catch(e){ toast("err","Could not save the order",e.message); await renderFollow(); }
}
/** Write any pending order NOW. Called when the page is being left, so an order the user set and
 *  then immediately navigated away from is not lost inside the debounce window. */
function flushOrderNow(){ if(fOrderTimer){ clearTimeout(fOrderTimer); fOrderTimer=null; flushOrder(); } }

async function renderFollow(){
  const v=$("#vFollow");
  const head=`<div class="say"><div class="eyeb">Still open</div><h1>What you promised, and what is left.</h1></div>`;
  // "Loading…" ONLY when there is nothing to show. On a refetch the existing list stays on screen,
  // so the page never flashes empty under someone who is reading it.
  if(!fCache)v.innerHTML=`${head}<div class="hempty">Loading…</div>`;
  try{
    fCache=await api("/api/v1/followups");
    paintFollow();
  }catch(e){
    if(!fCache)v.innerHTML=`${head}<div class="hempty">${esc(e.message||"Could not load your follow-ups")}</div>`;
    else toast("err","Could not refresh",e.message);
  }
}

function paintFollow(){
  const v=$("#vFollow");
  const head=`<div class="say"><div class="eyeb">Still open</div><h1>What you promised, and what is left.</h1></div>`;
  // THE SCROLL FIX. innerHTML resets scrollTop to 0, so every repaint used to throw the reader back
  // to the top. Captured before, restored after, on the element that actually scrolls (main).
  const keepScroll=v.scrollTop;
  {
    const d=fCache||{};
    const items=d.items||[];
    const yours=items.filter(i=>i.group==="yours"&&!i.done);
    const blocked=items.filter(i=>i.group==="blocked"&&!i.done);
    const done=items.filter(i=>i.done);
    // Dated first and soonest first, then the undated by newest. An undated item is not urgent,
    // it is just unscheduled, so it must not outrank something due tomorrow.
    const bySoonest=(a,b)=>(a.due&&b.due)?a.due.localeCompare(b.due):a.due?-1:b.due?1:new Date(b.created_at)-new Date(a.created_at);
    // A HAND-PLACED ITEM OUTRANKS EVERY DATE. sort_order is null until the user moves something,
    // which is what separates "nobody has an opinion about this list" from "I put that at the top
    // for a reason": an untouched list keeps sorting by due date and only becomes hand-ordered once
    // somebody says so. Placed items keep their relative order and the rest fall in behind by date,
    // so moving one thing does not silently freeze the ordering of everything else.
    const byHand=(a,b)=>{
      const ha=a.sort_order,hb=b.sort_order;
      if(ha!=null&&hb!=null)return ha-hb;
      if(ha!=null)return -1;
      if(hb!=null)return 1;
      return bySoonest(a,b);
    };
    yours.sort(byHand);blocked.sort(bySoonest);
    // Handlers read the painted order from here rather than re-deriving it, so what a tap moves is
    // exactly what the user is looking at.
    fYours=yours;

    const meta=i=>{
      const bits=[];
      const dl=dueLabel(i.due);
      // Unparseable falls back to the raw string rather than vanishing. A date we cannot read is
      // still a date the user was told about, and hiding it would be worse than showing it plainly.
      if(dl)bits.push(`<span class="fdue ${dl.cls}">${esc(dl.text)}</span>`);
      else if(i.due)bits.push(`Due ${esc(i.due)}`);
      if(i.source)bits.push(esc(i.source));
      return bits.join(" · ");
    };
    // Provenance is the whole point: a follow-up that loses the sentence it came from is just a
    // checkbox, and then this competes with every to-do app and loses.
    //
    // CLAMPED TO TWO LINES, tappable to open. It stays on the row, which is what matters; what
    // changes is that a long list is no longer one full quote per row tall. Most quotes are one
    // sentence and lose nothing. The attribution is deliberately OUTSIDE the clamped box, or the
    // line-clamp would eat the name and leave a quote nobody can attribute, which is worse than a
    // long row. Expanded rows are remembered across repaints (fOpenQuotes) so ticking a box
    // somewhere else does not fold the thing you were reading.
    const quote=i=>i.quote?`<div class="fq${fOpenQuotes.has(i.id)?" open":""}" data-quote="${esc(i.id)}" title="Tap to show the whole line"><span class="fqt">&ldquo;${esc(i.quote.text)}&rdquo;</span><span class="fw">${esc(i.quote.who||"")}${i.quote.t?` · ${esc(i.quote.t)}`:""}</span></div>`:"";

    // Routing: turn a capture into a real Jira issue. promote_targets already
    // excludes anything not actually connected (server-computed, never trust a stale client here),
    // so any button this renders is one Haii can actually act on.
    const PROMOTE_VERB={create_jira_issue:"Send to Jira"};
    const promoBtns=i=>(i.promote_targets||[]).map(t=>
      `<button class="fbtn" data-promote="${esc(i.id)}" data-target="${esc(t)}">${esc(PROMOTE_VERB[t]||t)}</button>`
    ).join("");

    // ONE CONTROL RAIL, not a number on the left and three buttons floating on the right.
    //
    // The first layout's problem was SCATTER, not any one bad control. A row had four anchors
    // competing: the checkbox and the position badge in a left gutter, the content, and three
    // small buttons adrift in the
    // whitespace at the top right of a card made tall by its quote. Nothing lined up with anything.
    //
    // Now every reorder control is one object: grip, then move-to-top, up, down, in a single tinted
    // rail pinned to the top of the card so it aligns with the title. Two anchors on the row, the
    // checkbox and the rail, and the content runs cleanly between them. It also stops the controls
    // competing with the title for attention, which is right: reordering is rare, reading is not.
    //
    // All three ways to move a row survive, because they fail in different weather. Drag is the one
    // people reach for; the arrows are the only part a synthetic click can exercise, which is what
    // keeps the reorder maths testable at all (both paths end in the same applyOrder); and the
    // move-to-top is what "I need this next" actually means, rather than seven taps of up.
    const rail=(i,idx,n)=>n<2?"":`<div class="frail">
      <div class="fgrip" data-grip="${esc(i.id)}" role="button" tabindex="-1"
        title="Drag to reorder, or hold the row" aria-label="Position ${idx+1} of ${n}, drag to reorder">
        <svg class="fgdots" width="10" height="14" viewBox="0 0 10 14" aria-hidden="true"><g fill="currentColor"><circle cx="2.2" cy="2.2" r="1.2"/><circle cx="7.8" cy="2.2" r="1.2"/><circle cx="2.2" cy="7" r="1.2"/><circle cx="7.8" cy="7" r="1.2"/><circle cx="2.2" cy="11.8" r="1.2"/><circle cx="7.8" cy="11.8" r="1.2"/></g></svg>
        <span class="fgn">${idx+1}</span></div>
      <button class="fmv" data-top="${esc(i.id)}"${idx===0?" disabled":""} aria-label="Move to top" title="Move to top">⤒</button>
      <button class="fmv" data-move="${esc(i.id)}" data-dir="-1"${idx===0?" disabled":""} aria-label="Move up">↑</button>
      <button class="fmv" data-move="${esc(i.id)}" data-dir="1"${idx===n-1?" disabled":""} aria-label="Move down">↓</button></div>`;
    const yoursRow=(i,idx,arr,noOrder)=>{
      const promo=promoBtns(i);
      // The whole rail goes while filtered: the number would be a position within the filter, and
      // moving by it would write an order for rows the user cannot see.
      return`<div class="frow" data-id="${esc(i.id)}">
      <button class="fbox" data-toggle="${esc(i.id)}" aria-label="Mark done"></button>
      <div class="fmain"><div class="ft">${esc(i.title)}</div>
        ${meta(i)?`<div class="fm">${meta(i)}</div>`:""}${quote(i)}
        ${promo?`<div class="frow-act">${promo}</div>`:""}</div>${noOrder?"":rail(i,idx,arr.length)}</div>`;
    };

    const blockedRow=i=>{
      const cn=i.connector;
      const act=cn&&!cn.connected
        ? `<button class="fbtn" data-connect="1">Connect ${esc(cn.label)}</button>`
        : `<button class="fbtn go" data-run="${esc(i.card_id||"")}">Haii, do it now</button>`;
      return`<div class="frow blocked" data-id="${esc(i.id)}">
        <div class="fmain"><div class="ft">${esc(i.title)}</div>
          <div class="fm warn">${esc((i.notes||"").split(".")[0]||"Haii cannot do this yet")}</div>
          ${quote(i)}
          <!-- No promote buttons here on purpose. A blocked item is blocked because its connector
               is not connected, and "Connect Jira" IS the answer to that. Offering "Add to
               Calendar" beside it invites you to reroute a commitment somewhere it does not belong
               to work around a connection you could just make. Promotion is for the Yours list,
               where the item is a genuine to-do and the question is where it should live. -->
          <div class="frow-act">${act}${i.card_id?`<button class="fbtn ghost" data-dismiss="${esc(i.id)}">Not needed</button>`:""}</div>
        </div></div>`;
    };

    // A promoted item is done, but not in the way a checked-off or dismissed one is: the work did
    // not vanish, it moved. Show where, and drop the toggle so "not done" cannot un-promote it and
    // strand the follow-up in a state the row can no longer describe.
    const promoStatus=(p,id)=>{
      const label=TYPES[p.target]?.label||p.target||"your other tools";
      if(p.ok)return p.url?`Sent to <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(label)}</a>`:`Sent to ${esc(label)}`;
      if(p.status==="failed")return`${esc(label)} did not go through, check History`;
      if(promoteGaveUp.has(id))return`Still sending to ${esc(label)}, check History for the latest`;
      return`Sending to ${esc(label)}…`;
    };
    // A closed item you can reopen and one you cannot LOOKED IDENTICAL until 2026-08-04: both were
    // a `.fbox on` showing a tick, one a button and one an inert div, so the only way to find out
    // which was which was to tap and see whether anything happened. Unchecking closed items already
    // worked; what was missing was any sign of it.
    //
    // `reopenable` comes from the server, which owns the rule (the toggle endpoint 409s on a
    // promoted capture), rather than the client re-deriving it from the presence of `promoted`.
    const doneRow=i=>{
      const p=i.promoted;
      const box=i.reopenable
        ? `<button class="fbox on can-undo" data-toggle="${esc(i.id)}" aria-label="Mark not done" title="Reopen this">✓</button>`
        : `<div class="fbox on locked" aria-hidden="true">✓</div>`;
      return`<div class="frow done${i.reopenable?" reopenable":""}" data-id="${esc(i.id)}">
      ${box}
      <div class="fmain"><div class="ft">${esc(i.title)}</div>${p?`<div class="fm promoted">${promoStatus(p,i.id)}</div>`:""}</div></div>`;
    };

    // Filter the OPEN list only. Blocked items wait on a connector and closed ones are history, so
    // hiding either behind a due-date chip would answer a question nobody asked.
    const buckets=new Map(yours.map(i=>[i.id,dueBucket(i.due)]));
    const counts=Object.fromEntries(F_FILTERS.map(f=>[f.id,yours.filter(i=>f.hit(buckets.get(i.id))).length]));
    // A chip that would empty the screen is not offered. "Late 0" is a fact worth seeing on the
    // chip; a chip you can tap to reach nothing is just a trap.
    const chips=yours.length>6?`<div class="fchips">${F_FILTERS
      .filter(f=>f.id==="all"||counts[f.id]>0)
      .map(f=>`<button class="fchip${fFilter===f.id?" on":""}" data-filter="${f.id}">${esc(f.label)}<span class="n">${counts[f.id]}</span></button>`).join("")}</div>`:"";
    const active=F_FILTERS.find(f=>f.id===fFilter)||F_FILTERS[0];
    const shown=yours.filter(i=>active.hit(buckets.get(i.id)));
    // Hand-ordering a FILTERED list would write a partial order and silently renumber everything
    // the filter is hiding. So the controls go away and the screen says why, rather than offering
    // an arrow that quietly corrupts the order of rows you cannot see.
    const filtering=fFilter!=="all";
    // A gesture nobody can guess at may as well not exist. Shown until the first successful
    // reorder, then never again: it is an instruction, and an instruction you have already followed
    // is clutter. localStorage rather than a user column because it is a fact about this device's
    // reader, not about the account, and getting it wrong costs one extra line of help.
    const hint=(yours.length>1&&!filtering&&!fReorderKnown())
      ? `<div class="fhint"><svg width="10" height="14" viewBox="0 0 10 14" aria-hidden="true"><g fill="currentColor"><circle cx="2.2" cy="2.2" r="1.2"/><circle cx="7.8" cy="2.2" r="1.2"/><circle cx="2.2" cy="7" r="1.2"/><circle cx="7.8" cy="7" r="1.2"/><circle cx="2.2" cy="11.8" r="1.2"/><circle cx="7.8" cy="11.8" r="1.2"/></g></svg>
          <span>Drag the handle to reorder, or hold a row anywhere. The arrows work too.</span></div>`
      : "";

    const empty=!yours.length&&!blocked.length&&!done.length;
    v.innerHTML=`${head}
      ${empty?`<div class="empty"><div class="ok">✓</div><h3>Nothing outstanding.</h3>
        <p>When you promise something Haii cannot do for you, it lands here with the words you said.</p>
        <button id="fToToday">Back to today</button></div>`:""}
      ${yours.length?`<div class="row-lbl"><span class="t">Yours to do</span><span class="c">${yours.length}</span></div>${chips}${hint}
        ${filtering?`<div class="fnote">Showing ${shown.length} of ${yours.length}. Reordering is off while a filter is on, so it cannot renumber the rows you can&rsquo;t see.</div>`:""}
        <div id="fYoursList">${shown.map((i,n)=>yoursRow(i,n,shown,filtering)).join("")}</div>`:""}
      ${blocked.length?`<div class="row-lbl" style="margin-top:18px"><span class="t">Haii can't do these yet</span><span class="c">${blocked.length}</span></div>
        <div class="fnote">Most of these need a tool connected or reconnected. Then Haii finishes them.</div>${blocked.map(blockedRow).join("")}`:""}
      ${!empty&&!yours.length&&!blocked.length?`<div class="hempty">Nothing open. ${done.length} closed below.</div>`:""}
      ${done.length?`<div class="row-lbl fclosed-hd" data-closed="1" style="margin-top:22px"><span class="t">Closed</span><span class="c">${done.length}</span><span class="n">${fClosedOpen?"hide":"show"}</span></div>
        ${fClosedOpen?done.slice(0,25).map(doneRow).join(""):""}`:""}`;

    const goToday=$("#fToToday");if(goToday)goToday.addEventListener("click",()=>tab("today"));
    // Filter, fold and expand are all pure view state: repaint from the cache, no network, and the
    // scroll restore below keeps the reader where they were.
    v.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{
      fFilter=b.dataset.filter; v.scrollTop=0; paintFollow();
    }));
    const ch=v.querySelector("[data-closed]");
    if(ch)ch.addEventListener("click",()=>{ fClosedOpen=!fClosedOpen; paintFollow(); });
    v.querySelectorAll("[data-quote]").forEach(q=>q.addEventListener("click",()=>{
      const id=q.dataset.quote;
      if(fOpenQuotes.has(id))fOpenQuotes.delete(id); else fOpenQuotes.add(id);
      // Toggle the class in place rather than repainting: the row the user is reading must not
      // move under them, and nothing else on screen depends on this.
      q.classList.toggle("open",fOpenQuotes.has(id));
    }));
    // TICKING A BOX NO LONGER RELOADS THE PAGE. The item is moved to Closed locally and repainted
    // at the same scroll position; the write goes out behind it. On failure the local edit is put
    // back, which is the only honest way to be optimistic.
    v.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",async()=>{
      const id=b.dataset.toggle;
      const it=(fCache&&fCache.items||[]).find(x=>x.id===id);
      if(!it)return;
      const was=it.done;
      it.done=!was;
      // Mirrors the server rule: the toggle endpoint 409s only on a promoted capture, so anything
      // else can be reopened. The next real fetch overwrites this with the server's own answer.
      if(it.done&&it.reopenable===undefined)it.reopenable=!it.promoted;
      paintFollow();
      try{await api(`/api/v1/todos/${id}/toggle`,{method:"POST"});}
      catch(e){ it.done=was; paintFollow(); toast("err","Could not update",e.message); }
    }));
    // Reorder. The whole new order is sent, not "move this one up": the client already knows what
    // the user is looking at, so the full list is idempotent, immune to ties, and safe to replay,
    // where an index-and-direction request replayed by a double tap moves something twice.
    const orderAfterMove=(id,to)=>{
      const ids=(fYours||[]).map(x=>x.id);
      const from=ids.indexOf(id);
      if(from<0)return null;
      const dest=Math.max(0,Math.min(ids.length-1,to));
      if(dest===from)return null;
      ids.splice(dest,0,ids.splice(from,1)[0]);
      return ids;
    };
    v.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("click",()=>{
      const ids=orderAfterMove(b.dataset.move,(fYours||[]).findIndex(x=>x.id===b.dataset.move)+Number(b.dataset.dir));
      if(ids)applyOrder(ids);
    }));
    v.querySelectorAll("[data-top]").forEach(b=>b.addEventListener("click",()=>{
      const ids=orderAfterMove(b.dataset.top,0);
      if(ids)applyOrder(ids);
    }));
    attachFollowDrag(v);
    v.querySelectorAll("[data-connect]").forEach(b=>b.addEventListener("click",()=>tab("setup")));
    v.querySelectorAll("[data-run]").forEach(b=>b.addEventListener("click",async()=>{
      if(!b.dataset.run){toast("err","Nothing to re-run","this item has no source action");return;}
      b.disabled=true;b.textContent="Working…";
      try{
        const r=await api(`/api/v1/cards/${b.dataset.run}/retry`,{method:"POST"});
        toast("yes","On it",r.detail);
        setTimeout(()=>{renderFollow();loadFeed();},6000);
      }catch(e){toast("err","Could not run it",e.message);b.disabled=false;b.textContent="Haii, do it now";}
    }));
    v.querySelectorAll("[data-promote]").forEach(b=>b.addEventListener("click",async()=>{
      const target=b.dataset.target,old=b.textContent;
      b.disabled=true;b.textContent="Working…";
      try{
        await api(`/api/v1/todos/${b.dataset.promote}/promote`,{method:"POST",body:JSON.stringify({target})});
        toast("yes","On it",`Sending to ${TYPES[target]?.label||"your other tools"}`);
        await renderFollow();
        // The executor polls every 5s (the undo grace); re-read once it has had a chance to run,
        // same as the retry button below, so the badge above picks up the real outcome instead of
        // sitting on "Sending…" until the user happens to leave and come back.
        pollPromote(b.dataset.promote);
      }catch(e){toast("err","Could not promote",e.message);b.disabled=false;b.textContent=old;}
    }));
    // "Not needed" closes an item Haii cannot do and you do not want done by hand either.
    v.querySelectorAll("[data-dismiss]").forEach(b=>b.addEventListener("click",async()=>{
      b.disabled=true;
      try{await api(`/api/v1/todos/${b.dataset.dismiss}/toggle`,{method:"POST"});await renderFollow();}
      catch(e){toast("err","Could not close it",e.message);b.disabled=false;}
    }));
    // The badge is whatever the list just painted. It used to be a SECOND fetch of the same
    // endpoint fired straight after the one that drew the page, so every action on this tab cost
    // two identical requests and the two could disagree with each other for a moment.
    setFollowBadge(yours.length);
  }
  // Restore the reader to where they were. Last, after every handler is attached and the layout is
  // final, or the assignment lands on a list that has not reached its full height yet.
  v.scrollTop=keepScroll;
}

/* ---------------- drag a row by its number ----------------
   THE FIRST VERSION DID NOT WORK ON A REAL DEVICE, and the reason is worth keeping.

   It bound `pointermove` and `pointerup` TO THE GRIP. A grip is 22px tall, so the instant a finger
   travels far enough to move a row it is no longer over the element listening for the move, and
   every subsequent event goes somewhere else. `setPointerCapture` was supposed to cover that, but
   it cannot be relied on here for two reasons: it is best-effort on some touch stacks, and the
   drag re-parents the row on every step, which counts as removing the capture target from the
   document and releases the capture per spec. So the gesture died after the first pixel and the
   finger came up somewhere the `pointerup` handler could not see, leaving the row stuck with its
   lifted class and nothing written.

   The fix is the boring one: pointerdown ARMS on the grip, and the whole rest of the gesture is
   read from WINDOW listeners, which receive the events wherever the finger goes and do not depend
   on capture at all. Bound once, not per paint, or every repaint would stack another set.

   Long lists also need the edge to scroll. A real list can run to dozens of items: without this
   you cannot drag anything further than the screen is tall, which on its own reads as "drag is
   broken". */
let fDrag=null;          // { row, list, from } while a drag is live
let fDragY=0;            // last pointer Y, for the edge auto-scroll timer
let fEdgeTimer=null;
let fDragBound=false;
let fPress=null;         // { row, list, x, y, timer } while deciding if a press is a drag

/** Hold this long anywhere on a row and it becomes draggable. 280ms is the usual reorder
 *  long-press: short enough not to feel like waiting, long enough that it cannot be confused with
 *  the start of a scroll flick. */
const F_LONGPRESS_MS = 280;
/** Move further than this before the timer fires and it was a scroll, not a grab. */
const F_MOVE_SLOP = 10;

const fDragRows=()=>fDrag?[...fDrag.list.querySelectorAll(".frow[data-id]")]:[];

/** Reposition the dragged row under the pointer. Midpoints, not edges, so a row swaps once it is
 *  more than half passed and never oscillates on a boundary. */
function fDragTo(y){
  if(!fDrag)return;
  const others=fDragRows().filter(r=>r!==fDrag.row);
  const before=others.find(r=>{const b=r.getBoundingClientRect();return y<b.top+b.height/2;});
  if(before)fDrag.list.insertBefore(fDrag.row,before); else fDrag.list.appendChild(fDrag.row);
  // THE ROW FOLLOWS THE FINGER. Without this it teleports between slots, which is what made a
  // working drag feel broken: you are holding something and nothing is moving with you.
  //
  // Clear the transform BEFORE measuring or we measure our own offset and the row runs away down
  // the screen. getBoundingClientRect is the right call here despite the usual preference for
  // clientHeight: we need a VIEWPORT position, and the transform that would distort it has just
  // been reset on the line above.
  fDrag.row.style.transform="";
  const b=fDrag.row.getBoundingClientRect();
  fDrag.row.style.transform=`translateY(${Math.round(y-(b.top+b.height/2))}px)`;
}

/** Scroll the view when the finger is near its top or bottom edge, so a row can travel further
 *  than one screen. A timer rather than requestAnimationFrame on purpose: rAF does not fire in a
 *  hidden tab, and a fix that cannot be exercised is a fix nobody can check. */
function fEdgeScroll(){
  if(!fDrag)return;
  const v=$("#vFollow");
  const b=v.getBoundingClientRect();
  const EDGE=70,STEP=14;
  let d=0;
  if(fDragY<b.top+EDGE)d=-STEP;
  else if(fDragY>b.bottom-EDGE)d=STEP;
  if(d){ v.scrollTop+=d; fDragTo(fDragY); }
}

function fDragEnd(){
  if(!fDrag)return;
  const {row,from}=fDrag;
  row.classList.remove("fdrag");
  row.style.transform="";   // drop the follow-the-finger offset, or the row keeps it after landing
  const ids=fDragRows().map(r=>r.dataset.id);
  const to=ids.indexOf(row.dataset.id);
  fDrag=null;
  if(fEdgeTimer){clearInterval(fEdgeTimer);fEdgeTimer=null;}
  document.body.classList.remove("fdragging");
  // Only write when something actually moved. A tap on the grip is a tap, not an edit, and must
  // not cost a request or renumber the list under someone who was only steadying their thumb.
  if(to!==from&&to>=0)applyOrder(ids);
  else paintFollow();   // put the numbers back if nothing changed
}

function fArm(row,list,y){
  const rows=[...list.querySelectorAll(".frow[data-id]")];
  fDrag={row,list,from:rows.indexOf(row)};
  fDragY=y;
  row.classList.add("fdrag");
  document.body.classList.add("fdragging");
  if(fEdgeTimer)clearInterval(fEdgeTimer);
  fEdgeTimer=setInterval(fEdgeScroll,50);
}
function fCancelPress(){ if(fPress){ clearTimeout(fPress.timer); fPress=null; } }

function bindFollowDragOnce(){
  if(fDragBound)return;
  fDragBound=true;
  window.addEventListener("pointermove",e=>{
    // A press that travels before the long-press fires was a SCROLL. Cancel it, or the list jumps
    // into reorder mode half a flick into someone reading.
    if(fPress&&(Math.abs(e.clientY-fPress.y)>F_MOVE_SLOP||Math.abs(e.clientX-fPress.x)>F_MOVE_SLOP))fCancelPress();
    if(!fDrag)return;
    fDragY=e.clientY;
    fDragTo(e.clientY);
    e.preventDefault();
  },{passive:false});
  const up=()=>{ fCancelPress(); fDragEnd(); };
  window.addEventListener("pointerup",up);
  window.addEventListener("pointercancel",up);
  // A finger that leaves the window entirely still has to end the drag, or the row stays lifted
  // and the next paint fights it.
  window.addEventListener("blur",up);
}

/** THE ROW IS THE HANDLE, and the number is a shortcut.
 *
 *  TWO FAILED VERSIONS BEFORE THIS ONE, and the second failure is the instructive one. The drag
 *  was bound to the grip alone: a 22px badge showing a position number. It passed every test and
 *  was still reported dead, twice. Watching real input on a real device showed why, and it was
 *  never the event plumbing: a 22px target that renders as a list index does not say "hold me",
 *  so the thing under the finger was the ROW. The gesture was fine. Nobody could find where to
 *  start it.
 *
 *  So: hold anywhere on a row for 280ms and it lifts. That is the gesture every mobile list uses,
 *  it needs no target smaller than the row itself, and being time-based rather than
 *  direction-based it cannot be confused with a scroll the way a swipe can (the lesson attachGestures
 *  paid four attempts for). The grip still arms instantly for anyone who does aim at it, and its
 *  hit area is now 46px even though it draws at 26px.
 *
 *  Controls keep their own behaviour: a press starting on a button, a link, an input or the quote
 *  is that control's press, not a grab. */
function attachFollowDrag(v){
  const list=v.querySelector("#fYoursList");
  if(!list)return;
  bindFollowDragOnce();

  list.addEventListener("pointerdown",e=>{
    const row=e.target.closest(".frow[data-id]");
    if(!row)return;
    const onGrip=Boolean(e.target.closest(".fgrip"));
    if(!onGrip&&e.target.closest("button,input,a,.fq"))return;
    if(onGrip){ fArm(row,list,e.clientY); e.preventDefault(); return; }
    fCancelPress();
    const y=e.clientY;
    fPress={row,list,x:e.clientX,y,timer:setTimeout(()=>{ fPress=null; fArm(row,list,y); },F_LONGPRESS_MS)};
  });

  // THE PIECE THAT MAKES TOUCH WORK. main is touch-action:pan-y, so once a finger is down the
  // browser will happily scroll the list out from under a drag. A non-passive touchmove that
  // preventDefaults while armed is the only thing that stops it, and it has to be non-passive or
  // the call is ignored with a console warning and no effect.
  list.addEventListener("touchmove",e=>{ if(fDrag)e.preventDefault(); },{passive:false});
  // A long press on touch raises the context menu on top of the drag we just started.
  list.addEventListener("contextmenu",e=>{ if(fDrag||fPress)e.preventDefault(); });
}
/** Tab badge. Counts only what is genuinely waiting on you; blocked items wait on a connector, and
 *  a number that includes them would nag the user about work Haii could not do. */
function setFollowBadge(n){
  const b=$("#fbdg");
  if(b){b.textContent=n;b.style.display=n?"":"none";}
}
/** Fetch the count on its own. Only for callers with nothing painted to read it off, such as a card
 *  decision landing while the user is on Today. paintFollow sets the badge from the list itself. */
async function refreshFollowBadge(){
  try{
    const d=await api("/api/v1/followups");
    setFollowBadge(d.open_yours||0);
  }catch(e){/* a badge is never worth a visible error */}
}

/* The two onboarding answers, and the ONLY definition of either list.
   Setup and the first-run questions render the same chips from what used to be two separate copies.
   They had already drifted: Setup's role list was missing "Something else", so anyone who picked it
   during onboarding opened Setup to find nothing selected under a sentence telling them they had
   set it, and no way to choose it again. Two lists that must agree are one list. */
const OWNS_OTHER = "Something else";
const OWNS_ROLES = ["Product", "Engineering", "Design", "Sales", "Operations"];
const OWNS = OWNS_ROLES.concat([OWNS_OTHER]);
const CATCH = ["Things I said I'd send", "Deadlines I gave", "Follow-ups I promised",
  "Intros I offered", "Decisions I said I'd make"];

/* ---------------- setup ---------------- */
async function renderSetup(){
  const v=$("#vSetup");
  v.innerHTML=`<div class="say"><div class="eyeb">Connections</div><h1>Give Haii your streams.</h1></div><div class="hempty">Loading…</div>`;
  try{
    const s=await api("/api/v1/connections");
    // Jobs is an admin/operator view (/api/v1/jobs is admin-gated); for a non-admin user it
    // 403s. Tolerate that so the connection cards below still render, and just hide the Jobs card.
    const jobs=await api("/api/v1/jobs").catch(()=>null);
    // Memory the user cannot see or correct is the creepy kind, and a wrong entry silently
    // degrades every future extraction. Always show it, always allow deletion.
    const mem=await api("/api/v1/memories").catch(()=>({memories:[]}));
    const get=id=>s.connections.find(c=>c.id===id)||{};
    const stBadge=(c,extra)=>{const st=extra??c.status;
      const cls=st==="connected"?"on":st==="needs_reauth"||st==="error"?"err":"off";
      return`<span class="st2 ${cls}">${st}</span>`;};
    // Every connector here is a working one. Telegram and the job controls are admin-only and sit
    // in the block at the foot of the page.
    const U=(S.feed&&S.feed.user)||{};
    const admin=Boolean(U.is_admin);
    const G=get("google"),J=get("jira"),K=get("slack"),CF=get("confluence");
    const initials=(U.name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
    // Their own words become a chip of their own. Someone who chose "Something else" and typed a
    // role had it stored in U.owns, and this list did not contain it, so Setup showed five chips
    // with none selected and silently offered no way back to what they had actually said.
    const OWN_OPTS=U.owns&&!OWNS_ROLES.includes(U.owns)?OWNS_ROLES.concat([U.owns]):OWNS_ROLES;
    const CATCH_OPTS=CATCH;
    // "You set these" is FALSE for anyone who skipped the questions, so the sentence depends on
    // whether anything is actually set. Otherwise every chip is off under a sentence claiming they
    // had chosen that.
    const setThese=Boolean(U.owns)||Boolean((U.catches||[]).length);
    // One row per notetaker. They render from one template because they ARE the same connector
    // three times over: same panel, same key field, same dedupe promise, different vendor.
    const NOTETAKERS=[
      {id:"fireflies",name:"Fireflies",c:get("fireflies"),
       hint:"Create a key in Fireflies under Settings, Developer."},
      {id:"fathom",name:"Fathom",c:get("fathom"),
       hint:"Create a key at developers.fathom.ai."},
      {id:"otter",name:"Otter",c:get("otter"),
       hint:"Otter's API is an Enterprise-plan feature, so a key will not work on Free, Pro or Business. On those plans, export to Google Drive as a Google Doc with \"transcript\" in its name, and Haii picks it up there once Google is connected."},
    ];
    // The four tools added 2026-08-09. Same one-template treatment as the notetakers, because they
    // are the same card three-and-a-bit times over. `two` marks Salesforce, which is the only one
    // with no personal API key and so needs an instance URL alongside a token. `writes` is per
    // tracker because each files a task somewhere slightly different (connectors/trackers.ts).
    const TOOLS=[
      {id:"hubspot",name:"HubSpot",group:"crm",
       hint:"Create a private app in HubSpot with crm.objects.contacts read/write and crm.objects.notes write, then paste its token."},
      {id:"salesforce",name:"Salesforce",group:"crm",two:true,
       hint:"Salesforce has no personal API key. Paste your instance URL and an access token. The token expires with its session, so expect to replace it."},
      {id:"linear",name:"Linear",group:"tracker",
       writes:"Files the one task you nodded, as an issue in the first team your key can see.",
       hint:"Create a personal API key in Linear under Settings, Security and access."},
      {id:"asana",name:"Asana",group:"tracker",
       writes:"Files the one task you nodded, assigned to you, in your first workspace.",
       hint:"Create a personal access token in Asana under My settings, Apps, Developer apps."},
    ].map(t=>({...t,c:get(t.id)}));

    // What the one Atlassian card says it is currently reading.
    const atlSub=CF.status==="connected"?"Jira issues and Confluence pages":"Jira issues";
    const SVG={
      google:'<svg width="22" height="22" viewBox="0 0 48 48" style="flex:none" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>',
      slack:'<svg width="21" height="21" viewBox="0 0 24 24" style="flex:none" aria-hidden="true"><path fill="#36C5F0" d="M5.04 15.16a2.52 2.52 0 1 1-2.52-2.52h2.52v2.52Zm1.27 0a2.52 2.52 0 0 1 5.04 0v6.32a2.52 2.52 0 1 1-5.04 0v-6.32Z"/><path fill="#2EB67D" d="M8.83 5.04a2.52 2.52 0 1 1 2.52-2.52v2.52H8.83Zm0 1.28a2.52 2.52 0 0 1 0 5.04H2.51a2.52 2.52 0 1 1 0-5.04h6.32Z"/><path fill="#ECB22E" d="M18.95 8.84a2.52 2.52 0 1 1 2.52 2.52h-2.52V8.84Zm-1.27 0a2.52 2.52 0 0 1-5.04 0V2.52a2.52 2.52 0 1 1 5.04 0v6.32Z"/><path fill="#E01E5A" d="M15.16 18.96a2.52 2.52 0 1 1-2.52 2.52v-2.52h2.52Zm0-1.27a2.52 2.52 0 0 1 0-5.04h6.32a2.52 2.52 0 1 1 0 5.04h-6.32Z"/></svg>',
      jira:'<svg width="20" height="20" viewBox="0 0 24 24" style="flex:none" aria-hidden="true"><path fill="#2684FF" d="M11.55 0 2.2 9.36a1.1 1.1 0 0 0 0 1.56l5.17 5.17 4.18-4.18V0Z"/><path fill="#2684FF" opacity=".65" d="m12.45 24 9.35-9.36a1.1 1.1 0 0 0 0-1.56l-5.17-5.17-4.18 4.18V24Z"/></svg>',
      telegram:'<svg width="22" height="22" viewBox="0 0 24 24" style="flex:none" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#2AABEE"/><path fill="#fff" d="M5.5 11.9c3.6-1.6 6-2.6 7.2-3.1 3.4-1.4 4.1-1.7 4.6-1.7.1 0 .3 0 .4.2.1.1.1.2.1.3v.4c-.2 1.8-.9 6.2-1.3 8.2-.2.9-.5 1.1-.8 1.2-.7.1-1.2-.4-1.9-.8-1-.7-1.6-1.1-2.6-1.8-1.1-.8-.4-1.2.2-1.9.2-.2 3-2.7 3-2.9v-.2s-.1-.1-.2 0c-.1 0-1.7 1.1-4.8 3.2-.5.3-.9.5-1.2.5-.4 0-1.2-.2-1.8-.4-.7-.2-1.2-.4-1.2-.7 0-.2.2-.4.7-.6Z"/></svg>',
      /* THE REAL VENDOR MARKS, not redrawn ones. Downscaled to 48px, transparent-trimmed and
         squared so they all sit optically the same at 21px, then served as static files rather
         than traced into paths: tracing a logo by eye is exactly how a wrong one shipped once. The
         Asana file arrived as a JPEG, so its white background was knocked out to transparent.
         ~2KB each, and the service worker is network-first so they cache like everything else. */
      logo:(id)=>`<img src="icons/${id}.png" width="21" height="21" alt="" aria-hidden="true" style="flex:none;border-radius:5px">`,
      atlassian:'<svg width="21" height="21" viewBox="0 0 32 32" style="flex:none" aria-hidden="true"><path fill="#2684FF" d="M9.7 14.9c-.4-.5-1.1-.4-1.4.2L.6 30.4c-.3.6.1 1.2.8 1.2h10.4c.3 0 .6-.2.8-.5 2.3-4.7.9-11.9-2.9-16.2z"/><path fill="#2684FF" opacity=".72" d="M15.2.7C11.1 7.2 11.4 14.4 14.1 19.8l5.1 10.2c.2.3.5.5.8.5h10.4c.7 0 1.1-.6.8-1.2L16.7.7c-.3-.6-1.1-.6-1.5 0z"/></svg>',
      confluence:'<svg width="21" height="21" viewBox="0 0 24 24" style="flex:none" aria-hidden="true"><path fill="#2684FF" d="M2.4 17.1c-.3.5-.1 1.1.4 1.4l4.4 2.7c.5.3 1.1.1 1.4-.4 1.7-2.8 3.1-2.6 5.6-1.4l4.3 2c.5.3 1.1 0 1.3-.5l2.1-4.7c.2-.5 0-1.1-.5-1.3-1.8-.9-5.4-2.6-8.7-2.6-4.4 0-8 2.3-10.3 4.8Z"/><path fill="#2684FF" opacity=".55" d="M21.6 6.9c.3-.5.1-1.1-.4-1.4l-4.4-2.7c-.5-.3-1.1-.1-1.4.4-1.7 2.8-3.1 2.6-5.6 1.4l-4.3-2c-.5-.3-1.1 0-1.3.5L2.1 7.8c-.2.5 0 1.1.5 1.3 1.8.9 5.4 2.6 8.7 2.6 4.4 0 8-2.3 10.3-4.8Z"/></svg>',
      chev:'<svg class="su-chev" width="11" height="7" viewBox="0 0 11 7" aria-hidden="true"><path d="M1 1.4L5.5 5.6 10 1.4" fill="none" stroke="#8A909B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      right:'<svg width="7" height="11" viewBox="0 0 7 11" style="flex:none" aria-hidden="true"><path d="M1.4 1L5.6 5.5 1.4 10" fill="none" stroke="#8A909B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
    const dot=c=>c.status==="connected"?'<span class="su-dot"></span>'
      :(c.status==="needs_reauth"||c.status==="error")?'<span class="su-dot warn"></span>':'<span class="su-dot off"></span>';
    const subOf=(c,ok,off)=>c.status==="connected"?`<span class="sub ok">${ok}</span>`
      :c.status==="needs_reauth"?'<span class="sub warn">Permission expired, reconnect</span>'
      :c.status==="error"?'<span class="sub warn">Something went wrong</span>':`<span class="sub">${off}</span>`;
    const broken=[["google",G],["slack",K],["jira",J],["confluence",CF],["fireflies",get("fireflies")],["fathom",get("fathom")],["otter",get("otter")],["hubspot",get("hubspot")],["salesforce",get("salesforce")],["linear",get("linear")],["asana",get("asana")]].filter(([,c])=>c.status==="needs_reauth"||c.status==="error");
    v.innerHTML=`
    <div class="su-head"><span class="h">Setup</span><span class="av">${esc(initials)}</span></div>

    ${broken.length?`<div class="su-grp">
      <span class="su-sec warn">Needs you</span>
      ${broken.map(([id,c])=>`<div class="su-card su-alert"><div class="su-pad">
        <div style="display:flex;flex-direction:column;gap:6px">
          <span style="font:600 16px/1.25 var(--sans);color:var(--ink)">${esc(CONN_NAME[id]||id)} stopped working</span>
          <span class="su-note">I have read nothing from it since. Reconnect it and I start reading again.</span>
        </div>
        <button class="su-btn" data-fix="${esc(id)}">Reconnect ${esc(CONN_NAME[id]||id)}</button>
      </div></div>`).join("")}
    </div>`:""}

    <div class="su-grp">
      <span class="su-sec">Read a meeting now</span>
      <div class="su-card"><div class="su-pad">
        <span class="su-note">Paste notes from any meeting, including ones I could not see. Cards come back in about ten seconds.</span>
        ${s.llm_mode==="none"?`<span class="su-note" id="noKeyNote" style="color:var(--warn)">No Claude API key is set, so nothing can be read yet. Add ANTHROPIC_API_KEY to server/.env and restart Haii.</span>`:""}
        <input id="trTitle" class="su-in" placeholder="Meeting name (optional)">
        <textarea id="trBody" class="su-in" placeholder="Paste the notes here"></textarea>
        <button class="su-btn" id="trSend">Read it</button>
      </div></div>
    </div>

    <div class="su-grp">
      <span class="su-sec">Connections</span>

      <div class="su-card">
        <button class="su-conn" data-open="google" aria-expanded="false">
          ${SVG.google}
          <span class="bd"><span class="nm">Google</span>${subOf(G,"Calendar, meeting notes, email subjects","Not connected")}</span>
          ${dot(G)}${SVG.chev}
        </button>
        <div class="su-panel" data-panel="google" hidden>
          <!-- Each row must stay literally true of connectors/gmail.ts, gcal.ts, drive.ts and docs.ts. -->
          <div class="pr"><span class="pk r">Reads</span><span class="pv">Your calendar, and the Google Docs and text files attached to an invite Haii writes you a brief for. Whether the people on a meeting card are free or busy, when Haii picks a time. The names of Google Docs changed recently, and the text of the ones named like meeting notes or a transcript. The sender, subject and short preview of recent email, as context for briefs and the morning digest.</span></div>
          <div class="pr"><span class="pk n">Never</span><span class="pv">The full text of an email, or the contents of any other Drive file.</span></div>
          <div class="pr"><span class="pk w">Writes</span><span class="pv">Only the one thing you nodded: a Gmail draft you send yourself, a calendar event and its invites, or a Google Doc Haii creates and shares with the people on the card.</span></div>
          ${s.google_client_configured?"":`<span class="su-foot" style="padding:0;color:var(--warn)">Google needs your own OAuth client first. Add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET to server/.env, set the redirect URI to your APP_URL followed by /auth/google/callback, then restart Haii.</span>`}
          <button class="su-btn ${G.status==="connected"?"ghost":""}" id="gConnect" ${s.google_client_configured?"":"disabled"}>${G.status==="connected"?"Reconnect Google":"Connect Google"}</button>
        </div>
      </div>

      <div class="su-card">
        <button class="su-conn" data-open="slack" aria-expanded="false">
          ${SVG.slack}
          <span class="bd"><span class="nm">Slack</span>${subOf(K,"DMs, listed channels, your own messages","Not connected")}</span>
          ${dot(K)}${SVG.chev}
        </button>
        <div class="su-panel" data-panel="slack" hidden>
          <!-- Each row must stay literally true of connectors/slack.ts and jobs/slackListen.ts. -->
          <div class="pr"><span class="pk r">Reads</span><span class="pv">Your DMs, group DMs and the channels you name below, every 15 minutes. Every four hours, the messages you wrote yourself anywhere in Slack, with the few messages just before each one, to find what you promised.</span></div>
          <div class="pr"><span class="pk n">Never</span><span class="pv">Anything you cannot already see yourself.</span></div>
          <div class="pr"><span class="pk w">Writes</span><span class="pv">Posts as you, only the message you nodded.</span></div>
          <input id="sChannels" class="su-in" placeholder="Channels, comma separated" value="${esc((K.channels||[]).join(", "))}">
          <button class="su-btn ghost" id="sChanSave">Save channels</button>
          ${s.slack_client_configured
            ?`<button class="su-btn ${K.status==="connected"?"ghost":""}" id="sConnect">${K.status==="connected"?"Reconnect Slack":"Connect Slack"}</button>`
            :`<span class="su-foot" style="padding:0">No Slack app is set on this server, so paste a Slack user token instead. It starts with xoxp- and comes from your own Slack app, under OAuth and Permissions.</span>
          <input id="sToken" class="su-in" type="password" placeholder="xoxp-…">
          <button class="su-btn" id="sSave">${K.status==="connected"?"Replace token and test":"Save and test"}</button>`}
        </div>
      </div>

      <!-- ONE ATLASSIAN CARD, not a Jira card and a Confluence card. They are one connection: one
           account, one API token, one site. Two cards asked for the same credential twice and
           implied two logins.

           They stay two connector rows underneath, because that is what carries the two things a
           merged card must not lose: a separate opt-in (a Jira board is not consent to read the
           whole wiki) and a separate source for the data boundary to classify. So the CREDENTIAL is
           entered once and each product is its own switch inside. -->
      <div class="su-card">
        <button class="su-conn" data-open="atlassian" aria-expanded="false">
          ${SVG.atlassian}
          <span class="bd"><span class="nm">Atlassian</span>${subOf(J,atlSub,"Not connected")}</span>
          ${dot(J)}${SVG.chev}
        </button>
        <div class="su-panel" data-panel="atlassian" hidden>
          <div class="pr"><span class="pk r">Reads</span><span class="pv">Jira issues assigned to you or reported by you, every ten minutes. Recently edited Confluence pages, if you switch it on below.</span></div>
          <div class="pr"><span class="pk n">Never</span><span class="pv">Projects or spaces you cannot already open yourself.</span></div>
          <div class="pr"><span class="pk w">Writes</span><span class="pv">Files the one Jira issue you nodded. Never writes to Confluence.</span></div>
          <span class="su-foot" style="padding:0">One token covers both. Create it at id.atlassian.com under Security.</span>
          <input id="jEmail" class="su-in" placeholder="Atlassian email" value="${esc(U.email||"")}">
          <input id="jToken" class="su-in" type="password" placeholder="API token">
          <input id="jSite" class="su-in" placeholder="Site (e.g. yourteam.atlassian.net)" value="${esc((J.meta&&J.meta.site)||"")}">
          <button class="su-btn" id="jSave">${J.status==="connected"?"Replace token and test":"Save and test"}</button>
          <div class="su-sub">
            <span class="su-lbl">What to read</span>
            <div class="su-tog"><span class="tg-n">Jira issues</span><span class="tg-s ${J.status==="connected"?"on":""}">${J.status==="connected"?"On":"Needs the token above"}</span></div>
            <div class="su-tog"><span class="tg-n">Confluence pages</span>
              <button class="su-mini ${CF.status==="connected"?"on":""}" id="cfToggle" ${J.status==="connected"?"":"disabled"}>${CF.status==="connected"?"On":"Off"}</button></div>
            ${CF.status==="connected"?`<input id="cfSpaces" class="su-in" placeholder="Space keys, comma separated (blank = all you can see)" value="${esc((CF.spaces||[]).join(", "))}">
            <button class="su-btn ghost" id="cfSave">Save spaces</button>`:""}
          </div>
        </div>
      </div>

      <!-- No second heading. There WAS a "Where work goes" group here and it was incoherent:
           it grouped by function while the Atlassian card above groups by credential, and Jira, a
           destination, sat outside the group.
           Two groups now, and only two, because only one of them is a real category: Connections
           (things Haii is wired to) and Meeting notetakers (three interchangeable options where the
           user picks ONE, which is a genuine decision the page should help with). What each
           connector reads and writes is already stated accurately in its own panel; a coarse
           heading trying to say the same thing is how it went wrong. -->
      ${TOOLS.map(t=>`
      <div class="su-card">
        <button class="su-conn" data-open="${t.id}" aria-expanded="false">
          ${SVG.logo(t.id)}
          <span class="bd"><span class="nm">${esc(t.name)}</span>${subOf(t.c,t.group==="crm"?"Notes logged against contacts":"Your assigned work, and the tasks you nod","Not connected")}</span>
          ${dot(t.c)}${SVG.chev}
        </button>
        <div class="su-panel" data-panel="${t.id}" hidden>
          <div class="pr"><span class="pk r">Reads</span><span class="pv">${t.group==="crm"?`Enough of ${esc(t.name)} to find the person a note belongs to.`:`Work assigned to you, every ten minutes, as context for briefs.`}</span></div>
          <div class="pr"><span class="pk n">Never</span><span class="pv">${t.group==="crm"?"Deal stages, amounts or owners. Haii writes notes and nothing else.":"Anything you cannot already see yourself."}</span></div>
          <div class="pr"><span class="pk w">Writes</span><span class="pv">${t.group==="crm"?"A note against one contact, only the one you nodded.":esc(t.writes||"")}</span></div>
          <span class="su-foot" style="padding:0">${t.hint}</span>
          ${t.two
            ? `<input id="k_${t.id}_url" class="su-in" placeholder="Instance URL (e.g. yourco.my.salesforce.com)" value="${esc((t.c.meta&&t.c.meta.instance_url)||"")}">
               <input id="k_${t.id}" class="su-in" type="password" placeholder="Access token">`
            : `<input id="k_${t.id}" class="su-in" type="password" placeholder="${esc(t.name)} token">`}
          <button class="su-btn" data-tool-save="${t.id}">${t.c.status==="connected"?"Replace and test":"Save and test"}</button>
          ${t.c.status==="connected"?`<button class="su-btn ghost" data-tool-off="${t.id}">Turn off</button>`:""}
        </div>
      </div>`).join("")}

      <span class="su-sec" style="margin-top:18px">Meeting notetakers</span>
      <div class="su-note-hd">Any one of these covers Teams and Zoom without connecting either. If two of them catch the same meeting, Haii reads one and ignores the rest, so you never get the same card twice.</div>
      ${NOTETAKERS.map(n=>`
      <div class="su-card">
        <button class="su-conn" data-open="${n.id}" aria-expanded="false">
          ${SVG.logo(n.id)}
          <span class="bd"><span class="nm">${esc(n.name)}</span>${subOf(n.c,"Recordings, transcribed","Not connected")}</span>
          ${dot(n.c)}${SVG.chev}
        </button>
        <div class="su-panel" data-panel="${n.id}" hidden>
          <div class="pr"><span class="pk r">Reads</span><span class="pv">Transcripts of meetings ${esc(n.name)} recorded for you, every ten minutes.</span></div>
          <div class="pr"><span class="pk n">Never</span><span class="pv">Meetings it did not record. It sees what your own ${esc(n.name)} account sees.</span></div>
          <div class="pr"><span class="pk w">Writes</span><span class="pv">Nothing back to ${esc(n.name)}. This one only reads.</span></div>
          <span class="su-foot" style="padding:0">${n.hint}</span>
          <input id="k_${n.id}" class="su-in" type="password" placeholder="${esc(n.name)} API key">
          <button class="su-btn" data-nt-save="${n.id}">${n.c.status==="connected"?"Replace key and test":"Save and test"}</button>
          ${n.c.status==="connected"?`<button class="su-btn ghost" data-nt-off="${n.id}">Turn off</button>`:""}
        </div>
      </div>`).join("")}

      ${admin?`<div class="su-card">
        <div class="su-conn" style="cursor:default">
          ${SVG.telegram}
          <span class="bd"><span class="nm">Telegram</span><span class="sub">${s.telegram_configured?"Bot token set":"Not configured"}</span></span>
          <button class="su-btn ghost" id="tgConnect" style="width:auto;min-height:38px;padding:0 16px;font-size:14px">Link</button>
        </div>
      </div>
      <span class="su-foot">Optional, and only admins see it. Linking needs TELEGRAM_BOT_TOKEN, TELEGRAM_BOT_USERNAME and TELEGRAM_WEBHOOK_SECRET in server/.env, and the bot's webhook pointed at this server from an address Telegram can reach.</span>`:""}
    </div>

    <div class="su-grp">
      <span class="su-sec">What I look for</span>
      <div class="su-card"><div class="su-pad">
        <span class="su-note">${setThese?"You set these. Change them any time and the next read will follow.":"Nothing set yet. Pick what matters and the next read will follow."}</span>
        <div style="display:flex;flex-direction:column;gap:9px">
          <span class="su-lbl">You own</span>
          <div class="su-chips">${OWN_OPTS.map(o=>`<button class="su-chip ${U.owns===o?"on":""}" data-own="${esc(o)}">${esc(o)}</button>`).join("")}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:9px">
          <span class="su-lbl">Catch</span>
          <div class="su-chips">${CATCH_OPTS.map(o=>`<button class="su-chip ${(U.catches||[]).includes(o)?"on":""}" data-catch="${esc(o)}">${esc(o)}</button>`).join("")}</div>
        </div>
      </div></div>
    </div>

    <div class="su-grp">
      <span class="su-sec">What Haii has learned</span>
      <!-- Folded to three. This was a flat list, and it was fine at two facts and unreadable at
           forty: the backfill turned a short paragraph into most of the Setup page, and it pushed
           everything below it off screen. Newest first is already how listMemories orders them, so
           the three on show are the three most recently learned, which is also the most interesting
           answer to "what has it picked up lately". -->
      <div class="su-card" style="padding:6px 18px">
        ${(mem.memories||[]).length
          ? (mem.memories||[]).map((m,i)=>`<div class="su-mem${i>=3&&!memOpen?" folded":""}"><span class="mt">${esc(m.content)}</span><button class="btn-mini memdel" data-id="${m.id}">forget</button></div>`).join("")
          : '<div class="su-mem"><span class="mt" style="color:var(--mut)">Nothing yet. As I read your meetings I note the things that keep coming up.</span></div>'}
        ${(mem.memories||[]).length>3
          ? `<button class="su-memmore" id="memMore">${memOpen?"Show less":`Show all ${(mem.memories||[]).length}`}</button>`
          : ""}
      </div>
      <span class="su-foot">Forgetting removes it. If it comes up again in a later meeting, I may learn it again, and you can delete it again here.</span>
    </div>

    <div class="su-grp">
      <span class="su-sec">You</span>
      <div class="su-card"><div class="su-pad">
        <span class="su-note">${esc(U.name||"")}${U.email?` · ${esc(U.email)}`:""}${U.role?`<br>${esc(U.role)}`:""}${U.created_at?`<br>With Haii since ${new Date(U.created_at).toLocaleDateString()}`:""}</span>
        <span class="su-lbl">Timezone</span>
        <span class="su-note" style="margin-top:-6px">Decides when your briefs are written and when your digest arrives. Follows your device unless you set it.</span>
        <select id="tzSel" class="su-in"></select>
        <button class="su-btn ghost" id="tzSave">Save timezone</button>
        <button class="su-danger" id="tzAuto" style="color:var(--mut)">Use my device instead</button>
      </div></div>
    </div>

    ${U.email?`<div class="su-grp">
      <div class="su-card"><div class="su-pad"><button class="su-danger" id="signOut">Sign out</button></div></div>
    </div>`:""}

    ${admin?`<div class="su-grp"><div class="su-op">
      <div class="oh">Advanced</div>
      <div class="orow"><span class="ok2">Model</span><span class="ov">${s.llm_mode==="api"?"Claude API key set":"No key set"}</span></div>
      ${s.budget?`<div class="orow"><span class="ok2">Spend today</span><span class="ov">$${(s.budget.spend_today||0).toFixed(2)} of $${(s.budget.hard||0).toFixed(2)} daily cap</span></div>`:""}
      ${jobs?`<div class="sc-row" style="margin-top:14px">
        <button class="btn2 ghost jrun" data-job="gmail_poll">Gmail</button>
        <button class="btn2 ghost jrun" data-job="gcal_poll">Calendar</button>
        <button class="btn2 ghost jrun" data-job="drive_poll">Drive</button>
      </div>
      <div class="sc-row">
        <button class="btn2 ghost jrun" data-job="jira_poll">Jira</button>
        <button class="btn2 ghost jrun" data-job="slack_poll">Slack</button>
        <button class="btn2 ghost jrun" data-job="morning_digest">Digest</button>
        <button class="btn2 ghost jrun" data-job="brief_batch">Pre-brief</button>
      </div>
      <div id="jobRows">${(jobs.runs||[]).slice(0,10).map(r=>`<div class="jrow"><span class="${r.status}">${r.status}</span><span class="jn">${esc(r.job)}</span><span>${esc((r.detail||"").slice(0,42))}</span></div>`).join("")||'<div class="sc-note">no runs yet</div>'}</div>`:""}
      ${s.slack_client_configured?`<details style="margin-top:14px"><summary class="sc-note" style="cursor:pointer;color:#8A909B">Paste a Slack token instead</summary>
        <div style="margin-top:9px;display:flex;flex-direction:column;gap:9px">
          <input id="sToken" type="password" placeholder="xoxp-…">
          <button class="btn2 ghost" id="sSave">Save and test</button>
        </div></details>`:""}
    </div></div>`:""}`;

    // Connector panels. Collapsed by default: the Reads/Never/Writes block is reassurance, and
    // reassurance you have to scroll past every visit stops being read.
    v.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{
      const p=v.querySelector(`[data-panel="${b.dataset.open}"]`);
      if(!p)return;
      const open=p.hidden;
      p.hidden=!open;
      b.setAttribute("aria-expanded",String(open));
    }));
    // The two answers are editable here, or "what I look for" is a receipt rather than a setting.
    // Owns is single select and re-picking clears it; catch is a set.
    const saveAnswers=async(owns,catches)=>{
      try{await api("/api/v1/onboarding/answers",{method:"POST",body:JSON.stringify({owns,catches})});
        await loadFeed();renderSetup();}
      catch(e){toast("err","Could not save",e.message);}
    };
    v.querySelectorAll("[data-own]").forEach(b=>b.addEventListener("click",()=>{
      const val=b.dataset.own;
      saveAnswers(U.owns===val?"":val,U.catches||[]);
    }));
    v.querySelectorAll("[data-catch]").forEach(b=>b.addEventListener("click",()=>{
      const val=b.dataset.catch,set=new Set(U.catches||[]);
      set.has(val)?set.delete(val):set.add(val);
      saveAnswers(U.owns||"",[...set]);
    }));

    // Timezone. Populated from the platform's own zone list rather than a hand-kept array, which
    // would be wrong the next time a country moves its clocks.
    (()=>{
      const sel=$("#tzSel");if(!sel)return;
      const cur=(S.feed&&S.feed.user&&S.feed.user.tz)||"";
      let zones=[];
      try{zones=Intl.supportedValuesOf("timeZone");}catch(e){zones=cur?[cur]:[];}
      if(cur&&!zones.includes(cur))zones=[cur].concat(zones);
      sel.innerHTML=zones.map(z=>`<option value="${esc(z)}"${z===cur?" selected":""}>${esc(z)}</option>`).join("");
      $("#tzSave").addEventListener("click",async()=>{
        try{await api("/api/v1/me/timezone/pin",{method:"POST",body:JSON.stringify({timezone:sel.value})});
          toast("info","Timezone saved",sel.value);await loadFeed();renderSetup();}
        catch(e){toast("err","Could not save",e.message);}
      });
      $("#tzAuto").addEventListener("click",async()=>{
        try{await api("/api/v1/me/timezone/pin",{method:"POST",body:JSON.stringify({pinned:false})});
          // Re-report the device zone immediately, so "use my device" takes effect now rather than
          // on the next boot.
          const dz=Intl.DateTimeFormat().resolvedOptions().timeZone;
          await api("/api/v1/me/timezone",{method:"POST",body:JSON.stringify({timezone:dz,locale:navigator.language})}).catch(()=>{});
          toast("info","Following your device",dz);await loadFeed();renderSetup();}
        catch(e){toast("err","Could not switch",e.message);}
      });
    })();
    const post=async(path,body,okMsg)=>{try{const r=await api(path,{method:"POST",body:JSON.stringify(body)});toast("info",okMsg,r.detail);renderSetup();loadFeed();}catch(e){toast("err","Failed",e.message);}};
    $("#trSend").addEventListener("click",async()=>{
      const btn=$("#trSend");btn.disabled=true;btn.textContent="Haii is reading…";
      try{const r=await api("/api/v1/transcripts",{method:"POST",body:JSON.stringify({title:$("#trTitle").value,content:$("#trBody").value})});
        toast("info","Meeting read",r.extraction);$("#trBody").value="";await loadFeed();tab("today");
      }catch(e){toast("err","Could not read it",e.message);}finally{btn.disabled=false;btn.textContent="Read it";}
    });
    // "Needs you" is a shortcut, not a second implementation. Google, Slack (with a Slack app) and
    // Confluence reconnect with one button, so it presses that button. Everything else reconnects
    // by pasting a new key, so it opens that connector's own panel and scrolls to it. Pressing
    // another connector's Save here would post an empty form and show an unrelated error.
    v.querySelectorAll("[data-fix]").forEach(b=>b.addEventListener("click",()=>{
      const id=b.dataset.fix;
      const direct=id==="google"?$("#gConnect"):id==="slack"?$("#sConnect"):id==="confluence"?$("#cfToggle"):null;
      if(direct&&!direct.disabled)return direct.click();
      const key=(id==="jira"||id==="confluence")?"atlassian":id;
      const opener=v.querySelector(`[data-open="${key}"]`),panel=v.querySelector(`[data-panel="${key}"]`);
      if(panel&&panel.hidden&&opener)opener.click();
      if(opener)opener.scrollIntoView({block:"center"});
    }));
    v.querySelectorAll(".memdel").forEach(b=>b.addEventListener("click",async()=>{
      b.disabled=true;
      try{await api(`/api/v1/memories/${b.dataset.id}`,{method:"DELETE"});renderSetup();}
      catch(e){toast("err","Could not forget",e.message);b.disabled=false;}
    }));
    $("#gConnect").addEventListener("click",()=>{location.href="/auth/google/connect";});
    $("#jSave").addEventListener("click",()=>post("/api/v1/connections/jira",{email:$("#jEmail").value.trim(),api_token:$("#jToken").value.trim(),site:$("#jSite").value.trim()},"Jira connected"));
    const sConnect=$("#sConnect");
    if(sConnect)sConnect.addEventListener("click",()=>{location.href="/auth/slack/connect";});
    // The channel allowlist is Haii's own setting, not part of the Slack grant, so it saves on its
    // own rather than forcing a reconnect. Sends no token, which leaves the stored one untouched.
    const sChanSave=$("#sChanSave");
    if(sChanSave)sChanSave.addEventListener("click",()=>post("/api/v1/connections/slack/channels",{channels:$("#sChannels").value},"Channel list saved"));
    const sSave=$("#sSave");
    if(sSave)sSave.addEventListener("click",()=>post("/api/v1/connections/slack",{user_token:$("#sToken").value.trim(),channels:($("#sChannels")||{}).value||""},"Slack connected"));
    // All three notetakers through one handler and one endpoint, because they differ only in which
    // vendor validates the key.
    v.querySelectorAll("[data-nt-save]").forEach(b=>b.addEventListener("click",()=>{
      const id=b.dataset.ntSave;
      post("/api/v1/connections/notetaker",{vendor:id,api_key:($("#k_"+id)||{}).value.trim()},"Connected");
    }));
    v.querySelectorAll("[data-nt-off]").forEach(b=>b.addEventListener("click",()=>{
      post("/api/v1/connections/notetaker",{vendor:b.dataset.ntOff,enabled:false},"Turned off");
    }));
    const memMore=$("#memMore");
    if(memMore)memMore.addEventListener("click",()=>{ memOpen=!memOpen; renderSetup(); });
    v.querySelectorAll("[data-tool-save]").forEach(b=>b.addEventListener("click",()=>{
      const id=b.dataset.toolSave;
      const body={vendor:id};
      if(id==="salesforce"){
        body.instance_url=($("#k_salesforce_url")||{}).value.trim();
        body.access_token=($("#k_salesforce")||{}).value.trim();
      } else {
        body.api_key=($("#k_"+id)||{}).value.trim();
      }
      post("/api/v1/connections/tool",body,"Connected");
    }));
    v.querySelectorAll("[data-tool-off]").forEach(b=>b.addEventListener("click",()=>{
      post("/api/v1/connections/tool",{vendor:b.dataset.toolOff,enabled:false},"Turned off");
    }));
    // Confluence is now a switch inside the Atlassian card rather than a second connection.
    // Confluence collects no credentials, so "connect" here means opt in and prove the Atlassian
    // token already on file can actually reach a wiki. Turning it off leaves Jira alone.
    const cfToggle=$("#cfToggle");
    if(cfToggle)cfToggle.addEventListener("click",()=>post("/api/v1/connections/confluence",
      {enabled:CF.status!=="connected",spaces:($("#cfSpaces")||{}).value||""},
      CF.status==="connected"?"Confluence turned off":"Confluence turned on"));
    const cfSave=$("#cfSave");
    if(cfSave)cfSave.addEventListener("click",()=>post("/api/v1/connections/confluence",{enabled:true,spaces:$("#cfSpaces").value},"Spaces saved"));
    // Guarded: the Telegram card is admin-only, so this element does not exist for everyone else
    // and an unguarded addEventListener here would throw and silently kill every handler wired below
    // it, including Sign out.
    const tgConnect=$("#tgConnect");
    if(tgConnect)tgConnect.addEventListener("click",async()=>{
      try{
        const r=await api("/api/v1/telegram/link");
        if(!r.configured){toast("info","Telegram is not set up on this server","Add TELEGRAM_BOT_USERNAME and TELEGRAM_WEBHOOK_SECRET to server/.env");return;}
        window.open(r.url,"_blank");
        toast("info","Tap Start in Telegram to link");
      }catch(e){toast("err","Couldn't start Telegram link",e.message);}
    });
    v.querySelectorAll(".jrun").forEach(b=>b.addEventListener("click",async()=>{
      b.disabled=true;try{const r=await api(`/api/v1/jobs/${b.dataset.job}/run`,{method:"POST"});toast("info",b.dataset.job,r.detail);renderSetup();}catch(e){toast("err",b.dataset.job,e.message);}finally{b.disabled=false;}
    }));
    // SIGN OUT ASKS FIRST. It ends the session and returns you to a Google login. Cheap to undo in
    // principle and annoying in practice, and it sits near the bottom of a page people scroll to
    // the end of. Two taps, and the confirm says what actually happens: nothing is deleted, you just
    // have to sign in.
    // Only rendered for a signed-in account (one with an email). A local install has no sign-in,
    // so there is nothing to sign out of, and the guard keeps a missing button from throwing.
    const signOut=$("#signOut");
    if(signOut)signOut.addEventListener("click",()=>{
      const btn=$("#signOut");
      if(btn.dataset.armed!=="1"){
        btn.dataset.armed="1";
        btn.textContent="Tap again to sign out";
        const note=document.createElement("p");
        note.className="su-foot"; note.id="soNote";
        note.textContent="Nothing is deleted. You will need to sign in with Google again.";
        btn.insertAdjacentElement("afterend",note);
        // Disarms itself, so a stray tap cannot leave a primed button waiting on the page.
        setTimeout(()=>{ if(btn.dataset.armed==="1"){ btn.dataset.armed=""; btn.textContent="Sign out"; const n=$("#soNote"); if(n)n.remove(); } },6000);
        return;
      }
      (async()=>{
        try{await api("/auth/logout",{method:"POST"});}catch(e){}
        location.href="/login.html";
      })();
    });
  }catch(e){v.innerHTML+=`<div class="hempty">${esc(e.message)}</div>`;}
}

/* ---------------- tabs ---------------- */
function tab(which){
  // First. The tab bar is hidden during first run, but a #setup hash or a stray call can still
