  // reach here, and half-applying the switch would tear that view out from under the user while
  // leaving the rest of the app hidden.
  if(obActive())return;
  // A reorder is held for 450ms so a run of taps costs one request. Leaving the tab inside that
  // window must not throw the order away, so it goes out now.
  if(which!=="follow")flushOrderNow();
  $("#vToday").hidden=which!=="today";
  $("#vFollow").hidden=which!=="follow";
  $("#vHistory").hidden=which!=="history";
  $("#vSetup").hidden=which!=="setup";
  $("#tabToday").classList.toggle("on",which==="today");
  $("#tabFollow").classList.toggle("on",which==="follow");
  $("#tabHistory").classList.toggle("on",which==="history");
  $("#tabSetup").classList.toggle("on",which==="setup");
  if(which==="follow")renderFollow();
  if(which==="history")renderHistory();
  if(which==="setup")renderSetup();
}
$("#tabToday").addEventListener("click",()=>tab("today"));
$("#tabFollow").addEventListener("click",()=>tab("follow"));
$("#tabHistory").addEventListener("click",()=>tab("history"));
$("#tabSetup").addEventListener("click",()=>tab("setup"));

/* ---------------- first run ----------------
   Server-owned: S.feed.onboarding names the step, so a refresh resumes rather than restarting and
   nobody sits through the backfill twice. An account whose step is 'done' never renders any of
   this. */
/** `obOwns` is the CHIP that is lit. `obOwnsOther` is what they typed under "Something else", and
 *  it has to be its own variable: the panel re-renders on every chip tap, so anything living only
 *  in the input's value was destroyed by the next tap the user made. OWNS and CATCH are defined
 *  once, above renderSetup, and shared with it. */
let obPoll = null, obOwns = "", obOwnsOther = "", obCatch = null;
/** Is the learned-memories list expanded? View state, so it lives here and survives a re-render of
 *  Setup but not a reload, which is the right lifetime for "I opened this to read it". */
let memOpen = false;

const onbStep = () => (S.feed && S.feed.onboarding) || "done";
const obActive = () => onbStep() !== "done";

async function obAdvance(state) {
  try { await api("/api/v1/onboarding/state", { method: "POST", body: JSON.stringify({ state }) }); }
  catch (e) { toast("err", "Could not continue", e.message); return; }
  if (S.feed) S.feed.onboarding = state;
  if (state === "done") { if (obPoll) { clearInterval(obPoll); obPoll = null; } await loadFeed(); tab("today"); }
  applyOnboarding();
}

function renderOnboard() {
  const v = $("#vOnboard");
  // A local install has no sign-in to learn a name from, and extraction cannot find what YOU
  // promised without knowing which speaker is you. So this comes before everything else.
  if (needsName()) return obName(v);
  const step = onbStep();
  // Nothing connected means there is no week to read back, so do not stage a reading screen that
  // can only ever report zero meetings.
  if (step === "new" && !googleConnected()) return obLocal(v);
  if (step === "new") return obReadingStart(v);
  if (step === "reading") return obReading(v);
  if (step === "first") return obFirst(v);
  if (step === "questions") return obQuestions(v);
  // brief and nod hand straight over to the real product rather than being staged here: the brief
  // overlay and the deck already exist and are the genuine article, and a rehearsal of them would
  // be a second implementation to keep in step.
  return obAdvance("done");
}

const needsName = () => Boolean(S.feed && S.feed.user && S.feed.user.needs_name);
const googleConnected = () => Boolean(S.feed && (S.feed.connections || []).some((c) => c.id === "google" && c.status === "connected"));

/** Ask who the user is. Re-rendering under someone who is typing would take the caret and the text
 *  with it, and this screen is repainted on every feed load, so it paints once and then leaves the
 *  form alone. */
function obName(v) {
  if ($("#obNameIn")) return;
  v.innerHTML = `<div class="ob-eyebrow">Welcome</div>
    <h1 class="ob-h">What do people call you in a meeting?</h1>
    <p class="ob-s">Haii looks for what you promised, so it has to know which speaker is you. Use the name that shows up in your meeting notes.</p>
    <input class="ob-in" id="obNameIn" maxlength="60" autocomplete="given-name" placeholder="Your first name">
    <input class="ob-in" id="obRoleIn" maxlength="140" placeholder="What you do, in a few words. Optional" style="margin-top:10px">
    <button class="ob-cta" id="obNameGo" style="margin-top:18px">Continue</button>
    <p class="ob-note">Just looking? <a href="/?demo">Open the demo week</a>. It runs on fictional meetings and needs no key.</p>`;
  const go = async () => {
    const name = $("#obNameIn").value.trim(), role = $("#obRoleIn").value.trim();
    if (!name) { toast("err", "A name first", "Haii needs to know which speaker is you."); $("#obNameIn").focus(); return; }
    const b = $("#obNameGo"); b.disabled = true;
    try { await api("/api/v1/me", { method: "POST", body: JSON.stringify({ name, role }) }); }
    catch (e) { toast("err", "Could not save", e.message); b.disabled = false; return; }
    if (S.feed && S.feed.user) { S.feed.user.name = name; S.feed.user.role = role; S.feed.user.needs_name = false; }
    v.innerHTML = "";
    applyOnboarding();
  };
  $("#obNameGo").addEventListener("click", go);
  $("#obNameIn").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  $("#obRoleIn").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}

/** First run with nothing connected: say what Haii does and how to feed it, then get out of the
 *  way. Painted once for the same reason as the name screen. */
function obLocal(v) {
  if ($("#obLocalGo")) return;
  v.innerHTML = `<div class="ob-eyebrow">How it works</div>
    <h1 class="ob-h">Give Haii a meeting and it finds what you promised.</h1>
    <p class="ob-s">Each promise becomes a card with the sentence you said. Nod and Haii does it. Shake and it goes away.</p>
    <p class="ob-s">Nothing is connected yet, so there is no week to read back. Paste a transcript in Setup, or connect Google and Haii reads your meetings on its own.</p>
    <button class="ob-cta" id="obLocalGo">Continue</button>`;
  $("#obLocalGo").addEventListener("click", () => obAdvance("questions"));
}

/** Kick the backfill. Fired once; the server flips the step so a refresh cannot double-start it. */
async function obReadingStart(v) {
  v.innerHTML = `<div class="ob-eyebrow">Setting up</div>
    <h1 class="ob-h">Reading your last week.</h1>
    <p class="ob-s">I'm going through the meetings you've already had, so you start with something rather than an empty screen.</p>
    <div class="ob-track"><div class="ob-fill" style="width:6%"></div></div>`;
  try {
    const p = await api("/api/v1/onboarding/start", { method: "POST" });
    if (S.feed) S.feed.onboarding = "reading";
    obPaint(v, p);
    obWatch(v);
  } catch (e) {
    // THIS IS ONE OF THE FIRST SCREENS A NEW USER SEES, and it used to append an error line and
    // stop. The nav is hidden during onboarding, so one failed request on a phone with two bars
    // meant a dead screen with no retry, no skip and no tab bar: the whole product, over.
    // Two ways out, and neither of them asks the user to understand what went wrong.
    v.innerHTML += `<p class="ob-note">${esc(e.message || "Could not start")}</p>
      <button class="ob-cta" id="obRetry">Try again</button>
      <button class="ob-skip" id="obSkipRead">Skip this and go to the app</button>`;
    const r = $("#obRetry"); if (r) r.addEventListener("click", () => obReadingStart(v));
    const s = $("#obSkipRead"); if (s) s.addEventListener("click", () => obAdvance("first"));
  }
}
function obReading(v) { obWatch(v); }

/** How long the reading screen waits before it stops pretending something is still happening.
 *  Generous: six meetings through the model is tens of seconds and a slow one is longer. */
const OB_STALL_MS = 120000;

/** Poll progress. Cheap read, no model calls, so a 2s cadence costs nothing.
 *
 *  The Next button only renders when the server says `done`, so before this the screen had exactly
 *  one way forward and no timeout on it. A backfill that stalled (a wedged extract, a connector
 *  throwing on every retry) held the user on "Reading your last week." for as long as they were
 *  willing to sit there, with the nav hidden. Now it gives up out loud and lets them in. */
function obWatch(v) {
  if (obPoll) clearInterval(obPoll);
  const startedAt = Date.now();
  let lastRead = -1, lastMoveAt = Date.now();
  const tick = async () => {
    try {
      const p = await api("/api/v1/onboarding/progress");
      // Progress, not just elapsed time: a slow backfill that is still finishing meetings must
      // never be cut off, and a fast one that wedges at meeting two should not wait the full clock.
      if ((p.read || 0) !== lastRead) { lastRead = p.read || 0; lastMoveAt = Date.now(); }
      obPaint(v, p, Date.now() - lastMoveAt > OB_STALL_MS);
      if (p.done) { clearInterval(obPoll); obPoll = null; }
    } catch (e) {
      // A failed poll is still not worth a banner, but a run of them is worth an exit.
      if (Date.now() - startedAt > OB_STALL_MS) obPaint(v, { meetings: [], total: 0, readable: 0, read: 0, unreadable: 0 }, true);
    }
  };
  obPoll = setInterval(tick, 2000);
  tick();
}

/** How many meetings the list shows before it starts counting instead of naming. Twelve rather than
 *  nine, because a busy week overflowed silently and a list that quietly stops is the same failure
 *  as a meeting we never mention. */
const OB_ROWS = 12;

function obPaint(v, p, stalled) {
  const total = p.total || 0;
  const target = Math.min(p.readable || 0, 6);
  const pct = target ? Math.round((p.read / target) * 100) : (total ? 100 : 6);
  const rows = (p.meetings || []).slice(0, OB_ROWS).map((m) => {
    // Three states, and the unreadable one is named out loud. Many meetings produce no
    // transcript; a user who is not told that concludes the product is broken.
    const cls = !m.readable ? "dim" : "";
    const dot = m.read ? '<span class="ob-dot on">✓</span>'
      : m.readable ? '<span class="ob-dot wait">·</span>'
      : '<span class="ob-dot">–</span>';
    const state = m.read ? "read" : m.readable ? "reading" : "no notes";
    return `<div class="ob-row ${cls}">${dot}<span class="rt">${esc(m.title)}</span><span class="rs">${state}</span></div>`;
  }).join("");
  // State, not an action. `read` counts every meeting that HAS been read, which for a brand new
  // account is exactly what this backfill just did, but on a replayed first run includes ones read
  // weeks ago. "Read 12 of your meetings" then claims work it did not do. What is true either way
  // is how many are in.
  const head = p.done
    ? `<h1 class="ob-h">${p.read} of your meetings ${p.read === 1 ? "is" : "are"} in.</h1>`
    : `<h1 class="ob-h">Reading your last week.</h1>`;
  // Readable meetings the cap did not reach. Saying nothing about them would be a silent gap:
  // notes exist, Haii has not read them, and the user cannot tell.
  const waiting = Math.max(0, (p.readable || 0) - (p.read || 0));
  const bits = [];
  if (p.unreadable) bits.push(`${p.unreadable} had no notes to read, so I can't see what was said in ${p.unreadable === 1 ? "it" : "them"}.`);
  if (waiting) bits.push(`${waiting} more ${waiting === 1 ? "has notes and I'll get to it" : "have notes and I'll get to them"} as you go.`);
  const sub = p.done
    ? `<p class="ob-s">${bits.length ? bits.join(" ") : "That's everything from the last seven days."}</p>`
    : `<p class="ob-s">I'm going through the meetings you've already had, so you start with something rather than an empty screen.</p>`;
  const more = total > OB_ROWS
    ? `<div class="ob-note" style="margin-top:2px">and ${total - OB_ROWS} more from the same week</div>`
    : "";
  // Stalled: say so plainly and hand the product over. Never a spinner that outlives the work.
  const stall = !p.done && stalled
    ? `<p class="ob-note">This is taking longer than it should. Nothing is lost, and anything still readable turns up on its own. You don&rsquo;t have to wait here.</p>`
    : "";
  v.innerHTML = `<div class="ob-eyebrow">Setting up</div>${head}${sub}
    <div class="ob-track"><div class="ob-fill" style="width:${Math.max(6, Math.min(100, pct))}%"></div></div>
    <div class="ob-rows">${rows || '<div class="ob-note">No meetings in the last seven days yet.</div>'}</div>${more}${stall}
    ${p.done || stalled ? `<button class="ob-cta" id="obNext">${p.done ? "Next" : "Carry on"}</button>` : ''}`;
  const b = $("#obNext");
  if (b) b.addEventListener("click", () => obAdvance("first"));
}

/** How good a first impression is each card type?
 *
 *  Ordered by whether the outcome is VISIBLE within seconds. A calendar event appears in a calendar
 *  the user can go and look at; a to-do lands in a list they have not learned about yet. A first
 *  card that produces nothing they can see teaches the wrong lesson about the whole product. */
const OB_FIRST_RANK = {
  create_calendar_event: 5,
  create_document: 4,
  send_email: 3,
  send_slack_message: 3,
  create_task: 2,
  create_crm_note: 2,
  share_file: 2,
  create_jira_issue: 1,
  create_todo: 0,
};

/** THE FIRST CARD.
 *
 *  The reading screen used to end on a Next button, so the moment Haii exists FOR, seeing a promise
 *  you made and forgot, was never staged: the user was handed two questions and then dropped into a
 *  deck to find it themselves. This screen shows the best thing the backfill found and lets them do
 *  it, one gesture, inside the first minute.
 *
 *  DELIBERATELY NOT THE SWIPE DECK. Re-rendering the real deck here would be a second implementation
 *  of the card to keep in step, which is the trap renderOnboard's own comment warns about. This is a
 *  purpose-built screen that approves through the REAL decision endpoint, so the execution, the undo
 *  grace and the failure handling are all the genuine article.
 *
 *  Skipped silently when the backfill found nothing. An empty stage is worse than no stage: it turns
 *  "you had a quiet week" into "this product has nothing for you". */
async function obFirst(v) {
  v.innerHTML = `<div class="ob-eyebrow">One you already made</div>
    <h1 class="ob-h">Looking through what I found.</h1>`;
  let card = null;
  try {
    const feed = await api("/api/v1/feed");
    // Never the practice card: this screen says "you said this out loud", and nobody said that one.
    const cards = (feed.cards || []).filter((c) => c.status === "proposed" && !c.simulated);
    card = cards.slice().sort((a, b) =>
      ((OB_FIRST_RANK[b.actionType] ?? 0) - (OB_FIRST_RANK[a.actionType] ?? 0)) ||
      ((b.confidence || 0) - (a.confidence || 0)))[0] || null;
  } catch (e) { /* a failed read is not a reason to trap someone on the first run */ }
  if (!card) return obAdvance("questions");

  const why = (card.context && card.context.why && card.context.why[0]) || null;
  const t = TYPES[card.actionType] || {};
  const src = (card.sourceJson && card.sourceJson.title) || "";
  v.innerHTML = `<div class="ob-eyebrow">One you already made</div>
    <h1 class="ob-h">You said this out loud.</h1>
    ${why ? `<div class="fq ob-fq"><span class="fqt">&ldquo;${esc(why.text)}&rdquo;</span>
      <span class="fw">${esc(why.who || "you")}${src ? ` · ${esc(src)}` : ""}</span></div>` : ""}
    <div class="ob-receipt"><span class="rl">${esc(t.label || "Haii can do this")}</span>
      <div class="rb">${esc(card.title)}</div></div>
    <p class="ob-s">Nod it and Haii does it now. You can undo for a few seconds after.</p>
    <button class="ob-cta" id="obDo">Do it</button>
    <button class="ob-skip" id="obNotThis">Not this one</button>`;

  $("#obDo").addEventListener("click", async () => {
    const b = $("#obDo");
    b.disabled = true; b.textContent = "On it";
    try {
      await api(`/api/v1/cards/${card.id}/decision`, {
        method: "POST",
        body: JSON.stringify({ decision: "approved", latency_ms: 1200, via: "onboarding" }),
      });
    } catch (e) {
      // The gesture must still produce the thing, or say honestly that the outside world failed.
      toast("err", "Could not do that one", e.message);
      b.disabled = false; b.textContent = "Do it";
      return;
    }
    v.innerHTML = `<div class="ob-eyebrow">Done</div>
      <h1 class="ob-h">That is the whole product.</h1>
      <p class="ob-s">You said it, Haii caught it, and it is handled. It does that for every meeting from here.</p>
      <button class="ob-cta" id="obOn">Keep going</button>`;
    $("#obOn").addEventListener("click", () => obAdvance("questions"));
  });
  $("#obNotThis").addEventListener("click", () => obAdvance("questions"));
}

/** Two questions, both skippable, both fed to extraction as the user's own words. */
function obQuestions(v) {
  const opt = (label, on, group) =>
    `<button class="ob-opt ${on ? "on" : ""}" data-g="${group}" data-v="${esc(label)}">${esc(label)}</button>`;
  v.innerHTML = `<div class="ob-eyebrow">Two questions</div>
    <h1 class="ob-h">What do you own?</h1>
    <p class="ob-s">So I know which promises are yours to keep.</p>
    <div class="ob-opts">${OWNS.map((o) => opt(o, obOwns === o, "owns")).join("")}</div>
    ${obOwns === OWNS_OTHER ? `<input class="ob-in" id="obOther" maxlength="120" placeholder="Tell me in your own words" value="${esc(obOwnsOther)}">` : ""}
    <h1 class="ob-h">What should I catch?</h1>
    <p class="ob-s">Pick as many as fit. You can change this later.</p>
    <div class="ob-opts">${CATCH.map((cc) => opt(cc, (obCatch || []).includes(cc), "catch")).join("")}</div>
    <button class="ob-cta" id="obSave">Done</button>
    <button class="ob-skip" id="obSkip">Skip for now</button>
    <p class="ob-note">${googleConnected()?"From here Haii reads each meeting after it ends, and writes you a brief before the next one starts.":"Next, open Setup and paste a meeting. Your cards arrive in the deck."}</p>`;
  v.querySelectorAll("[data-g]").forEach((b) => b.addEventListener("click", () => {
    const val = b.dataset.v;
    if (b.dataset.g === "owns") obOwns = obOwns === val ? "" : val;
    else {
      const set = new Set(obCatch || []);
      set.has(val) ? set.delete(val) : set.add(val);
      obCatch = [...set];
    }
    obQuestions(v);
  }));
  // Hold every keystroke in a variable that survives a re-render, and do NOT re-render on input:
  // rebuilding the panel under a typing user would take the caret with it. Both questions live on
  // one screen, so typing a role and then tapping a "What should I catch?" chip is the ordinary way
  // through this screen, and it used to wipe what they had written every single time.
  const other = $("#obOther");
  if (other) {
    other.addEventListener("input", () => { obOwnsOther = other.value; });
    // Caret to the end, so returning to a half-typed answer continues it rather than prefixing it.
    if (obOwnsOther) { const n = other.value.length; try { other.setSelectionRange(n, n); } catch (e) {} }
  }
  const save = async (answers) => {
    try { await api("/api/v1/onboarding/answers", { method: "POST", body: JSON.stringify(answers) }); }
    catch (e) { toast("err", "Could not save", e.message); return; }
    obAdvance("done");
  };
  $("#obSave").addEventListener("click", () => {
    // "Something else" is a CATEGORY, never an answer. The old fallback was `typed || obOwns`, so
    // picking it and typing nothing sent the literal string "Something else" to the server, where
    // it went into the extraction prompt as this person's own description of what they own.
    const typed = ((other && other.value) || obOwnsOther || "").trim();
    const owns = obOwns === OWNS_OTHER ? typed : obOwns;
    save({ owns, catches: obCatch || [] });
  });
  // Skipping is a real answer, not an escape: it writes nothing and moves on, exactly as designed.
  $("#obSkip").addEventListener("click", () => obAdvance("done"));
}

/* ---------------- who owns the screen ----------------
   First run takes over the whole screen. Otherwise the tabs do. */
function applyFlows() {
  const ob = obActive();
  const nav = document.querySelector("nav");
  if (nav) nav.hidden = ob;
  $("#vOnboard").hidden = !ob;
  if (ob) {
    ["#vToday", "#vFollow", "#vHistory", "#vSetup"].forEach((s) => { const e = $(s); if (e) e.hidden = true; });
    renderOnboard();
    return;
  }
  if (obPoll) { clearInterval(obPoll); obPoll = null; }
  // Nothing owns the screen any more. A flow that just released it left every view hidden, so
  // without this the user is returned to a blank page: the takeover is undone but nothing is put
  // back.
  const anyVisible = ["#vToday", "#vFollow", "#vHistory", "#vSetup"].some((s) => { const e = $(s); return e && !e.hidden; });
  if (!anyVisible) tab("today");
}
// Kept as the old name so every existing caller still reads correctly.
function applyOnboarding() { applyFlows(); }

/* ---------------- the page does not move sideways ----------------
   Every view scrolls vertically, which forces its horizontal axis to be a scroll container too:
   `overflow-x:clip` is downgraded to `hidden` by the browser on any element whose other axis
   scrolls, and `hidden` clips the pixels while leaving the element perfectly scrollable to script.
   So one transient overflow, most often the browser scrolling a focused element into view, leaves
   the whole view parked sideways with every block shifted left and a gap down the right edge. It
   reads as the app being crooked, on every page, with no way for a finger to put it back:
   `touch-action:pan-y` means a swipe cannot even scroll it home again.

   Measured before the fix: main.scrollLeft accepted 200 and the greeting moved from x=16 to
   x=-184. Pinning the axis is the only thing that holds, because CSS cannot express "clip x, scroll
   y" on the same element.

   Two listeners on purpose, because they fail in different weather. `scroll` is the general net and
   catches it whatever the cause, but it rides the compositor and could not be exercised in a
   headless test page at all (0 events fired for a programmatic scrollLeft). `focusin` is plain
   input plumbing, fires regardless, is verifiable, and covers the specific suspect: the browser
   scrolling a newly focused control into view. That is not a theory, it is the reproduction:
   focusing a control inside a view moved it to scrollLeft 16, which is exactly the "very slightly
   skewed" page that was reported.
   Once immediately and once on a timer, because the scroll-into-view lands after focus is
   delivered. A timer, never requestAnimationFrame: rAF rides frame production and silently never
   runs in a headless test page, so the fix itself would have been unverifiable.

   Deliberately NOT preventDefault or a capture-phase blocker: the day strip is a real horizontal
   scroller and its scrolls fire on itself, never here, so this can only ever undo the page moving. */
function pinLeft(m){
  const home=()=>{ if(m.scrollLeft!==0)m.scrollLeft=0; };
  m.addEventListener("scroll",home,{passive:true});
  m.addEventListener("focusin",()=>{home();setTimeout(home,0);});
}
document.querySelectorAll("main").forEach(pinLeft);

/* ---------------- keyboard ---------------- */
window.addEventListener("keydown",e=>{
  if($("#tmOvl").classList.contains("open")){if(e.key==="Escape")closeTranscript();return;}
  if($("#sheet").classList.contains("open")){if(e.key==="Escape")reqClose();return;}
  if($("#ovBrief").classList.contains("open")){if(e.key==="Escape")$("#ovBrief").classList.remove("open");return;}
  if($("#vToday").hidden)return;
  /* Two guards, both before any deck shortcut, and both below the overlay handlers above so that
     Escape still closes a sheet from inside one of its own fields.

     A shortcut must never fire while someone is typing. "e" opens the edit sheet and "i" flips the
     card, so the dismiss panel's note field turned any word containing either letter into a
     surprise edit sheet: "the meeting was cancelled" opened it on the first keystroke. The guard is
     on the handler, not on that one field, so every input added later inherits it.

     And while the panel is open it owns the interaction. program() already assumed this for the
     arrow keys, which is why only "e" and "i" leaked through. */
  const tgt=e.target;
  if(tgt&&(tgt.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(tgt.tagName)))return;
  if(leftPending)return;
  if(e.key==="ArrowRight"){e.preventDefault();program(1,"key");}
  else if(e.key==="ArrowLeft"){e.preventDefault();program(-1,"key");}
  else if(e.key==="ArrowUp"||e.key==="i"){e.preventDefault();const el=$("#deck .card");if(el)el.classList.toggle("flipped");}
  else if(e.key==="e"){if(S.deck[0])openSheet(S.deck[0]);}
});

/* ---------------- boot ---------------- */
if("serviceWorker"in navigator&&!window.HAII_DEMO)navigator.serviceWorker.register("/sw.js").catch(()=>{});
if(location.hash==="#setup")tab("setup");
// Slack OAuth lands back here as /?slack=<result>#setup. Say what happened instead of silently
// returning to a Setup page that may or may not have changed, and strip the param so a reload
// does not re-announce it.
(function(){
  const r=new URLSearchParams(location.search).get("slack");
  if(!r)return;
  const MSG={
    connected:["yes","Slack connected","Haii can post as you and read what you can see"],
    access_denied:["info","Slack not connected","You declined the permission request"],
    no_user_token:["err","Slack returned no user token","The app is requesting bot scopes; it needs user scopes"],
    exchange_failed:["err","Slack connect failed","Could not reach Slack to exchange the code"],
  };
  const [kind,msg,sub]=MSG[r]||["err","Slack connect failed",r];
  // Called straight out, no setTimeout: #toast is in the static HTML and toasts are position-fixed,
  // so nothing needs to render first, and a deferred call is one more thing that can silently not
  // happen. Longer than the 2.6s default because a connection result is worth reading.
  toast(kind,msg,sub,{ttl:7000});
  history.replaceState(null,"",location.pathname+location.hash);
})();
// environment badge from the server, not hardcoded: cloud deploys say CLOUD
fetch("/healthz").then(r=>r.json()).then(h=>{$("#ribEnv").textContent=h.mode==="cloud"?"CLOUD":h.mode==="demo"?"DEMO":"LOCAL";}).catch(()=>{});
// report the device timezone so every "today" (day strip, digest morning) is computed in the
// user's own zone server-side; travel self-heals on next app open.
// loadFeed() below deliberately does NOT wait for this: an extra round trip before first paint
// would cost every launch. Instead the server says whether the zone it had was already right, and
// only when it was not do we re-render. That is a new account (stored zone is the 'local'
// sentinel, which resolves to UTC and empties the day strip for anyone far from UTC) or someone
// who has flown. Everyone else pays nothing.
/* Zone and locale are reported together because they come from the same device at the same moment
   and answer two different questions: the zone decides WHICH instant a time is, the locale decides
   how it is spelled. Without the locale every server-rendered time (morning digest, brief pushes)
   was en-GB 24h for everyone, so US users were handed 14:00. */
try{api("/api/v1/me/timezone",{method:"POST",body:JSON.stringify({timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,locale:(navigator.languages&&navigator.languages[0])||navigator.language||""})}).then(r=>{if(r&&r.changed)loadFeed();}).catch(()=>{});}catch(e){}
loadFeed();
loadSettings();
refreshFollowBadge();
setInterval(loadFeed,60_000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadFeed();});
})();
</script>
</body>
</html>
