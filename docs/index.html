<style>
  /* SELF-HOSTED, not Google Fonts, since 2026-08-10.
   *
   * The security headers added on 2026-08-10 set `style-src 'self' 'unsafe-inline'` and
   * `font-src 'self' data:`, which blocked BOTH the Google stylesheet and the font files behind it.
   * The page did not error: it silently fell back to Helvetica Neue and then Arial, which is the
   * whole hazard of a webfont from another origin. It was first noticed on the sign-in screen; it was
   * true of the entire app, because index.html carried the same three links.
   *
   * Serving it ourselves fixes it properly rather than punching a hole in the CSP for two hosts:
   * no third-party request on the first screen anyone sees, no Google pageview on every sign-in,
   * one fewer thing that can be slow or down, and it cannot silently fall back again.
   *
   * Instrument Sans is a VARIABLE font, so these two files (latin, latin-ext) cover 400 to 700
   * between them. `font-weight: 400 700` is the range declaration that lets the browser
   * interpolate; Google's own CSS ships eight blocks pointing at these same two files.
   * latin-ext is not optional here: it carries characters such as ğ, ş and İ, which real names
   * need. 41KB for the pair. */
  @font-face{
    font-family:'Instrument Sans';
    font-style:normal;
    font-weight:400 700;
    font-display:swap;
    src:url('fonts/instrument-sans-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  @font-face{
    font-family:'Instrument Sans';
    font-style:normal;
    font-weight:400 700;
    font-display:swap;
    src:url('fonts/instrument-sans-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
</style>
<style>
  /* Light skin (2026-07-26). Replaces the near-black aurora skin.
     The reason is trust, not taste: the app asks for mail, calendar, chat and documents, and a
     dark, high-contrast, monospaced surface reads as opaque machinery at exactly the moment we
     ask for access. v2 is the THEME only. Every feature, control and affordance the app had is
     unchanged; only colour, type and depth moved.

     Type: Instrument Sans throughout. There is no monospace any more. --label keeps its own name
     because dozens of rules use it for small tracked-out labels, and those still want a distinct
     weight/tracking treatment even though the family is now the same.

     Depth: on a dark ground, hierarchy came from lighter surfaces. On light it comes from white
     cards, hairlines and shadow. --surface and --raise are both white on purpose; the gradients
     that mixed them now resolve flat, which is what v2 wants. */
  :root{
    --ground:#F4F5F7; --surface:#FFFFFF; --raise:#FFFFFF; --field:#F7F8FA;
    --hair:rgba(16,24,40,.10); --hair-soft:rgba(16,24,40,.06);
    --ink:#0F1115; --mut:#5A6270; --faint:#5C6472;
    --gold:#1F57E0; --gold-soft:rgba(31,87,224,.09); --gold-line:rgba(31,87,224,.26);
    --warn:#8A5A00; --warn-soft:rgba(138,90,0,.09); --warn-line:rgba(138,90,0,.26);
    --nod:#0B7D5D; --nod-soft:rgba(11,125,93,.10);
    --shake:#C0332C; --shake-soft:rgba(192,51,44,.09); --shake-line:rgba(192,51,44,.26);
    /* Kept saturated: these are the brand's iris, used for the orb and accent rules, never as
       small text. --aura-2 doubles as a link colour, so it is the darkened blue. */
    --aura-1:#0A7F6B; --aura-2:#1F57E0; --aura-3:#6B46E8;
    --iris:conic-gradient(from 210deg,#3ED6C0,#2E6BFF,#8B7CF6,#3ED6C0);
    /* Per-card-type accents stay a real information channel (they drive the type chip and the
       rule across the top of each card). Same hue families as the dark skin, darkened to carry
       small text on white. */
    --c-email:#1668B8; --c-cal:#1F57E0; --c-todo:#0A7263; --c-slack:#6B46E8; --c-jira:#4F4BD6;
    --c-doc:#1D6FA5; --c-share:#0E7A6E; --c-crm:#B2541C; --c-task:#4A45C9; --c-text:#9B2C8A;
    --sans:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
    --label:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
    --shadow-1:0 1px 2px rgba(16,24,40,.04);
    --shadow-2:0 1px 2px rgba(16,24,40,.04),0 12px 28px -18px rgba(16,24,40,.28);
    --shadow-3:0 2px 6px rgba(16,24,40,.05),0 26px 52px -26px rgba(16,24,40,.42);
    --ease:cubic-bezier(.22,.9,.3,1); --spring:cubic-bezier(.22,1.5,.36,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  /* Nothing in this app is ever meant to scroll sideways. A dragged card is a transformed element,
     and a transform expands its ancestors' scrollable overflow, so the first swipe silently turned
     the feed into a horizontal scroller and every touch after that panned the page instead of
     taking the card. Belt and braces at the document level too, since Safari will happily chain a
     horizontal pan up to the viewport. */
  /* `clip`, not `hidden`, and the doubled declaration is the point: `hidden` is a fallback for
     anything too old to know `clip`, which would otherwise drop the line and leave the axis fully
     visible, i.e. worse than before. `hidden` CLIPS but still makes the element a scroll container,
     so anything that transiently overflows (a long unbreakable string, an element the browser
     scrolls into view on focus) leaves the page scrolled sideways with no way for a finger to put
     it back. Measured: with `hidden`, main.scrollLeft=200 takes and the greeting moves from x=16
     to x=-184, which is exactly the reported "margin on the right, none on the left".
     `clip` creates no scroll container at all, so nothing can scroll it, by gesture or by script.
     The deck already relied on this (#deckWrap), which is why a card mid-swipe never caused it.
     Horizontal scrolling survives only where it is asked for, on .daystrip. */
  html,body{height:100%;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;max-width:520px;margin:0 auto;min-height:100dvh}
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
  input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
  ::selection{background:rgba(46,107,255,.16)}

  @keyframes breathe{0%,100%{opacity:.45;transform:scale(.82)}50%{opacity:1;transform:scale(1)}}

  header{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
  .hgreet{flex:1;min-width:0}
  .hgreet .g1{font:600 16px/1.2 var(--sans);letter-spacing:-.015em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hgreet .g2{display:flex;align-items:center;gap:6px;margin-top:3px;font:500 12.5px/1 var(--label);color:var(--faint);white-space:nowrap;overflow:hidden}
  .hgreet .live{flex:none;width:6px;height:6px;border-radius:50%;background:var(--aura-1);animation:breathe 3.4s var(--ease) infinite}
  .hgreet .live.err{background:var(--shake)}
  .hgreet .sep{opacity:.45}
  .hmeta{margin-left:auto;flex:none;text-align:right}
  .hmeta .env{margin-top:3px;font:500 11.5px/1 var(--label);color:var(--gold)}
  /* "Haii is on" made visible. Two layers, both slow and low-contrast on purpose: this sits in the
     header on every screen, so anything faster or louder becomes a tic you notice all day.
     • a ring that expands and fades, like something out there was heard
     • a shallow breath on the orb itself, offset from the ring so they never pulse in lockstep
     The ring needs its own element because .orb-sm clips the canvas to a circle and would clip it. */
  .orbring{position:relative;flex:none;width:40px;height:40px}
  .orbring::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
    border:1.5px solid var(--aura-2);opacity:0;animation:orbPing 4.6s var(--ease) infinite}
  @keyframes orbPing{0%{transform:scale(1);opacity:.38}62%{opacity:0}100%{transform:scale(1.62);opacity:0}}
  /* Offline is a real state and the orb should stop pretending otherwise. */
  .orbring.off::after{animation:none}
  .orbring.off .orb-sm{animation:none;filter:grayscale(.75)}
  .orb-sm{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#EEF2F8;
    box-shadow:0 6px 16px -8px rgba(31,87,224,.4);animation:orbBreath 6.4s ease-in-out infinite}
  @keyframes orbBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .orb-sm canvas{display:block;width:100%;height:100%}
  .orb-sm canvas.nod{animation:orbNod .5s var(--ease)}
  .orb-sm canvas.shake{animation:orbShake .5s var(--ease)}
  @keyframes orbNod{0%,100%{transform:translateY(0)}25%{transform:translateY(4px)}55%{transform:translateY(-3px)}}
  @keyframes orbShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}


  .spend{font:500 12px/1.35 var(--label);color:var(--faint)}
  .spend b{color:var(--gold)}

  /* Backstop only. The card's overflow is already clipped at #deckWrap, so nothing should reach
     here; this catches anything else that ever overflows sideways. It cannot be `clip`, because
     clip downgrades to hidden whenever the other axis scrolls, and this element scrolls on y.
     touch-action:pan-y tells the compositor the same thing declaratively: this surface scrolls
     vertically and nothing else, so a horizontal gesture is never the browser's to claim. */
  /* `overflow-x:clip` does NOT work here and must not be re-added: a browser downgrades `clip` to
     `hidden` on any element whose other axis scrolls, and this one scrolls vertically. Measured,
     not assumed: with the declaration present, computed overflow-x still read `hidden` and the
     view still scrolled sideways to 200px. html and body take `clip` precisely because they do not
     scroll. So main stays a horizontal scroll container no matter what CSS says, and pinLeft()
     below is what actually holds it at zero. `touch-action:pan-y` already stops a FINGER doing it,
     which is why the culprit is always programmatic: the browser scrolling a focused element into
     view. */
  main{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;padding:2px 16px 112px;scrollbar-width:none}
  main::-webkit-scrollbar{display:none}

  .say{padding:10px 4px 18px}
  .say .eyeb{font:600 13.5px/1 var(--label);color:var(--aura-1);margin-bottom:8px}
  .say h1{font-size:18.5px;font-weight:600;line-height:1.34;letter-spacing:-.01em}
  .say h1 b{color:var(--gold);font-weight:700}

  .row-lbl{display:flex;align-items:center;gap:9px;padding:0 4px;margin:6px 0 11px}
  .row-lbl .t{font:600 13.5px/1 var(--label);color:var(--mut)}
  .row-lbl .c{font:600 12px/1 var(--label);color:var(--gold);background:var(--gold-soft);border-radius:99px;padding:4px 8px;min-width:22px;text-align:center}
  .row-lbl .n{margin-left:auto;font:500 12.5px/1 var(--label);color:var(--faint)}

  .brief-card{position:relative;overflow:hidden;border-radius:22px;padding:16px;margin-bottom:22px;
    background:linear-gradient(160deg, rgba(46,107,255,.06), rgba(62,214,192,.03) 42%, transparent 70%), var(--surface);
    border:1px solid var(--hair)}
  .brief-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--aura-1),var(--aura-2),var(--aura-3));opacity:.85}
  .bc-top{display:flex;justify-content:space-between;gap:12px}
  .bc-when{font:600 13px/1 var(--label);color:var(--aura-2)}
  .bc-top h2{margin-top:8px;font-size:18px;font-weight:700;line-height:1.22}
  .cd{flex:none;text-align:right}
  .cd .t{font:700 22px/1 var(--label);font-variant-numeric:tabular-nums}
  .cd .l{margin-top:5px;font:500 12px/1 var(--label);color:var(--faint)}
  .bc-att{margin-top:10px;font-size:12px;color:var(--mut)}
  .bc-go{display:flex;gap:10px;margin-top:14px}
  .btn-gold{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;
    background:var(--gold);color:#fff;font-weight:600;font-size:14px;border-radius:100px;
    box-shadow:0 10px 22px -12px rgba(31,87,224,.75)}
  .btn-gold:active{transform:scale(.985)}
  .btn-gold[disabled]{opacity:.55}
  .btn-dim{flex:1;min-height:46px;border:1px solid var(--hair);border-radius:100px;color:var(--mut);font-weight:600;font-size:13px}

  /* The dragged card is clipped HERE, at a non-scrolling ancestor, so its transform never reaches
     main and never turns the feed into a horizontal scroller. Full-bleed (negative margin cancels
     main's 16px gutter, padding puts it back) so the clip edge is the screen edge: the card flies
     off-screen instead of being sliced at its own boundary. clip survives on this element because,
     unlike main, it does not scroll on either axis. */
  #deckWrap{position:relative;margin:0 -16px 6px;padding:0 16px;overflow-x:clip}
  /* 420 for the live card + 34 for the stack lips to peek into. The lips are translated down
     past the card, so without reserved space they overlapped the hint line beneath the deck. */
  #deck{position:relative;height:454px;touch-action:pan-y}
  .card{position:absolute;inset:0 0 34px 0;border-radius:26px;will-change:transform;user-select:none;-webkit-user-select:none}
  /* The grab area was too small. The card already filled the deck, but main's 16px
     gutters on either side belonged to main, so a thumb landing just off the card missed it
     entirely. This transparent extension reaches the screen edges and hit-tests AS the card, so
     the card's touch-action:none covers it too. It sits behind .face, so buttons still win. */
  .card::before{content:"";position:absolute;inset:0 -16px;border-radius:26px}
  .card .aura{position:absolute;inset:0;border-radius:22px;opacity:0;pointer-events:none;z-index:4;transition:opacity .08s linear}
  .aura.a-yes{box-shadow:0 0 0 1.5px var(--nod), 0 18px 60px -10px rgba(11,125,93,.42);background:linear-gradient(215deg,var(--nod-soft),transparent 52%)}
  .aura.a-no{box-shadow:0 0 0 1.5px var(--shake), 0 18px 60px -10px rgba(192,51,44,.4);background:linear-gradient(145deg,var(--shake-soft),transparent 52%)}
  .verdict{position:absolute;top:22px;z-index:5;pointer-events:none;opacity:0;display:flex;gap:7px;align-items:center;
    font:700 15px/1 var(--label);border:2.5px solid;border-radius:12px;padding:10px 14px}
  .verdict.yes{left:18px;color:var(--nod);border-color:var(--nod);transform:rotate(-9deg)}
  .verdict.no{right:18px;color:var(--shake);border-color:var(--shake);transform:rotate(9deg)}
  /* Lips, not cards. v2 shows a hint of depth rather than two dimmed duplicates; brightness on a
     white surface just looked grey, and the stack is a count cue, not content. */
  .card.b1,.card.b2{overflow:hidden}
  .card.b1 .flip,.card.b2 .flip,.card.b1 .aura,.card.b2 .aura,.card.b1 .verdict,.card.b2 .verdict{display:none}
  .card.b1{top:auto;height:52px;transform:translateY(14px) scaleX(.955);background:var(--surface);border:1px solid var(--hair-soft);box-shadow:var(--shadow-2)}
  .card.b2{top:auto;height:52px;transform:translateY(27px) scaleX(.9);background:var(--surface);border:1px solid var(--hair-soft);opacity:.75;box-shadow:var(--shadow-1)}
  .card.spring{transition:transform .45s var(--spring), box-shadow .3s ease}
  .card.fly{transition:transform .42s cubic-bezier(.32,.04,.58,1), opacity .42s ease-out}
  /* The live card owns every gesture that starts on it, in both axes, and does not scroll the
     page. See the long note in attachGestures for why arbitrating between swipe and scroll here
     is not solvable: a thumb's swipe and its scroll begin as the same motion.
     -webkit-touch-callout stops iOS raising its long-press menu mid-drag. */
  .card.live{touch-action:none;-webkit-touch-callout:none}
  /* Press state. Short enough that it reads as the card taking the grab, not as an animation.
     Named `press`, NOT `grab`: `.grab` is the bottom sheet's drag handle (40x4px), and a card
     carrying that class collapsed to 40x4 for the whole duration of a press. */
  .card.press{transition:transform .13s var(--ease), box-shadow .13s ease}
  .card.promote{transform:none !important;filter:none !important;transition:transform .36s var(--spring), filter .36s ease}
  /* `backwards`, never `both`. `both` keeps the final keyframe (transform:none) applied for as
     long as the class is on the element, and a CSS animation outranks an inline style, so every
     card dealt by renderDeck(true) silently discarded the transform that drag and fly-out write.
     `backwards` still applies the from-state before the animation starts, which is all that was
     ever needed to stop the card flashing in at full size. */
  .card.deal{animation:deal .5s var(--ease) backwards}
  @keyframes deal{from{transform:translateY(28px) scale(.95);opacity:0}to{transform:none;opacity:1}}
  /* First-run coach. The deck's identity is the gesture, but a card carrying two buttons reads as a
     list item, so a first-time user taps and never discovers the swipe. The bar is that a stranger
     understands the swipe in 10 seconds.
     The card leans right, holds long enough to show the nod wash, and settles. Approve only: adding
     the shake half doubles the length and turns a cue into a tutorial.
     This animates .card's transform, the same property the drag writes inline, and a running
     animation OUTRANKS an inline style. So it must be cancelled the instant a thumb lands or the
     card feels stuck to whoever grabbed it mid-nudge. coachSwipe() removes the class in the capture
     phase, ahead of attachGestures setting GRAB. */
  .card.coach{animation:coachNudge 1.2s var(--ease) both}
  .card.coach .a-yes{animation:coachAura 1.2s var(--ease) both}
  @keyframes coachNudge{
    0%{transform:none}
    32%{transform:translateX(44px) rotate(1.1deg)}
    56%{transform:translateX(44px) rotate(1.1deg)}
    100%{transform:none}
  }
  @keyframes coachAura{0%,100%{opacity:0}32%,56%{opacity:.5}}
  @keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

  .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s var(--ease)}
  .card.flipped .flip{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:linear-gradient(172deg,var(--raise),var(--surface) 34%);
    border:1px solid var(--hair);border-radius:26px;box-shadow:var(--shadow-3);
    display:flex;flex-direction:column;padding:18px;overflow:hidden}
  .face.back{transform:rotateY(180deg)}
  .face::after{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--tc);opacity:.55}
  /* The header: a tinted glyph square, the title, and the type/mode beneath it. The confidence
     gauge stays on the right. */
  .ctop{display:flex;align-items:flex-start;gap:12px}
  .cicon{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    font-size:17px;font-weight:600;background:color-mix(in srgb,var(--tc) 11%,transparent);color:var(--tc)}
  .chead{flex:1;min-width:0}
  .ctype{display:flex;align-items:center;gap:7px;margin-top:4px;font:500 12.5px/1 var(--label);color:var(--faint)}
  .mtag{display:inline-block;font:600 11.5px/1 var(--label);padding:4px 8px;border-radius:7px}
  /* The middle of the card absorbs the variation in content length so the buttons never move.
     min-height:0 is load-bearing: without it a flex child refuses to shrink below its content and
     the overflow lands on the buttons instead. */
  .cbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  /* Clamp rather than scroll: the full text is one tap away on the back of the card, and a
     scrollable region inside a swipeable card is a gesture fight nobody wins. */
  /* flex:none on every clamped block is load-bearing and was the actual bug (2026-07-28). A clamp
     sets how many lines to KEEP; it does not stop the element being shrunk below that. These are
     flex children of .cbody, so when the card ran short the browser compressed them past their own
     clamp and each block's overflow:hidden then sliced the final line THROUGH the letters. That is
     why it read as broken rather than truncated: a clamp cuts at a line boundary and adds an
     ellipsis, a squeezed box cuts wherever the pixels ran out. With flex:none the clamp is the only
     thing deciding the height, so the cut always lands between lines. */
  .face h3{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .face .sum{flex:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .actline{flex:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* Actions on the card, replacing the separate circle row that used to sit under the deck. */
  .cbtns{flex:none;display:flex;align-items:center;gap:10px;margin-top:14px}
  .cb{min-height:46px;border-radius:14px;font:600 14.5px/1 var(--sans);border:1px solid var(--hair);background:var(--surface);color:var(--mut);padding:0 18px;flex:none}
  .cb.yes{flex:1;background:var(--gold);color:#fff;border-color:transparent;box-shadow:0 10px 22px -12px rgba(31,87,224,.75)}
  .cb:active{transform:scale(.97)}
  .tchip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 11px;
    font:600 12.5px/1 var(--label);
    background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 32%,transparent)}
  .gauge{margin-left:auto;flex:none;position:relative;width:42px;height:42px}
  .gauge svg{transform:rotate(-90deg)}
  .gauge .num{position:absolute;inset:0;display:grid;place-items:center;font:700 11px/1 var(--label)}
  .face h3{font-size:18px;font-weight:600;letter-spacing:-.018em;line-height:1.25}
  .face .sum{margin-top:13px;font-size:14.5px;line-height:1.55;color:var(--mut)}
  /* The bottom margin is a GUARANTEED minimum gap before the payload block. .pl uses
     margin-top:auto to sit at the bottom of the card, but auto collapses to nothing the moment
     the content fills the space, which is exactly when the summary ended up touching the due row. */
  .actline{margin:7px 0 18px;font-size:13.5px;line-height:1.45;color:var(--faint)}
  .pl{margin-top:auto;background:var(--field);border:1px solid var(--hair-soft);border-radius:16px;padding:14px 15px;display:flex;flex-direction:column;gap:9px}
  .pl .kv{display:flex;gap:10px;font-size:12.5px;min-width:0}
  .pl .k{flex:none;width:58px;font:500 12.5px/1.5 var(--label);color:var(--faint)}
  .pl .v{color:var(--ink);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .csrc{flex:none;display:flex;align-items:center;gap:7px;margin-top:12px;font:500 12.5px/1.4 var(--label);color:var(--faint)}
  /* One line, ellipsised. Meeting titles wrap to two lines ("Weekly planning - 2026/01/12
     10:00 GMT - Notes by Gemini"), and that second line was the last 9px of content the card
     could not afford, so it was the thing getting sliced once the blocks above stopped shrinking.
     A source label is metadata; one line with an ellipsis is the honest amount of room for it. */
  .csrc .st{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .csrc .why{flex:none;margin-left:auto;color:var(--aura-1);font-weight:700}
  .bkh{display:flex;gap:8px;font:600 13.5px/1 var(--label);color:var(--aura-1)}
  .bks{margin-top:11px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
  /* Same bug, worse consequence. .bks is a flex column, so the quote boxes were shrinking to fit
     instead of overflowing, which is also why .bks's overflow-y:auto never had anything to scroll.
     flex:none stops the compression; the clamp on .q p below bounds each quote so two of them still
     fit a 420px card. The quote is the product's entire evidence claim, so a cut through the middle
     of a word is worse here than anywhere else on the card. */
  .q{flex:none;position:relative;overflow:hidden;background:#F3F7FF;border:1px solid var(--hair-soft);border-radius:6px 16px 16px 6px;padding:13px 15px 13px 16px}
  .q::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:linear-gradient(180deg,var(--aura-1),var(--aura-2),var(--aura-3))}
  .q p{font:400 13px/1.55 var(--label);color:var(--ink);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .q .who{margin-top:6px;font:500 12.5px/1 var(--label);color:var(--faint)}
  /* THE INJECTION WARNING, and it is on the FRONT of the card on purpose.
     The caveat below it lives on the back, behind a flip, which is fine for "Haii proposed this
     time rather than reading it" and useless for "this is about to send a file to someone you have
     never met". A transcript is attacker-reachable, and the swipe is the only gate, so the one
     thing the user must see before nodding has to be where the nod happens. Warm amber rather than
     red: this is nearly always a legitimate external client, and a colour that means CATASTROPHE
     on a normal Tuesday gets ignored by Thursday. */
  .xrec{display:flex;flex-direction:column;gap:2px;margin-top:8px;padding:9px 11px;border-radius:12px;
    background:var(--warn-soft);border:1px solid var(--warn-line)}
  .xrec .xh{font:700 10.5px/1 var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
  .xrec .xa{font:600 12.5px/1.35 var(--sans);color:var(--ink);word-break:break-all}
  .xrec .xn{font:400 11.5px/1.4 var(--label);color:var(--warn)}
  .cav{background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:16px;padding:10px 12px;font-size:12px;line-height:1.5;color:var(--warn)}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font:500 12.5px/1 var(--label);color:var(--mut);background:var(--field);border:1px solid var(--hair-soft);border-radius:99px;padding:6px 10px}
  .bkf{margin-top:10px;display:flex;align-items:flex-end;gap:9px}
  .bkf .m{font:500 12px/1.55 var(--label);color:var(--faint)}
  .btn-mini{margin-left:auto;flex:none;min-height:40px;background:var(--field);border:1px solid var(--hair);border-radius:12px;padding:9px 13px;font-size:12.5px;font-weight:700}

  .dhint{text-align:center;padding:6px 8px 2px;font:500 13px/1.4 var(--label);color:var(--faint);transition:color .14s}
  .ctrl{display:flex;flex-direction:column;align-items:center;gap:7px}
  .ctrl button{border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--hair);transition:transform .12s}
  .ctrl.big button{width:60px;height:60px}
  .ctrl.sm button{width:50px;height:50px}
  .ctrl button:active{transform:scale(.88)}
  .ctrl span{font:500 12.5px/1 var(--label);color:var(--mut)}
  .ctrl.no button{color:var(--shake);border-color:rgba(192,51,44,.38)}
  .ctrl.yes button{color:var(--nod);border-color:rgba(11,125,93,.38)}
  .ctrl.ed button{color:var(--mut)}

  .empty{min-height:300px;border:1.5px dashed var(--hair);border-radius:22px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:9px;text-align:center;padding:22px}
  .empty .ok{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--nod-soft);color:var(--nod)}
  /* Same shape, warn palette: "nothing connected" is not a success state and a green check there
     reads as a lie. Reuses --warn/--warn-soft, already load-bearing elsewhere (.cav, healthBanner). */
  .empty .ok.warn{background:var(--warn-soft);color:var(--warn)}
  .empty h3{font-size:16px;font-weight:700}
  .empty p{font:500 12px/1.7 var(--label);color:var(--mut);max-width:300px}
  .empty button{margin-top:8px;min-height:44px;font-size:13px;font-weight:700;color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:13px;padding:0 18px}

  .digest{background:var(--surface);border:1px solid var(--hair);border-radius:22px;padding:15px 16px;margin-bottom:22px}
  .dh{display:flex;gap:8px}
  .dh .t{font:600 13.5px/1 var(--label);color:var(--mut)}
  .digest .rows{margin-top:12px;display:flex;flex-direction:column;gap:11px}
  .dr{display:flex;gap:10px;font-size:12.5px;line-height:1.55;color:var(--mut)}
  .dr .dot{flex:none;width:6px;height:6px;border-radius:50%;margin-top:6px;background:var(--gold)}
  .dr b{color:var(--ink);font-weight:600}

  nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;width:calc(100% - 32px);max-width:460px;
    display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:100px;box-shadow:var(--shadow-3);
    border:1px solid var(--hair-soft);padding:9px 10px}
  /* Without this the tab bar stays on screen through the whole of first run,
     because display:flex above beats the hidden attribute. A user could tab out of onboarding
     halfway through, and "Skip for now" on the questions screen sat underneath it. Third time this
     exact fault has shipped: .rate .why, then .su-panel, then here. Any display: on an element that
     gets toggled needs its [hidden] rule written in the same edit. */
  nav[hidden]{display:none}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--faint);position:relative;padding:6px 0 3px;min-height:44px}
  .tab.on{color:var(--ink)}
  .tab span{font:500 11.5px/1 var(--label)}
  .tab .bdg{position:absolute;top:-1px;right:calc(50% - 26px);min-width:17px;height:17px;border-radius:99px;padding:0 4px;
    background:var(--gold);color:#fff;font:600 11.5px/18px var(--label);text-align:center}

  .ovl{position:fixed;inset:0;z-index:40;background:var(--ground);display:flex;flex-direction:column;max-width:520px;margin:0 auto;
    transform:translateY(100%);visibility:hidden;transition:transform .38s var(--ease),visibility 0s linear .38s}
  .ovl.open{transform:none;visibility:visible;transition:transform .38s var(--ease),visibility 0s}
  .ovbar{display:flex;align-items:center;gap:11px;padding:calc(14px + env(safe-area-inset-top)) 14px 10px}
  .ovbar .tt{font-size:15px;font-weight:700}
  .ovbar .ss{margin-top:3px;font:500 12.5px/1 var(--label);color:var(--faint)}
  .ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--mut);background:var(--surface);border:1px solid var(--hair-soft)}
  /* position:relative so the voice player can measure offsetTop against THIS element. Without it
     the offsetParent is the fixed overlay and every follow-along scroll lands in the wrong place.
     scroll-behavior does the easing, and degrades to an instant jump where requestAnimationFrame
     never fires. */
  .ovbody{flex:1;overflow-y:auto;padding:8px 20px 44px;scrollbar-width:none;position:relative;scroll-behavior:smooth}

  /* The voice player. Pinned between the header and the scroller, never scrolls away: it is the
     transport for the text below it, and the text moves under it as it reads. The hairline and the
     soft shadow are what make the body read as passing UNDER the header block.
     Every toggled element here carries its own [hidden] rule in the same block. A display: value
     beats the attribute, and that exact bug has now shipped three times in this file. */
  .vp{display:flex;align-items:center;gap:13px;padding:2px 16px 13px;
    border-bottom:1px solid var(--hair);box-shadow:0 10px 20px -18px rgba(16,24,40,.55)}
  .vp[hidden]{display:none}
  .vp-btn{width:46px;height:46px;flex:none;border-radius:50%;background:var(--gold);color:#fff;
    border:none;display:grid;place-items:center;box-shadow:0 8px 18px -10px rgba(31,87,224,.8)}
  .vp-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  /* A progress READOUT, not a scrubber. Browser speech cannot seek, so nothing in here may look
     draggable: no handle, no cursor change, no pointer events at all. */
  .vp-wave{height:26px;display:flex;align-items:center;gap:2px;pointer-events:none}
  .vp-wave i{flex:1;min-width:2px;border-radius:2px;background:rgba(16,24,40,.18);
    transform-origin:center;transition:background .25s var(--ease),height .25s var(--ease)}
  .vp-wave i.on{background:var(--gold)}
  .vp-wave i.hd{animation:vhead 1.1s ease-in-out infinite}
  @keyframes vhead{0%,100%{transform:scaleY(.66)}50%{transform:scaleY(1)}}
  .vp-meta{height:15px;display:flex;align-items:center;font:400 12.5px/1 var(--label);color:var(--faint)}
  .vp-meta.warn{color:var(--warn);font-weight:500}
  .vp-rst{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;
    color:var(--mut);background:none;border:none}
  .vp-rst[hidden]{display:none}
  .vp-none{margin:0 16px 13px;background:var(--warn-soft);border:1px solid var(--warn-line);
    border-radius:14px;padding:11px 13px;font:400 13px/1.4 var(--label);color:var(--warn);text-wrap:pretty}
  .vp-none[hidden]{display:none}
  /* Every unit the voice reads. The box-shadow is what makes the highlight look padded WITHOUT
     moving anything: a background alone hugs the glyphs, and real padding would reflow the
     paragraph on every sentence. .vu.on is two classes, so it beats `.bsec li` and `.lm li` on
     colour, which is the rule this would otherwise silently lose to. */
  .vu{border-radius:4px;transition:background .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease)}
  .vu.on{background:var(--gold-soft);box-shadow:0 0 0 3px var(--gold-soft);color:var(--ink)}
  .btitle{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.16}
  .tldr{margin-top:18px;font-size:16px;line-height:1.52;font-weight:500}
  .tldr .lead{display:block;font:600 13.5px/1 var(--label);color:var(--aura-1);margin-bottom:10px}
  .bsec{margin-top:22px}
  .bsec h4{font:600 13.5px/1 var(--label);color:var(--aura-2)}
  .bsec ul{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:9px}
  .bsec li{position:relative;padding-left:17px;font-size:13.5px;line-height:1.55;color:var(--mut)}
  .bsec li::before{content:"";position:absolute;left:3px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--aura-2)}
  .lm{margin-top:22px;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:13px 14px}
  .lm .h{font:600 13.5px/1 var(--label);color:var(--mut)}
  .lm ul{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:9px}
  .lm li{display:flex;gap:9px;font-size:13px;line-height:1.5;color:var(--mut)}
  .lm .st{flex:none;font:600 12px/1.5 var(--label)}
  .st.done{color:var(--nod)} .st.open{color:var(--gold)}
  .rate{margin-top:26px;border-top:1px solid var(--hair-soft);padding-top:16px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  /* The why-chips expand this row in place instead of arriving as a separate surface. Rating a
     brief is not the post-swipe moment the toast rule is about: the reader is already looking at
     this row with a thumb on it. The toast is withheld until a chip is tapped precisely so there
     is never an instant with two things asking to be looked at. */
  .rate .why{flex-basis:100%;display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  /* An author-level display rule BEATS the hidden attribute's UA default, so without this the
     chips were on screen from the moment a brief opened, asking why you disliked something you
     had not disliked. Same fix as #lshield[hidden] and #stub[hidden] already use in this file. */
  .rate .why[hidden]{display:none}
  /* The rating controls disable themselves while their POST is in flight. Without this rule that
     state is real in the accessibility tree and invisible on screen, which is the same shape as an
     earlier bug here: a state changed in JS that no style ever renders. Matches
     .hretry:disabled and .fbtn:disabled. */
  .rate button:disabled{opacity:.55;cursor:wait}
  /* The note lives on its own row, below the rating, and is reachable whatever you tapped. A brief
     can be good and still have missed something, so gating this behind a thumbs-down would hide it
     exactly when it is most useful. Every [hidden] here carries its own display:none for the same
     reason .why does: an author display rule beats the attribute. */
  .rate .note{flex-basis:100%;margin-top:12px}
  .rate .note[hidden]{display:none}
  /* SCOPED to .rate on purpose, and this is not cosmetic. Unscoped, `.nlink` is one class (0,1,0)
     and it sits inside `.rate button` (0,1,1), which is both more specific AND declared later, so
     it lost twice: the note link rendered as a 50x46 bordered square with the text crammed into a
     centred grid. The chips and the save button escape the same trap only because their selectors
     happen to carry two classes (.rate .why button, .nbox .nsave). Any new control added inside
     .rate needs two classes or an ancestor, or it silently becomes a small grey box. */
  .rate .nlink{width:auto;height:auto;padding:0;background:none;border:none;color:var(--mut);font:500 12.5px/1.4 var(--label);text-decoration:underline;text-underline-offset:3px;text-align:left;display:inline}
  .nbox{display:flex;flex-direction:column;gap:8px;margin-top:9px}
  .nbox[hidden]{display:none}
  .nbox textarea{width:100%;resize:vertical;min-height:56px;padding:10px 12px;border-radius:11px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);font:400 13px/1.5 var(--label)}
  .nbox .nsave{align-self:flex-start;width:auto;height:34px;padding:0 13px;border-radius:11px;font-size:12.5px;font-weight:650}
  .rate .why button{width:auto;height:34px;padding:0 13px;border-radius:11px;font-size:12.5px;font-weight:650}
  .rate p{font-size:13px;color:var(--mut)}
  .rate .b{margin-left:auto;display:flex;gap:9px}
  .rate button{width:50px;height:46px;border-radius:13px;background:var(--surface);border:1px solid var(--hair);display:grid;place-items:center;color:var(--mut)}
  .rate button.up{color:var(--nod);border-color:rgba(11,125,93,.42);background:var(--nod-soft)}
  .rate button.dn{color:var(--shake);border-color:rgba(192,51,44,.42);background:var(--shake-soft)}

  #scrim{position:fixed;inset:0;z-index:50;background:rgba(16,24,40,.34);opacity:0;visibility:hidden;transition:opacity .26s}
  #scrim.open{opacity:1;visibility:visible}
  #sheet{position:fixed;left:50%;transform:translate(-50%,102%);bottom:0;z-index:51;width:100%;max-width:520px;max-height:88%;
    background:var(--raise);border:1px solid var(--hair);border-bottom:0;border-radius:24px 24px 0 0;
    display:flex;flex-direction:column;transition:transform .34s var(--ease)}
  #sheet.open{transform:translate(-50%,0)}
  .grab{width:40px;height:4px;border-radius:3px;background:var(--field);margin:11px auto 4px;flex:none}
  .shd{display:flex;align-items:center;gap:11px;padding:9px 18px 12px;flex:none}
  .shd .tt{font-size:16px;font-weight:700}
  .shd .ss{margin-top:2px;font:500 12.5px/1 var(--label);color:var(--faint)}
  .shb{flex:1;overflow-y:auto;padding:2px 18px 8px;display:flex;flex-direction:column;gap:13px}
  .fld label{display:block;font:500 13px/1 var(--label);color:var(--mut);margin-bottom:8px}
  .fld input,.fld textarea,.fld select{width:100%;background:var(--field);border:1px solid var(--hair);border-radius:13px;padding:12px 13px;line-height:1.45}
  .fld textarea{resize:vertical;min-height:96px}
  .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--gold-line);outline:none}
  .fld.dirty label{color:var(--warn)}
  .fld.dirty input,.fld.dirty textarea,.fld.dirty select{border-color:var(--warn-line)}
  .diffn{font:500 12.5px/1.5 var(--label);color:var(--warn)}
  .shf{display:flex;gap:11px;padding:14px 18px calc(16px + env(safe-area-inset-bottom));flex:none}
  .bghost{flex:1;min-height:48px;border:1px solid var(--hair);border-radius:14px;font-size:14px;font-weight:700;color:var(--mut)}
  .bghost.danger{color:var(--shake);border-color:rgba(192,51,44,.4)}
  .bsave{flex:2;min-height:48px;border-radius:14px;font-size:14px;font-weight:700;background:var(--nod);color:#fff}

  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:60;width:calc(100% - 28px);max-width:492px;display:flex;flex-direction:column;gap:9px;pointer-events:none}
  .tst{pointer-events:auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:13px 14px;
    box-shadow:var(--shadow-3);animation:rise .3s var(--ease) both}
  .tst .i{flex:none;width:32px;height:32px;border-radius:11px;display:grid;place-items:center}
  .tst.yes .i{background:var(--nod-soft);color:var(--nod)}
  .tst.no .i{background:var(--shake-soft);color:var(--shake)}
  .tst.info .i{background:var(--gold-soft);color:var(--gold)}
  .tst.err .i{background:var(--shake-soft);color:var(--shake)}
  .tst .x{flex:1;min-width:0}
  .tst .m{font-size:13px;font-weight:700;line-height:1.35}
  .tst .s{margin-top:2px;font:500 12.5px/1.4 var(--label);color:var(--faint)}
  .tst .undo{flex:none;min-height:44px;font-size:13px;font-weight:700;color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:12px;padding:0 15px}
  /* Feedback chips ride INSIDE the dismiss toast. Two surfaces at the same moment means one is
     never seen: the first afterglow row competed with this toast for the same glance and lost,
     which read as "you don't collect feedback". One surface, where the eye already is, and it
     never blocks the deck: swipe on and the chips are still here for a beat. */
  .tst.has-chips{flex-wrap:wrap}
  .tst .tchips{flex-basis:100%;display:flex;align-items:center;gap:7px;padding:2px 0 2px 44px}
  .tst .tchips .win{width:100%;max-width:230px}
  .tst .bar{position:absolute;left:0;bottom:0;height:2.5px;width:100%;transform-origin:left;background:var(--gold)}
  .spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--hair);border-top-color:var(--ink);animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .hr2{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--hair-soft);border-radius:18px;padding:13px 14px;margin-bottom:9px}
  .hi2{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 13%,transparent);color:var(--tc);font:700 11px var(--label)}
  .hx{flex:1;min-width:0}
  .hx .t{font-size:13.5px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hx .s{margin-top:3px;font:500 12.5px/1.4 var(--label);color:var(--faint)}
  .hst{flex:none;font:600 12px/1 var(--label);border-radius:99px;padding:6px 10px}
  .hst.ok{color:var(--nod);background:var(--nod-soft)}
  .hst.ed{color:var(--warn);background:var(--warn-soft)}
  .hst.no{color:var(--shake);background:var(--shake-soft)}
  .hst.gray{color:var(--faint);background:var(--field)}
  .hretry{flex:none;min-height:34px;border-radius:99px;padding:0 13px;font:600 12.5px/1 var(--sans);color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold-line);margin-right:2px}
  .hretry:disabled{opacity:.6}
  .hempty{padding:36px 16px;text-align:center;color:var(--faint);font:600 12px/1.7 var(--label)}

  .setup-card{background:var(--surface);border:1px solid var(--hair);border-radius:22px;padding:18px;margin-bottom:12px}
  .sc-h{display:flex;align-items:center;gap:9px}
  .sc-h .nm{font-size:14.5px;font-weight:700}
  .sc-h .st2{margin-left:auto;font:600 12px/1 var(--label);border-radius:99px;padding:6px 10px}

     real Slack failure take a debugging session instead of ten seconds. */
  /* Failure rows STACK. They used to borrow `.pl .kv`, whose `.k` is a fixed 58px column because it
     was built for payload labels like "to" and "channel". A kind label ("This action did not go
     through") crammed into 58px wrapped to five lines beside its own title. Their own classes, so
     the payload list keeps the column it needs and this does not. */
  .fxrow{min-width:0}

  /* One row, never two. Letting the source chip take the full width pushed "Open transcript" onto a
     second row, and on the back of a 420px card a row costs the evidence about a line per quote.
     The button keeps its size and the source label ellipsises into whatever is left. */
  .srcs{flex:none;display:flex;flex-wrap:nowrap;gap:6px;margin-top:10px;overflow:hidden}

  .schip{display:inline-block;min-width:0;max-width:100%;font:500 12.5px/1 var(--label);color:var(--mut);background:var(--field);border:1px solid var(--hair-soft);border-radius:99px;padding:7px 11px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  a.schip{color:var(--aura-2);border-color:rgba(31,87,224,.28)}

  #tmOvl{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(16,24,40,.34);opacity:0;visibility:hidden;transition:opacity .26s}
  #tmOvl.open{opacity:1;visibility:visible}
  #tmPanel{width:100%;max-width:484px;max-height:82dvh;display:flex;flex-direction:column;background:var(--raise);border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow-3);overflow:hidden}
  .tmh{display:flex;align-items:center;gap:11px;padding:14px 14px 10px;flex:none}
  .tmh .tmt{flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tmb{flex:1;overflow-y:auto;padding:4px 18px 20px;font-size:13px;line-height:1.65;color:var(--mut);white-space:pre-wrap;overflow-wrap:break-word;scrollbar-width:none}
  .tmb::-webkit-scrollbar{display:none}
  .tmb mark{background:var(--gold-soft);color:var(--ink);border-radius:4px;padding:1px 3px;box-shadow:inset 0 0 0 1px var(--gold-line)}
  .dr .dot{background:linear-gradient(120deg,var(--aura-1),var(--aura-2))}

  .wchip{min-height:34px;font:600 11px/1 var(--label);color:var(--mut);background:var(--field);border:1px solid var(--hair);border-radius:99px;padding:0 12px}
  .wchip:active{transform:scale(.95)}

  /* ---- the torn stub (left-swipe decision) ----
     The swiped card flies out but its bottom slice stays behind: a 132px strip docked exactly
     where the card's action row was, carrying the flown card's accent and title, above the next
     card, which stays visible but asleep behind a hit shield. Extends the deck's own vocabulary
     (peek, promote, flip) instead of importing a modal. Torn edge: 14px top corners against the
     card's 26px bottom corners. Fixed slot heights so the two steps swap with zero reflow. */
  /* Covers the deck, so the next card is visible behind but unreachable until answered. That is
     the entire mechanism: no gesture code is touched, the overlay simply wins the hit test. */
  #lshield{position:absolute;left:0;right:0;top:0;height:454px;z-index:44}
  #lshield[hidden]{display:none}
  /* Two faces now (fork, then reason) and they are different heights, so the old fixed slot
     heights are gone and the panel sizes to its content. Zero-reflow between steps was only
     achievable when both steps were one 46px row. */
  /* Tall enough for the reason face without scrolling. The first pass capped at 348px and the
     face needs 430, which pushed "Keep it in the deck" below the fold: the one control that undoes
     the whole panel was the one you could not reach. */
  #stub{position:absolute;left:16px;right:16px;top:72px;z-index:45;
    background:var(--surface);border:1px solid var(--hair);border-radius:14px 14px 26px 26px;
    box-shadow:var(--shadow-3);padding:14px 16px 16px;display:flex;flex-direction:column;outline:none;
    max-height:448px;overflow-y:auto}
  #stub[hidden]{display:none}
  #stub .st-rule{position:absolute;top:-1px;left:-1px;right:-1px;height:3px;border-radius:14px 14px 0 0}
  #stub .st-t{flex:none;font:400 13px/1.35 var(--label);color:var(--mut);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
  #stub .st-q{flex:none;font:600 20px/1.2 var(--sans);letter-spacing:-.015em;color:var(--ink);margin-bottom:14px}
  #stub .st-lane{flex:none;display:flex;flex-direction:column;gap:10px}
  /* Every control below is its own class rather than a modifier inside an existing block. A rule
     added inside a block that already matches loses on specificity more often than it wins. */
  #stub .st-opt{width:100%;min-height:72px;border-radius:16px;border:1px solid var(--hair);
    background:var(--surface);padding:0 16px;display:flex;align-items:center;gap:13px;text-align:left}
  #stub .st-opt.later{background:var(--gold-soft);border-color:var(--gold-line)}
  #stub .st-opt .oi{flex:none;width:19px;height:19px;color:var(--mut)}
  #stub .st-opt.later .oi{color:var(--gold)}
  #stub .st-opt .ot{display:flex;flex-direction:column;gap:2px;min-width:0}
  #stub .st-opt .ol{font:600 16px/1.2 var(--sans);color:var(--ink)}
  #stub .st-opt .os{font:400 13px/1.2 var(--sans);color:var(--mut)}
  #stub .st-opt.later .os{color:var(--gold)}
  #stub .st-rsn{width:100%;min-height:48px;border:1px solid var(--hair);border-radius:13px;
    padding:10px 15px;display:flex;align-items:center;text-align:left;background:var(--surface);
    font:500 15px/1.2 var(--sans);color:var(--ink)}
  #stub .st-note{min-height:48px;border:1px solid var(--hair);border-radius:13px;background:var(--field);
    padding:0 5px 0 15px;display:flex;align-items:center;gap:8px}
  #stub .st-note.on{border-color:var(--gold-line)}
  #stub .st-note input{flex:1;min-width:0;height:46px;border:none;background:transparent;
    font:400 15px/1.2 var(--sans);color:var(--ink);padding:0}
  #stub .st-note input:focus{outline:none}
  #stub .st-note .go{flex:none;width:38px;height:38px;border-radius:10px;background:var(--gold);
    border:none;display:none;place-items:center;padding:0}
  #stub .st-note.on .go{display:grid}
  #stub .st-cancel{width:100%;min-height:44px;border:none;background:transparent;border-radius:12px;
    font:500 15px/1 var(--sans);color:var(--mut);margin-top:2px}
  #stub .st-opt:active,#stub .st-rsn:active,#stub .st-cancel:active{transform:scale(.99)}
  #stub.in{animation:stubIn .22s var(--spring) both}
  @keyframes stubIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  #stub.out{animation:stubOut .16s var(--ease) both}
  @keyframes stubOut{to{opacity:0;transform:translateY(8px)}}
  /* Only opacity: the stack offsets are the cards' own transforms and must not be overridden. */
  #deck.asleep .card{opacity:.45;transition:opacity .24s var(--ease)}
  /* The one-line note input, used inside the dismiss toast's chip row. */
  .win{min-width:0;width:190px;height:34px;font:500 12.5px/1 var(--label);color:var(--ink);
    background:var(--field);border:1px solid var(--hair);border-radius:99px;padding:0 12px}
  .win::placeholder{color:var(--faint)}
  .win:focus{outline:2px solid var(--gold);outline-offset:1px}
  .daystrip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;cursor:grab}
  .daystrip:active{cursor:grabbing}
  .daystrip::-webkit-scrollbar{display:none}
  .daychip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--field);border:1px solid var(--hair);border-radius:14px;padding:10px 12px;min-width:126px;max-width:180px;cursor:pointer;text-align:left}
  .daychip .dt{font:500 12.5px/1 var(--label);color:var(--faint)}
  .daychip .dtitle{font:600 12.5px/1.25 var(--sans,inherit);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:156px}
  .daychip .dbrief{font:600 12px/1 var(--label);color:var(--gold)}
  /* ---------------- follow-ups ---------------- */
  .frow{display:flex;gap:13px;background:var(--surface);border:1px solid var(--hair-soft);border-radius:18px;padding:15px 16px;margin-bottom:9px}
  .frow.blocked{border-color:rgba(138,90,0,.22);background:linear-gradient(180deg,rgba(138,90,0,.03),transparent 40%),var(--surface)}
  .frow.done{opacity:.55}
  .fbox{flex:none;width:24px;height:24px;margin-top:1px;border-radius:8px;border:1.5px solid var(--hair);background:var(--surface);
    display:grid;place-items:center;font-size:13px;color:transparent;transition:background .15s,border-color .15s}
  .fbox.on{background:var(--nod);border-color:var(--nod);color:#fff}
  .fbox:active{transform:scale(.92)}
  .fmain{flex:1;min-width:0}
  .ft{font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
  .frow.done .ft{text-decoration:line-through}
  .fm{margin-top:5px;font:500 12.5px/1.4 var(--label);color:var(--faint)}
  .fm.warn{color:var(--warn)}
  .fm.promoted{color:var(--nod);font-weight:600}
  .fm.promoted a{color:inherit;text-decoration:underline}
  .fq{margin-top:10px;padding:10px 12px;border-left:3px solid var(--gold);border-radius:5px 12px 12px 5px;
    background:#F3F7FF;font-size:13.5px;line-height:1.5;color:var(--mid);cursor:pointer}
  .fq .fw{display:block;margin-top:6px;font:500 12px/1 var(--label);color:var(--faint)}
  /* Two lines until tapped, so a long list is not one full quote per row tall. The clamp is on the
     quote TEXT only: putting it on .fq would eat the attribution below and leave a quote nobody
     can attribute. (0,3,0) beats (0,2,0), so `open` wins on specificity, not on source order. */
  .fq .fqt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fq.open .fqt{display:block}
  /* Wrapped, never a horizontal scroller. A row that scrolls sideways inside a view that scrolls
     vertically is the exact shape that gave us `pinLeft`; five chips wrap to two lines at worst. */
  .fchips{display:flex;flex-wrap:wrap;gap:7px;padding:0 4px 12px}
  .fchip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;
    border:1px solid var(--hair-soft);background:var(--surface);font:600 12.5px/1 var(--label);
    color:var(--mut);cursor:pointer}
  .fchip .n{font-weight:700;opacity:.65}
  .fchip.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
  /* The closed pile is folded by default. It rendered up to 25 rows under every open item, which
     on a long list is most of the scrolling for the part of the page nobody came to read. */
  .row-lbl.fclosed-hd{cursor:pointer}
  /* The "what to read" block inside the one Atlassian card: two products, one credential. */
  .su-sub{margin-top:14px;padding-top:13px;border-top:1px solid var(--hair-soft);display:flex;flex-direction:column;gap:9px}
  .su-tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
  .su-tog .tg-n{font-size:14px;color:var(--ink)}
  .su-tog .tg-s{font:600 12px/1 var(--label);color:var(--faint)}
  .su-tog .tg-s.on{color:var(--nod)}
  .su-mini{min-width:62px;height:30px;border-radius:99px;border:1px solid var(--hair);background:var(--field);
    font:600 12px/1 var(--label);color:var(--mut);cursor:pointer}
  .su-mini.on{background:var(--nod);border-color:var(--nod);color:#fff}
  .su-mini:disabled{opacity:.4;cursor:default}
  .su-note-hd{margin:-2px 4px 10px;font:400 13px/1.5 var(--label);color:var(--faint)}
  .frow-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  /* Due state. ONE colour, for ONE state. The palette rule is amber, never red, with red reserved
     for genuinely destructive text and for overdue debt. An overdue promise IS the overdue debt
     that rule was written for, and it is the only thing on this screen
     that qualifies. Everything else stays grey and recedes, which is what makes the red mean
     something. "Due today" gets weight but not colour: it is not late yet. */
  .fdue.late{color:var(--shake);font-weight:600}
  /* Imminent, in two steps, both marked with a dot and neither coloured. The dot takes
     currentColor so it can never drift from its own text, and it is deliberately absent from
     .late: red already carries that row, and marking it twice would say the same thing twice.
     Today is bold and tomorrow is not, which is the whole gradient: red, marked and bold, marked,
     grey. */
  .fdue.today,.fdue.soon{color:var(--ink)}
  .fdue.today{font-weight:600}
  .fdue.today::before,.fdue.soon::before{content:"";display:inline-block;width:5px;height:5px;
    border-radius:50%;background:currentColor;margin-right:6px;vertical-align:middle;position:relative;top:-1px}
  /* ONE object, not four loose controls. align-self:flex-start is NOT cosmetic: .frow is a flex
     row, so the default align-items:stretch ran this the full height of the card (measured at
     151px, never noticed by reading). Pinned to the top so it aligns with the title. */
  .frail{flex:none;align-self:flex-start;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:4px;border-radius:13px;background:var(--field);border:1px solid var(--hair-soft)}
  /* The position number IS the drag handle, so a numbered list needs no second affordance and no
     extra column. `touch-action:none` is on this element ALONE: main carries `touch-action:pan-y`,
     so a finger anywhere else on the row still scrolls the list normally and only the grip drags.
     Two classes are not needed here, nothing else in the sheet matches .fgrip. */
  .fgrip{position:relative;width:28px;padding:4px 0 3px;border-radius:9px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);
    cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  .fgrip .fgdots{opacity:.5}
  .fgrip .fgn{font:700 10.5px/1 var(--label);font-variant-numeric:tabular-nums;color:var(--faint)}
  /* Draws at 28px wide, catches at 44px. The visible handle stays small because it sits on every
     row, but a 22px grab target was one of the two reasons this read as broken twice. */
  .fgrip::after{content:"";position:absolute;inset:-8px}
  .fgrip:active{cursor:grabbing;background:var(--hair-soft)}
  .fgrip:hover .fgdots{opacity:.85}
  /* A hairline between the handle and the buttons, so one rail still reads as two jobs. */
  .frail .fmv:first-of-type{margin-top:1px;border-top-color:var(--hair)}
  /* While a drag is live, nothing else on the page may claim the gesture: no text selection under
     a travelling finger, and no accidental tap targets. Set on body so it covers the row wherever
     the drag has moved it to. */
  body.fdragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
  body.fdragging .frow:not(.fdrag){pointer-events:none}
  /* Lifted while it is under the finger. (0,2,0) beats .frow's (0,1,0), so it wins on specificity
     and not merely on being written later. */
  /* Lifted, and unmistakably so: the whole point of a long-press is that the user needs to SEE the
     moment it took, or they let go and conclude nothing happened.
     NO transform here on purpose. The drag writes an inline translateY every move to follow the
     finger, and an inline transform beats a stylesheet one, so a scale() written here would be
     silently discarded the instant the row moved. */
  .frow.fdrag{position:relative;z-index:3;box-shadow:0 12px 30px rgba(16,24,40,.22);border-color:var(--gold)}
  .frow.fdrag .fgrip{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
  .frow.fdrag .fgrip .fgdots{opacity:1}
  /* The hint that tells someone the feature exists at all. Shown until they reorder once. */
  .fhint{display:flex;align-items:center;gap:7px;margin:-2px 4px 11px;font:400 12.5px/1.4 var(--label);color:var(--faint)}
  .fhint svg{flex:none;opacity:.6}
  /* .fmove is gone: these buttons live inside .frail now, with the handle, as one control object.
     They sit ON the rail's tint rather than carrying their own surface, which is what stops four
     separate boxes reading as clutter. */
  .fmv{width:28px;height:26px;border-radius:8px;border:1px solid transparent;background:transparent;
    color:var(--faint);font:600 13px/1 var(--label);display:grid;place-items:center}
  .fmv:disabled{opacity:.28}
  .fmv:active:not(:disabled){transform:scale(.92);background:var(--surface);border-color:var(--hair-soft)}
  .fmv:hover:not(:disabled){background:var(--surface)}
  /* A closed item you can reopen versus one you cannot. These rendered identically until
     2026-08-04, so the only way to learn which was which was to tap and watch nothing happen. The
     reopenable one keeps a real border and a pointer; the promoted one is visibly settled. */
  .fbox.can-undo{cursor:pointer}
  .fbox.locked{opacity:.6;box-shadow:none}
  .frow.done.reopenable{opacity:.7}
  .fbtn{min-height:40px;border-radius:12px;padding:0 14px;font:600 13.5px/1 var(--sans);
    border:1px solid var(--hair);background:var(--surface);color:var(--mut)}
  .fbtn.go{background:var(--gold);color:#fff;border-color:transparent}
  .fbtn:active{transform:scale(.97)}
  .fbtn:disabled{opacity:.6}
  .fnote{margin:-4px 0 11px;font:400 13px/1.5 var(--label);color:var(--faint)}
  .daychip.past{opacity:.42}
  .daychip:disabled{opacity:.55;cursor:wait}
  .daychip:active{transform:scale(.97)}
  /* ---------------- first run ----------------
     New class names throughout rather than reusing .setup-card or .say: this view is temporary in
     a user's life and permanent in the codebase, and sharing classes with Today means every future
     tweak to Today has to be re-checked here. */
  /* The .ob- prefix marks the full-screen first-run kit. */
  #vOnboard{padding:6px 20px 40px}

  .ob-receipt .rl{font:500 12px/1 var(--label);letter-spacing:.09em;text-transform:uppercase;color:var(--nod)}
  .ob-receipt .rb{font:500 15px/1.45 var(--sans);color:var(--ink);margin-top:7px;text-wrap:pretty}
  /* ---------------- setup ----------------
     Built for the person coming back three weeks later. The order answers what they actually came
     for, in frequency order: something broke, I want to feed it a meeting, I want to see what it
     knows about me. */
  /* Geometry: 20px cards, 18px padding, sections separated by 22px with a 10px gap under the
     eyebrow. The first build of this page used the app's older 16px card and read as a different
     product next to the other screens. */
  #vSetup{padding-left:0;padding-right:0}
  .su-head{display:flex;align-items:center;gap:12px;padding:12px 20px 20px}
  .su-head .h{flex:1;font:600 27px/1.1 var(--sans);letter-spacing:-.025em;color:var(--ink)}
  .su-head .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(140deg,#DCE4F5,#C8D4EE);
    display:grid;place-items:center;font:600 14px/1 var(--sans);color:#4A5568}
  .su-grp{padding:0 16px 22px;display:flex;flex-direction:column;gap:10px}
  .su-sec{font:500 12px/1 var(--label);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);padding:0 4px}
  .su-sec.warn{color:var(--warn)}
  .su-card{background:var(--surface);border:1px solid rgba(16,24,40,.08);border-radius:20px}
  .su-pad{padding:18px;display:flex;flex-direction:column;gap:14px}
  .su-note{font:400 14.5px/1.45 var(--sans);color:var(--mut);text-wrap:pretty}
  .su-foot{font:400 13.5px/1.45 var(--label);color:var(--faint);padding:0 6px;text-wrap:pretty}
  /* Needs you: a full card with the damage named and one button, not a chip. Zero height when
     nothing is broken, so it is never a permanent banner slot. */
  .su-alert{background:var(--warn-soft);border-color:var(--warn-line)}
  .su-btn{width:100%;min-height:50px;border-radius:14px;border:none;font:600 15px/1 var(--sans);
    background:var(--ink);color:#fff}
  .su-btn.blue{background:var(--gold)}
  .su-btn.ghost{background:var(--surface);border:1px solid var(--hair);color:var(--mut)}
  /* Scoped to this one button: a general .su-btn:disabled rule would also dim Read it while it
     says Haii is reading. Disabled here means no Google client is set, and the note above it says so. */
  #gConnect:disabled{opacity:.45;cursor:not-allowed}

     it never touches, and what it writes. Collapsed by default because it is reassurance, not
     something to wade through every visit. */
  .su-conn{display:flex;align-items:center;gap:13px;width:100%;padding:16px 18px;background:none;

  .su-conn .sub.warn{color:var(--warn)}

  .su-dot.warn{background:#E0A008}

     every connector panel is open from the moment Setup renders, and `el.hidden` still reads true
     while 240px of it sits on screen. Same bug as the why-chips, in the same file, and the DOM
     assertion that checked `.hidden` passed both times. */
  .su-panel[hidden]{display:none}
  .su-panel .pr{display:flex;gap:10px}
  .su-panel .pk{font:500 13px/1.45 var(--sans);width:64px;flex:none}
  .su-panel .pk.r{color:var(--nod)}
  .su-panel .pk.n{color:var(--faint)}
  .su-panel .pk.w{color:var(--gold)}
  .su-panel .pv{font:400 14px/1.45 var(--sans);color:var(--mid,#3E4551);text-wrap:pretty}
  .su-danger{min-height:44px;display:flex;align-items:center;background:none;border:none;padding:0;
    font:500 14.5px/1 var(--sans);color:#C0392B}

  .su-chips{display:flex;flex-wrap:wrap;gap:7px}

  .su-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .su-lbl{font:600 14.5px/1 var(--sans);color:var(--ink)}

  .su-mem:last-child{border-bottom:none}

     rows tall. Paired with its own display rule rather than relying on an attribute, which is the
     trap that put 240px of open Setup panel on screen while the assertion said hidden. */
  .su-mem.folded{display:none}
  .su-memmore{width:100%;padding:13px 0;background:none;border:none;border-top:1px solid var(--hair-soft);

  .su-op .oh{font:500 12px/1 var(--label);letter-spacing:.09em;text-transform:uppercase;color:var(--warn);margin-bottom:14px}

  .ob-s{font:400 16px/1.5 var(--sans);color:var(--mut);text-wrap:pretty;margin-bottom:22px}

  .ob-fill{height:100%;background:var(--gold);border-radius:100px;transition:width .3s ease}
  .ob-rows{display:flex;flex-direction:column;gap:2px;margin-bottom:24px}

<body>

    card("h_research", "send_email", "tr_planning", "Send the research summary",
      "Promised for the same afternoon.", "I'll send the research summary to the team this afternoon.",
      { to: "team@lumen.example", subject: "Research summary from the customer calls", body: "Team,\n\nThe summary from last week's customer calls is attached.\n\nAlex" },
      "normal", 0.87, "executed", -3 * DAY + 3 * HOUR, done("Demo. A real install drafts this in your Gmail, ready to send.", -3 * DAY + 3 * HOUR)),
    card("h_timing", "create_todo", "tr_renewal", "Come back to Marcus on approval timing",
      "Due Monday.", "I'll come back to you on approval timing by Monday.",
      { title: "Come back to Marcus on approval timing", due: nextWeekday(1), notes: "" },

      { title: "Review the pricing page", due: ymd(-1), notes: "" },
      "normal", 0.8, "executed", -3 * DAY + 4 * HOUR, done("Saved to your to-do list in Haii.", -3 * DAY + 4 * HOUR)),
  ];
  var byId = function (id) { for (var i = 0; i < CARDS.length; i++) if (CARDS[i].id === id) return CARDS[i]; return null; };

  var RECEIPT = {
    send_email: "Demo. A real install drafts this in your Gmail, ready to send.",
    create_calendar_event: "Demo. A real install books this on your Google Calendar.",
    send_slack_message: "Demo. A real install posts this to Slack.",
    create_document: "Demo. A real install writes this as a Google Doc.",
    share_file: "Demo. A real install shares a file only if Haii created it. Any other file comes back as not sent.",
    create_crm_note: "Demo. A real install writes this note to your CRM.",
    create_task: "Demo. A real install files this in your tracker.",
    create_jira_issue: "Demo. A real install files this in Jira.",
    create_todo: "Saved to your to-do list in Haii.",
    send_text: "Demo. A real install opens Messages with this ready to send.",
  };

  /* ---------------- follow-ups ---------------- */
  var todo = function (id, title, due, tr, quote, isDone, cardId) {
    return {
      id: id, title: title, due: due || null, notes: "", done: Boolean(isDone), group: "yours", connector: null,
      card_id: cardId || null, source: TRANSCRIPTS[tr].title,
      quote: { text: quote, who: ME, t: null }, created_at: iso(TRANSCRIPTS[tr].at + 25 * MIN),
      promote_targets: [], sort_order: null, reopenable: true, promoted: null,
    };
  };
  var TODOS = [
    todo("t_page", "Review the pricing page", ymd(-1), "tr_planning", "I'll review the pricing page in the next two days.", false, "h_page"),
    todo("t_timing", "Come back to Marcus on approval timing", nextWeekday(1), "tr_renewal", "I'll come back to you on approval timing by Monday.", false, "h_timing"),
    todo("t_agreement", "Send the revised agreement to Dana", "", "tr_planning", "I'll send the revised agreement to Dana once legal signs off."),
    todo("t_numbers", "Prepare the quarterly numbers", monthEnd(-3), "tr_planning", "I'll prepare the quarterly numbers before the end of the month."),
    todo("t_summary", "Send the research summary to the team", ymd(-3), "tr_planning", "I'll send the research summary to the team this afternoon.", true),
  ];

  /* ---------------- meetings and briefs ---------------- */
  var BRIEFS = {
    br_renewal: {
      tldr: "Dana still does not have the tiered pricing you promised, and she opened with it last time. Bring the number, or bring the hour it lands.",
      sections: [
        { h: "The people", items: [
          "Dana Reyes signs this. She has asked for the pricing twice.",
          "Marcus Hale is finance. He cannot take it to approval without the annual option in writing.",
          "You own the number. Nobody else in the room can give it.",
        ] },
        { h: "What to say first", items: [
          "Open with the pricing, not the apology.",
          "Confirm Thursday for the security review, with Priya in the room.",
          "Give Marcus a date for approval timing before he asks again.",
        ] },

      last_met: [
        { st: "open", t: "You said the tiered pricing would land by end of day tomorrow." },
        { st: "open", t: "You said you would set up the security review for Thursday." },
        { st: "done", t: "You logged where the renewal call got to." },

      open_threads: [
        "Tiered pricing with the volume breaks, promised and not yet sent.",
        "The annual option, in writing, for Marcus.",
