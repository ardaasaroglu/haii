    },
    br_design: {
      tldr: "Omar is waiting on one decision and you already made it in standup. Say it again here and move on.",
      sections: [
        { h: "The people", items: ["Omar Haddad is blocked on the empty state copy.", "Priya Shah wants the webhook fix scheduled before anything new."] },
        { h: "What to say first", items: ["The empty state shows the sample deck.", "The webhook ticket exists and has an owner."] },
      ],
      last_met: [{ st: "open", t: "You said you would post the empty state decision in the design channel." }],
      open_threads: ["The onboarding empty state.", "When the pricing page goes live."],
    },
  };
  var MEETINGS = [
    { id: "m_standup", title: "Product standup", start: -3 * HOUR, mins: 25, brief: null, attendees: ["Priya Shah", "Omar Haddad", "Noor Aziz"] },
    { id: "m_renewal", title: "Northwind renewal", start: 24 * MIN, mins: 45, brief: "br_renewal", attendees: ["Dana Reyes", "Marcus Hale"] },
    { id: "m_design", title: "Design review", start: 3 * HOUR, mins: 30, brief: null, attendees: ["Omar Haddad", "Priya Shah"] },
  ];
  MEETINGS.forEach(function (m) { m.t0 = Date.now() + m.start; });
  var briefRow = function (id) {
    var m = MEETINGS.filter(function (x) { return x.brief === id; })[0];
    return { id: id, userId: "demo", meetingId: m ? m.id : null, contentJson: BRIEFS[id], model: "demo",
      promptVersion: "briefing.v005", rating: RATING[id] || null, feedbackNote: null, readSeconds: 0, createdAt: iso(-95 * MIN) };
  };
  var RATING = {};

  var MEMORIES = [
    "Alex keeps emails short and puts the ask in the first line.",
    "Dana Reyes signs for Northwind. Marcus Hale approves the budget.",
    "Alex does not book meetings before 10:00.",
    "Priya Shah owns security reviews.",
    "Alex writes decisions in the design channel, not in direct messages.",
  ].map(function (content, i) { return { id: i + 1, content: content, updatedAt: iso(-(i + 1) * DAY) }; });

  /* ---------------- answering the app ---------------- */
  var timers = {};
  var rank = { high: 0, normal: 1, low: 2 };
  var proposed = function () {
    return CARDS.filter(function (c) { return c.status === "proposed"; })
      .sort(function (a, b) { return (rank[a.priority] - rank[b.priority]) || (b.confidence - a.confidence); });
  };
  var settle = function (c) {
    // What the real executor does a few seconds after the nod, once undo has expired.
    c.status = "executed";
    c.feedback.executed = { mode: "real", detail: RECEIPT[c.actionType] || "Demo." };
    if (c.actionType === "create_todo" && !TODOS.some(function (t) { return t.card_id === c.id; })) {
      var q = c.context.why[0];
      TODOS.unshift({
        id: "t_" + c.id, title: c.payload.title || c.title, due: c.payload.due || null, notes: c.payload.notes || "", done: false,
        group: "yours", connector: null, card_id: c.id, source: c.sourceJson.title,
        quote: { text: q.text, who: q.who, t: null }, created_at: new Date().toISOString(),
        promote_targets: [], sort_order: null, reopenable: true, promoted: null,
      });
    }
  };

  var feed = function () {
    var next = MEETINGS.filter(function (m) { return m.t0 + m.mins * MIN > Date.now(); })[0] || null;
    return {
      failures: { total: 0, items: [] },
      user: { id: "demo", name: ME, role: "Product lead at Lumen", is_admin: false, telegram_linked: false,
        tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"), tz_pinned: false, email: "", created_at: iso(-21 * DAY),
        owns: "", catches: [], needs_name: false },
      now: new Date().toISOString(),
      today_meetings: MEETINGS.map(function (m) {
        return { id: m.id, title: m.title, starts_at: new Date(m.t0).toISOString(), ends_at: new Date(m.t0 + m.mins * MIN).toISOString(), brief_id: m.brief };
      }),
      next_meeting: next ? {
        id: next.id, userId: "demo", title: next.title, startsAt: new Date(next.t0).toISOString(), endsAt: new Date(next.t0 + next.mins * MIN).toISOString(),
        attendees: next.attendees.map(function (n) { return { name: n }; }),
        briefing: next.brief ? { id: next.brief, content: BRIEFS[next.brief], rating: RATING[next.brief] || null, note: null, model: "demo",
          prompt_version: "briefing.v005", written_at: iso(-95 * MIN) } : null,
      } : null,
      cards: clone(proposed()),
      digest: { rows: [
        { text: "<b>3 meetings</b> today. The Northwind renewal is the one that matters." },
        { text: "<b>3 promises</b> to Northwind are waiting in your deck: the pricing, the security review and the implementation plan." },
        { text: "In the renewal call you made <b>5 commitments</b>. Three are in your deck and you already approved two." },
      ] },
      signals_24h: 37,
      connections: [{ id: "google", status: "connected" }, { id: "slack", status: "connected" }, { id: "jira", status: "disconnected" },
        { id: "linear", status: "connected" }, { id: "telegram", status: "disconnected" }, { id: "anthropic", status: "connected" }],
      undo_grace_ms: 5000,
      has_real_cards: true,
      snoozed_count: CARDS.filter(function (c) { return c.status === "snoozed"; }).length,
      onboarding: "done",
    };
  };

  var NOT_HERE = "This is the demo week. Run Haii on your own machine to use it on your own meetings.";
  var ok = function (json) { return { status: 200, json: json }; };
  var bad = function (status, error) { return { status: status, json: { error: error } }; };

  var route = function (method, path, query, body) {
    var m;
    if (path === "/healthz") return ok({ ok: true, mode: "demo", commit: "demo", ts: new Date().toISOString() });
    if (path === "/api/v1/feed") return ok(feed());
    if (path === "/api/v1/settings") return ok({ host: "127.0.0.1" });

    if ((m = path.match(/^\/api\/v1\/cards\/([^/]+)\/decision$/))) {
      var c = byId(decodeURIComponent(m[1]));
      if (!c) return bad(404, "not found");
      if (method === "DELETE") {
        if (c.status === "executed") return bad(409, "too late: execution already started");
        if (["approved", "dismissed", "snoozed"].indexOf(c.status) < 0) return bad(409, "cannot undo: card is " + c.status);
        clearTimeout(timers[c.id]); delete timers[c.id];
        c.status = "proposed"; c.feedback = null; c.decidedAt = null;
        return ok({ ok: true, status: "proposed", promotion_released: false });
      }
      if (["approved", "edited", "dismissed", "snoozed"].indexOf(body.decision) < 0) return bad(400, "invalid decision: expected approved | edited | dismissed | snoozed");
      if (c.status !== "proposed") return bad(409, "card is " + c.status);
      if (body.decision === "snoozed") {
        c.status = "snoozed"; c.snoozeCount += 1;
        var back = new Date(Date.now() + DAY); back.setHours(8, 0, 0, 0);
        return ok({ ok: true, decision: "snoozed", returns_at: back.toISOString(), rule: "next_morning", snooze_count: c.snoozeCount });
      }
      c.feedback = { decision: body.decision, edited_payload: body.decision === "edited" ? (body.edited_payload || null) : null,
        edit_diff: body.edit_diff || [], latency_ms: body.latency_ms || 0, via: body.via || "unknown", decided_at: new Date().toISOString() };
      c.decidedAt = new Date().toISOString();
      if (body.decision === "dismissed") { c.status = "dismissed"; return ok({ ok: true, status: "dismissed" }); }
      if (body.decision === "edited" && body.edited_payload) c.payload = body.edited_payload;
      c.status = "approved";
      timers[c.id] = setTimeout(function () { delete timers[c.id]; if (c.status === "approved") settle(c); }, 5000);
      return ok({ ok: true, status: "approved", undo_deadline: iso(5000) });
    }
    if ((m = path.match(/^\/api\/v1\/cards\/([^/]+)\/dismiss-reason$/))) {
      var dc = byId(decodeURIComponent(m[1]));
      if (dc && dc.feedback) dc.feedback.reason = body.reason || "";
      return ok({ ok: true });
    }
    if (/^\/api\/v1\/cards\/[^/]+\/retry$/.test(path)) return ok({ ok: true, detail: "Nothing to retry in the demo." });

    if (path === "/api/v1/history") {
      var decided = CARDS.filter(function (x) { return ["approved", "executing", "executed", "dismissed", "failed", "expired"].indexOf(x.status) >= 0; })
        .sort(function (a, b) { return String(b.decidedAt).localeCompare(String(a.decidedAt)); })
        .map(function (x) { return { id: x.id, actionType: x.actionType, title: x.title, status: x.status, decidedAt: x.decidedAt, createdAt: x.createdAt, feedback: x.feedback }; });
      var off = Math.max(0, Number(query.get("offset")) || 0);
      return ok({ cards: clone(decided.slice(off, off + 20)), has_more: decided.length > off + 20,
        todos: TODOS.map(function (t) { return { id: t.id, title: t.title, status: t.done ? "done" : "open" }; }) });
    }

    if (path === "/api/v1/followups") {
      return ok({ items: clone(TODOS),
        open_yours: TODOS.filter(function (t) { return !t.done; }).length, open_blocked: 0 });
    }
    if (path === "/api/v1/todos/reorder") {
      (body.ids || []).forEach(function (id, n) { TODOS.forEach(function (t) { if (t.id === id) t.sort_order = n; }); });
      return ok({ ok: true, ordered: (body.ids || []).length });
    }
    if ((m = path.match(/^\/api\/v1\/todos\/([^/]+)\/toggle$/))) {
      var t = TODOS.filter(function (x) { return x.id === decodeURIComponent(m[1]); })[0];
      if (!t) return bad(404, "not found");
      t.done = !t.done;
      return ok({ ok: true, status: t.done ? "done" : "open" });
    }
    if (/^\/api\/v1\/todos\/[^/]+\/promote$/.test(path)) return bad(400, "Jira is not connected in the demo.");

    if ((m = path.match(/^\/api\/v1\/briefings\/([^/]+)$/))) {
      return BRIEFS[m[1]] ? ok(briefRow(m[1])) : bad(404, "not found");
    }
    if ((m = path.match(/^\/api\/v1\/briefings\/([^/]+)\/rating$/))) { RATING[m[1]] = body.rating || null; return ok({ ok: true, saved: true }); }
    if (/^\/api\/v1\/briefings\/[^/]+\/(note|read)$/.test(path)) return ok({ ok: true, saved: true });
    if ((m = path.match(/^\/api\/v1\/meetings\/([^/]+)\/brief$/))) {
      var mt = MEETINGS.filter(function (x) { return x.id === decodeURIComponent(m[1]); })[0];
      if (!mt) return bad(404, "not found");
      if (!mt.brief) { if (mt.id !== "m_design") return ok({ detail: "skipped: that meeting has already ended" }); mt.brief = "br_design"; }
      return ok({ ok: true, briefing_id: mt.brief, detail: "brief ready" });
    }

    if (path === "/api/v1/transcripts" && method === "POST") return bad(400, NOT_HERE);
    if ((m = path.match(/^\/api\/v1\/transcripts\/([^/]+)$/))) {
      var tr = TRANSCRIPTS[decodeURIComponent(m[1])];
      if (!tr) return bad(404, "not found");
      return ok({ id: tr.id, title: tr.title, content_md: tr.content_md, source: "demo", ingested_at: iso(tr.at + 15 * MIN) });
    }

    if (path === "/api/v1/connections") {
      return ok({
        connections: [
          { id: "google", status: "connected", last_item_at: iso(-12 * MIN) },
          { id: "slack", status: "connected", last_item_at: iso(-40 * MIN), channels: [] },
          { id: "jira", status: "disconnected", last_item_at: null },
          { id: "linear", status: "connected", last_item_at: iso(-30 * MIN) },
          { id: "telegram", status: "disconnected", last_item_at: null },
          { id: "anthropic", status: "connected", last_item_at: null },
        ],
        llm_mode: "api", anthropic_key_present: true, google_client_configured: true, slack_client_configured: true,
        telegram_configured: false, budget: { spend_today: 0, soft: 0.75, hard: 1.5 },
      });
    }
    if (/^\/api\/v1\/connections\//.test(path)) return bad(400, NOT_HERE);
    if (path === "/api/v1/memories") return ok({ memories: clone(MEMORIES) });
    if ((m = path.match(/^\/api\/v1\/memories\/([^/]+)$/)) && method === "DELETE") {
      MEMORIES = MEMORIES.filter(function (x) { return String(x.id) !== m[1]; });
      return ok({ ok: true });
    }
    if (path === "/api/v1/jobs") return ok({ runs: [] });
    if (/^\/api\/v1\/jobs\//.test(path)) return ok({ ok: true, detail: "Jobs do not run in the demo." });
    if (path === "/api/v1/telegram/link") return ok({ configured: false });
    if (path === "/api/v1/stats") return ok({ by_type: {}, decided_total: CARDS.filter(function (x) { return x.status !== "proposed"; }).length });
    if (path === "/api/v1/onboarding/progress") return ok({ done: true, total: 0, readable: 0, read: 0, unreadable: 0, meetings: [] });
    return ok({ ok: true, changed: false, saved: false });
  };

  var realFetch = w.fetch ? w.fetch.bind(w) : null;
  w.fetch = function (input, init) {
    var raw = typeof input === "string" ? input : (input && input.url) || "";
    var u;
    try { u = new URL(raw, w.location.href); } catch (e) { return realFetch(input, init); }
    if (!/^\/(api\/|healthz$|auth\/)/.test(u.pathname)) return realFetch(input, init);
    var body = {};
    try { body = init && init.body ? JSON.parse(init.body) : {}; } catch (e) { body = {}; }
    var out = route(String((init && init.method) || "GET").toUpperCase(), u.pathname, u.searchParams, body || {});
    return new Promise(function (resolve) {
      setTimeout(function () {
        resolve(new Response(JSON.stringify(out.json), { status: out.status, headers: { "content-type": "application/json" } }));
      }, 90);
    });
  };

  /* ---------------- saying that it is a demo ---------------- */
  // Connect, reconnect and sign out lead to pages that do not exist here, so they are answered in
  // place rather than followed. Capture phase, so the app's own handler never runs.
  // Its own small notice, because the app keeps its toast private inside a closure.
  var noteTimer = null;
  var note = function () {
    var n = w.document.getElementById("demoNote");
    if (!n) {
      n = w.document.createElement("div");
      n.id = "demoNote";
      n.setAttribute("role", "status");
      n.setAttribute("style", "position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:9999;max-width:calc(100% - 48px);" +
        "padding:11px 16px;border-radius:14px;background:#10182B;color:#fff;font:500 13.5px/1.35 system-ui,sans-serif;text-align:center;" +
        "box-shadow:0 10px 30px rgba(16,24,43,.28)");
      w.document.body.appendChild(n);
    }
    n.textContent = "This is the demo week. Nothing is connected, read or sent here.";
    n.hidden = false;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { n.hidden = true; }, 2800);
  };
  if (w.document && w.document.addEventListener) {
    w.document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("#vSetup button, #vSetup a") : null;
      if (!b) return;
      if (/^(connect|reconnect|sign out|disconnect|link )/i.test((b.textContent || "").trim())) {
        e.preventDefault(); e.stopImmediatePropagation(); note();
      }
    }, true);
    // An in-flow bar ABOVE the header, never a floating pill: the header carries the greeting and
    // the live state, and a label that covers them is a worse lie than no label.
    // One line even at 320px wide: the text is short, and if a wide font still runs out of room,
    // the label gives way with an ellipsis while the source link stays whole.
    var bar = function () {
      var head = w.document.querySelector("header");
      if (!head || w.document.getElementById("demoBar")) return;
      var d = w.document;
      var tag = d.createElement("div");
      tag.id = "demoBar";
      tag.setAttribute("style", "flex:none;display:flex;justify-content:center;align-items:center;gap:5px;padding:5px 10px;" +
        "background:#10182B;color:#fff;font:500 11.5px/1.3 system-ui,sans-serif;letter-spacing:.02em;white-space:nowrap");
      var label = d.createElement("span");
      label.textContent = "Fictional demo · nothing is sent";
      label.setAttribute("style", "min-width:0;overflow:hidden;text-overflow:ellipsis");
      var sep = d.createElement("span");
      sep.textContent = "·";
      sep.setAttribute("aria-hidden", "true");
      sep.setAttribute("style", "flex:none");
      var src = d.createElement("a");
      src.href = "https://github.com/ardaasaroglu/haii";
      src.target = "_blank";
      src.rel = "noopener";
      src.textContent = "Source on GitHub";
      src.setAttribute("style", "flex:none;color:inherit;text-decoration:underline;text-underline-offset:2px");
      tag.appendChild(label);
      tag.appendChild(sep);
      tag.appendChild(src);
      head.parentNode.insertBefore(tag, head);
    };
    bar();
    w.document.addEventListener("DOMContentLoaded", bar);
  }

  // For demo.test.ts, which checks every quote against these transcripts and every receipt's wording.
  w.__HAII_DEMO = { transcripts: TRANSCRIPTS, cards: CARDS, todos: TODOS, receipts: RECEIPT, route: route };
})();

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

const TYPES={
 send_email:{label:"Email",color:"var(--c-email)",glyph:"@"},
 create_calendar_event:{label:"Calendar",color:"var(--c-cal)",glyph:"▦"},
 create_todo:{label:"To-do",color:"var(--c-todo)",glyph:"✓"},
 send_slack_message:{label:"Slack",color:"var(--c-slack)",glyph:"#"},
 create_jira_issue:{label:"Jira",color:"var(--c-jira)",glyph:"◈"},
 // The four types added 2026-08-09. MISSING THESE IS NOT COSMETIC: a card whose action type is not
 // in this map renders its chip as "undefined undefined" with an undefined colour, and one missing
 // from FIELDS below cannot be EDITED at all, which for a document means the text is created in the
 // user's Drive with no chance to correct it first. The swipe is the stated defence and the edit
 // sheet is how you fix a payload before spending it; both need an entry here.
 create_document:{label:"Document",color:"var(--c-doc)",glyph:"▤"},
 share_file:{label:"Share",color:"var(--c-share)",glyph:"↗"},
 create_crm_note:{label:"CRM note",color:"var(--c-crm)",glyph:"◎"},
 create_task:{label:"Task",color:"var(--c-task)",glyph:"⬡"},
 // The tenth type, 2026-08-12. Its own hue for the same reason every other type has one: the chip
 // colour and the rule across the top of the card are an information channel, not decoration.
 send_text:{label:"Text",color:"var(--c-text)",glyph:"◗"}
};
const FIELDS={
 send_email:[["to","To","email"],["subject","Subject","text"],["body","Body","textarea"]],
 // "Start (24h)" because the executor validates /^\d{1,2}:\d{2}$/ before creating the event, so an
 // edited "2:00 PM" is rejected on approval. The card DISPLAYS the user's own format; this field is
 // the one place the raw payload shape leaks, and saying so costs one word.
 create_calendar_event:[["title","Title","text"],["date","Date","text"],["time","Start (24h)","text"],["duration_min","Duration (min)","number"],["attendees","Attendees","text"]],
 create_todo:[["title","Task","text"],["due","Due","text"],["notes","Notes","textarea"]],
 send_slack_message:[["channel","Channel","text"],["message","Message","textarea"]],
 create_jira_issue:[["project","Project","text"],["issue_type","Type","text"],["summary","Summary","text"],["description","Description","textarea"],["labels","Labels","text"]],
 // "Content" is a textarea because it IS the document: it goes into the user's Drive verbatim, so
 // it is the single most important field on this screen to be able to correct before nodding.
 create_document:[["title","Title","text"],["content","Content","textarea"],["share_with","Share with","text"]],
 share_file:[["file_name","File","text"],["emails","Share with","text"],["role","Access (reader/commenter/writer)","text"]],
 create_crm_note:[["contact","Contact","text"],["note","Note","textarea"]],
 // Destination is first and editable on purpose: the model reads a tracker name out of a
 // transcript, and a wrong guess should be one tap to fix rather than a ticket in the wrong tool.
 create_task:[["destination","Tracker (jira/linear/asana)","text"],["title","Title","text"],["description","Description","textarea"],["due","Due","text"]],
 // "Number (optional)" says the quiet part out loud. An empty `to` is a VALID card: Messages opens
 // with the To field blank and the message written, and the user picks the person from their own
 // contacts. Labelling it "To" would read as a field they had failed to fill in.
 send_text:[["to","Number (optional)","text"],["body","Message","textarea"]]
};
// Display names for connector ids, so a banner says "Google" rather than "google".
const CONN_NAME={google:"Google",slack:"Slack",jira:"Jira",confluence:"Confluence",fireflies:"Fireflies",fathom:"Fathom",otter:"Otter",hubspot:"HubSpot",salesforce:"Salesforce",linear:"Linear",asana:"Asana"};
// The trackers a create_task card can be filed in. The executor blocks any other destination.
const TRACKER_NAME={jira:"Jira",linear:"Linear",asana:"Asana"};

/* ---------------- orb ---------------- */
const Orb=(()=>{
  const cv=$("#orb"),ctx=cv.getContext("2d");
  /* Light skin: the palette is the v2 iris (teal, brand blue, violet) and the moods are unchanged,
     so the orb still nods green and shakes red on every decision. What changed is the compositing.
     The dark orb painted additively on near-black, which is the only way that reads; do the same
     over a light disc and every blob clips to white. So blobs are drawn opaque over a tinted base
     and a specular highlight goes on top, so it still reads as a sphere. */
  const PAL={idle:[[62,214,192],[46,107,255],[139,124,246]],nod:[[16,180,130],[62,214,192],[70,205,160]],shake:[[214,74,68],[233,130,80],[224,90,96]]};
  let mood="idle",cur=PAL.idle.map(c=>c.slice()),t=0,moodT=null;
  function blob(cx,cy,r,rgb,a){const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,`rgba(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0},${a})`);g.addColorStop(1,`rgba(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0},0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();}
  function draw(){const tp=PAL[mood]||PAL.idle;
    for(let i=0;i<3;i++)for(let k=0;k<3;k++)cur[i][k]+=(tp[i][k]-cur[i][k])*.09;
    const w=cv.width,h=cv.height,cx=w/2,cy=h/2,base=Math.min(w,h);
    ctx.clearRect(0,0,w,h);
    // Base is the mid tone of the current mood, so the sphere never washes out to the page.
    ctx.fillStyle=`rgb(${cur[1][0]|0},${cur[1][1]|0},${cur[1][2]|0})`;ctx.fillRect(0,0,w,h);
    const R=base*.62;
    blob(cx+Math.cos(t*.7)*base*.16,cy+Math.sin(t*.9)*base*.15,R,cur[0],.85);
    blob(cx+Math.cos(t*.9+2)*base*.18,cy+Math.sin(t*.6+1)*base*.17,R*.92,cur[2],.7);
    blob(cx+Math.cos(t*.5+4)*base*.14,cy+Math.sin(t*1.1+3)*base*.13,R*.8,cur[1],.6);
    // Specular highlight up and left, and a soft occlusion down and right: reads as a sphere.
    const hi=ctx.createRadialGradient(cx-base*.16,cy-base*.2,0,cx-base*.16,cy-base*.2,base*.5);
    hi.addColorStop(0,"rgba(255,255,255,.72)");hi.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=hi;ctx.beginPath();ctx.arc(cx,cy,base*.5,0,7);ctx.fill();
    const sh=ctx.createRadialGradient(cx+base*.2,cy+base*.24,0,cx+base*.2,cy+base*.24,base*.46);
    sh.addColorStop(0,"rgba(10,20,50,.30)");sh.addColorStop(1,"rgba(10,20,50,0)");
    ctx.fillStyle=sh;ctx.beginPath();ctx.arc(cx,cy,base*.5,0,7);ctx.fill();}
  function loop(){t+=.016;draw();requestAnimationFrame(loop);}
  if(!reduce)loop();else{t=1;draw();}
  return{gesture(kind){cv.classList.remove("nod","shake");void cv.offsetWidth;cv.classList.add(kind);
    mood=kind;clearTimeout(moodT);moodT=setTimeout(()=>{mood="idle";if(reduce)draw();},900);if(reduce)draw();}};
})();

/* ---------------- api ---------------- */
async function api(path,opts){
  const res=await fetch(path,{headers:{"content-type":"application/json"},...opts});
  if(res.status===401){window.location="/login.html";throw new Error("login required");}
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);
  return data;
}

/* ---------------- state ---------------- */
const S={feed:null,deck:[],topSince:Date.now(),coached:false,briefReadStart:0,undoGrace:5000};
let editing=null;

/* ---------------- toasts ---------------- */
function toast(kind,msg,sub,opts={}){
  const t=document.createElement("div");t.className=`tst ${kind}`;
  t.innerHTML=`<div class="i">${kind==="yes"?'<div class="spin"></div>':kind==="err"?"✕":"✦"}</div>
    <div class="x"><div class="m">${esc(msg)}</div>${sub?`<div class="s">${esc(sub)}</div>`:""}</div>
    ${opts.undo?'<button class="undo">Undo</button>':""}${opts.undo?'<div class="bar"></div>':""}`;
  $("#toast").appendChild(t);
  let killed=false;
  const kill=()=>{if(!killed){killed=true;t.remove();}};
  const ttl=opts.ttl||(opts.undo?S.undoGrace:2600);
  let timer=setTimeout(kill,ttl);
  // A toast hosting an input must be able to outlive its clock while someone types.
  const bump=ms=>{clearTimeout(timer);timer=setTimeout(kill,ms);};
  if(opts.undo){
    const bar=t.querySelector(".bar");
    requestAnimationFrame(()=>{bar.style.transition=`transform ${ttl}ms linear`;bar.style.transform="scaleX(0)";});
    t.querySelector(".undo").addEventListener("click",async()=>{clearTimeout(timer);kill();opts.undo();});
  }
  // opts.chips(container, {kill,bump}) renders a second, full-width row inside the toast. The
  // caller owns the content; the toast owns the lifetime.
  if(opts.chips){
    t.classList.add("has-chips");
    const c=document.createElement("div");c.className="tchips";
    t.insertBefore(c,t.querySelector(".bar"));
    opts.chips(c,{kill,bump});
  }
  return{update(m2,s2,cls){t.querySelector(".m").textContent=m2;const se=t.querySelector(".s");if(se&&s2)se.textContent=s2;if(cls){t.className=`tst ${cls}${opts.chips?" has-chips":""}`;t.querySelector(".i").innerHTML=cls==="yes"?"✓":"✦";}},kill,bump};
}

/* ---------------- feed ---------------- */
// Monotonic guard: only the most recently STARTED load may write S.feed or paint. Loads already
// overlapped (60s interval + visibilitychange + the retry button), and the timezone re-render below
// makes it routine on first launch. Without this, a slow earlier response can land after a newer
// one and overwrite good state with stale state, which is precisely the bug the re-render exists
// to fix.
let feedSeq=0;
async function loadFeed(){
  const seq=++feedSeq;
  try{
    const feed=await api("/api/v1/feed");
    if(seq!==feedSeq)return;
    S.feed=feed;S.undoGrace=feed.undo_grace_ms||5000;
    const ids=new Set(S.deck.map(c=>c.id));
    const serverIds=new Set(feed.cards.map(c=>c.id));
    S.deck=[...S.deck.filter(c=>serverIds.has(c.id)),...feed.cards.filter(c=>!ids.has(c.id))];
    renderToday();renderRibbon(true);
    // After the normal render, never instead of it: an onboarding user still needs Today built
    // underneath so that finishing drops them straight into a working screen.
    applyOnboarding();
  }catch(e){
    if(seq!==feedSeq)return; // a newer load is in flight; do not blank a screen it may be about to fill
    renderRibbon(false,String(e.message||e));
    // Previously renderToday() was only called on the success path, so a failed feed left #vToday
    // as the empty <main> from the static HTML: a black screen that reads as a hard crash, with
    // the real reason in a 9.5px faint span in the ribbon. Show it, and offer a way back.
    const v=$("#vToday");
    if(v&&!v.dataset.errShown){
      v.dataset.errShown="1";
      v.innerHTML=`<div class="say"><div class="eyeb">Can't reach Haii</div>
        <h1 id="hiSay">Your data is safe, this screen just could not load.</h1>
        <p class="sum" style="opacity:.7;margin-top:8px">${esc(String(e.message||e))}</p>
        <button class="btn-gold" id="feedRetry" style="margin-top:14px">Try again</button></div>`;
      const rb=$("#feedRetry");if(rb)rb.addEventListener("click",()=>{delete v.dataset.errShown;loadFeed();});
    }
  }
}

    const s=await api("/api/v1/settings");

}
function renderRibbon(ok,err){

  $("#ribState").textContent=ok?"Haii is on":"Can't reach the server";

  if(err)$("#ribSignals").textContent=err.slice(0,40);
  // The greeting lives in the header now, not in the feed body, so it is set here rather than
  // rebuilt on every Today render. Falls back to the app name until the feed names the user.
  const g=$("#hdrGreet");

/** Dead-letter banner: things that failed while nobody was watching. Haii's core loop is cron
 *  driven, so before this a failed extraction or a rate limit produced pure silence, the user
 *  simply got no card and never learned a meeting was skipped. */
function failureBanner(){
  const f=S.feed;const fx=f&&f.failures;
  if(!fx||!fx.total)return"";
  const KIND={job:"Haii could not finish this",execution:"This action did not go through",rate_limit:"Haii was rate limited"};
  // title||detail meant the reason was unreachable: an execution failure always carries a title,
  // so the banner said "this action did not go through" and never why. The server has always sent
  // detail; only the template dropped it.
  const rows=(fx.items||[]).map(i=>`<div class="fxrow"><div class="fxk">${esc(KIND[i.kind]||i.kind)}</div>`
    +`<div class="fxv">${esc(i.title||"")}</div>`
    +(i.detail?`<div class="fxd">${esc(i.detail)}</div>`:"")+`</div>`).join("");
  const more=fx.total>(fx.items||[]).length?`<div class="sc-note">and ${fx.total-(fx.items||[]).length} more</div>`:"";
  return`<div class="row-lbl"><span class="t" style="color:var(--shake)">Needs your attention</span><span class="c">${fx.total}</span></div>
    <div class="brief-card" style="border-color:rgba(192,51,44,.32)">
      <div class="pl">${rows}</div>${more}
      <div class="bc-go"><button class="btn2 ghost" id="fxSeen">Got it, dismiss</button></div>
    </div>`;
}
/** A stale or broken connector used to be invisible from Today: status flipped to needs_reauth,
 *  pollers silently returned "not connected", and the headline still said "I'm watching N
 *  signals across your streams" while the streams decayed. */
function healthBanner(){
  const f=S.feed;if(!f||!f.connections)return"";
  const bad=f.connections.filter(c=>c.status==="needs_reauth"||c.status==="error");
  if(!bad.length)return"";
  const names=bad.map(c=>CONN_NAME[c.id]||c.id).join(", ");
  return`<div class="row-lbl"><span class="t" style="color:var(--warn)">Needs attention</span></div>
    <div class="brief-card" style="border-color:rgba(138,90,0,.3)">
      <div class="bc-top"><div><div class="bc-when">connector</div>
      <h2 style="font-size:18px">${esc(names)} stopped syncing</h2></div></div>
      <div class="bc-att">Haii is not seeing new activity from ${bad.length===1?"this stream":"these streams"}, so briefs and cards will be thin until it is reconnected.</div>
      <div class="bc-go"><button class="btn-gold" id="hbFix">Open Setup to reconnect</button></div>
    </div>`;
}
function say(){
  const f=S.feed;if(!f)return"Waking up…";
  const n=S.deck.length;
  const conn=f.connections.filter(c=>c.status==="connected").length;
  // A paste-only user has nothing connected and may still have decided every card, so "nothing is
  // connected" is only the headline while no real card has ever arrived.
  if(!conn&&!n)return f.has_real_cards?`Nothing needs your nod right now.`:`Nothing is connected yet. Open <b>Setup</b> and paste a meeting, or connect a tool.`;
  if(!n)return`I'm watching ${f.signals_24h} signals across your streams. Nothing needs your nod right now.`;
  return`<b>${n}</b> thing${n===1?" needs":"s need"} your nod.`;
}

/* The left-swipe panel lives inside this view's innerHTML while loadFeed re-renders every 60s, so

   nothing, a lost decision costs trust. */

        <span class="dt">${t}</span><span class="dtitle">${esc(m.title)}</span>

         matches the failure counter and the Your day counter. NO BACKTICKS IN THIS COMMENT, it

    <div class="row-lbl"><span class="t">Needs your nod</span><span class="c" id="nodC">${n}</span></div>
    <div id="deckWrap"><div id="deck"></div>
      <!-- Replaces the "← shake · nod →" legend. Static text teaches nothing; this one narrates
           the gesture under your thumb and names the threshold as you cross it. -->
      <div class="dhint" id="dhint">Drag right to approve, left to let it go</div>
      <!-- The torn stub: the left-swipe decision. The shield locks the whole deck; the stub sits
           where the flown card's action row was. Siblings of #deck on purpose: renderDeck rebuilds

      <div id="lshield" hidden></div>
      <section id="stub" role="group" aria-label="Decide the swiped card" tabindex="-1" hidden>
        <div class="st-rule" id="stRule"></div>

      <div class="rows">${digestRows.map(r=>`<div class="dr"><span class="dot"></span><div>${esc(r.text).replace(/&lt;(\/?)b&gt;/gi,"<$1b>")}</div></div>`).join("")}</div>
    </div>`:""}`;
  const fxSeen=$("#fxSeen");

  });
  v.querySelectorAll(".daychip").forEach(ch=>{
    ch.addEventListener("click",async()=>{

        if(r.briefing_id){ch.dataset.bid=r.briefing_id;lbl.textContent="✦ brief";openBriefById(r.briefing_id,title);}
        else{lbl.textContent=old;toast("err","Brief failed",r.detail||"try again");}

      finally{ch.disabled=false;}

  });
  const strip=v.querySelector(".daystrip");
  if(strip){
    strip.addEventListener("wheel",e=>{
      if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();strip.scrollLeft+=e.deltaY;}
    },{passive:false});
    let dragX=null,dragL=0,dragged=false;
    strip.addEventListener("pointerdown",e=>{dragX=e.clientX;dragL=strip.scrollLeft;dragged=false;});
    strip.addEventListener("pointermove",e=>{

      strip.scrollLeft=dragL-dx;
    });
    const endDrag=()=>{dragX=null;};
    strip.addEventListener("pointerup",endDrag);

    strip.addEventListener("click",e=>{if(dragged){e.stopPropagation();e.preventDefault();dragged=false;}},true);
  }

}
function greet(){const h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening";}

/* ---------------- deck ---------------- */
// Card honesty: does a nod actually DO something in your tools, or just file it?
const MODE={
 execute:{tag:"EXECUTE",style:"background:rgba(14,143,124,.10);color:#0E8F7C"},
 capture:{tag:"CAPTURE",style:"background:rgba(16,24,40,.06);color:#5A6270"},
 // Restated 2026-08-04. It read "DRAFT · not sent" in the amber warning colour, which was correct
 // while an approved email card wrote a TO-DO about an email and nothing reached Gmail. It now
 // creates the real draft in the user's mailbox, and the product decision is that this counts as
 // executed: the artifact was created in a system outside Haii, so the work is done rather than
 // remembered.
 //
 // Amber was then saying "something fell short" about the one outcome that had just succeeded, on a
 // palette the design system reserves for states to RECOVER from. It keeps its own mode rather than
 // becoming plain EXECUTE, because a human still presses send and calling it executed with no
 // qualifier would over-promise; actionLine says "ready for you to send" directly underneath.
 draft:{tag:"DRAFT IN GMAIL",style:"background:rgba(14,143,124,.10);color:#0E8F7C"},
 // Same shape and the same palette as `draft`, for the same reason. A handed-off text counts as an
 // execution, so this is not CAPTURE, and it keeps its own tag rather than
 // becoming plain EXECUTE because a human still presses send. The tag names the surface the user is
 // about to be looking at, which is what makes the jump to another app feel intended.
 handoff:{tag:"OPENS IN MESSAGES",style:"background:rgba(14,143,124,.10);color:#0E8F7C"}
};
// MUST agree with LEAVES_HAII in lib/metrics.ts. It is the same question asked twice, once for the
// tag on the card and once for the north star, and the two disagreeing means the card lies to the
// user about what their nod will do. All four types added 2026-08-09 execute: they create a real
// artifact in Drive, a CRM or a tracker.
const CARD_MODE={send_email:"draft",create_calendar_event:"execute",create_todo:"capture",send_slack_message:"execute",create_jira_issue:"execute",create_document:"execute",share_file:"execute",create_crm_note:"execute",create_task:"execute",send_text:"handoff"};
function modeOf(c){return MODE[CARD_MODE[c.actionType]]||MODE.capture;}
// The approve toast's opening line, one plain verb per type. It used to be built from the type
// label ("Executing email…"), which for an email implied sending. create_todo and send_text have
// their own lines in decide() and never read this.
const DOING={send_email:"Drafting in Gmail…",create_calendar_event:"Booking it…",send_slack_message:"Posting to Slack…",create_jira_issue:"Filing in Jira…",create_document:"Writing the document…",share_file:"Sharing the file…",create_crm_note:"Logging the note…",create_task:"Filing the task…"};

    if(dx>0){gY.style.opacity=prog;gN.style.opacity=0;vY.style.opacity=prog;vN.style.opacity=0;}
    else{gN.style.opacity=prog;gY.style.opacity=0;vN.style.opacity=prog;vY.style.opacity=0;}

   *  says what the axes mean but never tells you whether you have pulled far enough. */
  const HINT_REST="Drag right to approve, left to let it go";

    // distance as well as speed, otherwise a fast 15px twitch of the thumb sends the card. An
    // accidental approve is far worse than an extra spring-back, so speed alone is not enough.
    const far=Math.abs(dx)>=cardW*COMMIT;

/* `via` is threaded through rather than inferred, because by the time a card is flying off the

   its place. */
function flyOut(el,card,dir,vx,via){
  const w=el.offsetWidth||380;

  // .press is declared after .fly, so an equal-specificity tie would hand the transition back to
  // the 130ms press curve and cut the throw short.

  // cause and effect read as one motion.

function program(dir,via){

  const card=S.deck[0];if(!card)return;
  const el=$("#deck .card");if(!el)return;
  el.querySelector(dir>0?".a-yes":".a-no").style.opacity=1;

  // yet, and a stamp that "never earned its ink" promised an outcome.
  if(dir>0)el.querySelector(".verdict.yes").style.opacity=1;

/* The `sms:` URL, built in ONE place because the server cannot build it: this string has to be
   followed inside the swipe's own gesture, and the executor runs UNDO_GRACE_MS later when the
   gesture is long gone and iOS will not follow an external scheme.

   THE SEPARATOR IS THE PROVEN ONE IN EACH CASE, not a uniform one, and that asymmetry is on
   purpose. Three forms were tested on a real iPhone on 2026-08-12 and all three opened Messages
   with the body filled: `sms:NUM&body=`, `sms:NUM?body=`, and `sms:&body=` with no number at all.
   The fourth combination, `sms:?body=` with no number, was NEVER tested. Since the no-number path
   is the DEFAULT here, picking the prettier uniform shape would have made the commonest case the
   only unproven one. So: `?` when there is a number, `&` when there is not, both verified.

   An EMPTY number is deliberate and valid. Messages opens with the To field blank and the message
   written, and the user picks the person from their own contacts. That is what lets Haii never hold
   a phone number and never text the wrong person.

   Android is unverified on every form. `?body=` is its documented shape. */
function smsUrl(p){
  const to=String((p&&p.to)||"").replace(/[^\d+]/g,"");
  const body=encodeURIComponent(String((p&&p.body)||""));
  if(!body)return`sms:${to}`;
  return`sms:${to}${to?"?":"&"}body=${body}`;
}
/* Hand the message to Messages. The clipboard write is not a nicety: on a desktop, or anywhere with
   no handler for the scheme, the anchor click does nothing AND CANNOT REPORT THAT IT DID NOTHING.
   Copying first means the swipe always produced the thing, which is the invariant, rather than
   producing silence on half the surfaces the app runs on. */
function openText(p){
  try{if(navigator.clipboard)navigator.clipboard.writeText(String((p&&p.body)||""));}catch(e){}
  try{
    const a=document.createElement("a");a.href=smsUrl(p);a.style.display="none";
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){}
}
async function decide(card,decision,edit,via,why){

     external URL scheme to be followed from inside a user gesture; the first `await` below ends
     that gesture, so opening Messages after the decision returns would silently do nothing.
     If the decision request then fails, the card comes back to the deck and the user is holding a
     compose window they can discard, which is the right way round: Messages IS the undo here. */
  const approving=decision!=="snoozed"&&decision!=="dismissed";
  if(approving&&card.actionType==="send_text")openText(edit&&edit.payload?edit.payload:(card.payload||{}));
  const latency=Math.max(150,Date.now()-S.topSince);
  S.deck=S.deck.filter(c=>c.id!==card.id);
  renderDeck(true);renderCounts();
  try{
    const body={decision,latency_ms:latency,via:via||"unknown"};
    if(edit){body.decision="edited";body.edited_payload=edit.payload;body.edit_diff=edit.diff;}
    const res=await api(`/api/v1/cards/${card.id}/decision`,{method:"POST",body:JSON.stringify(body)});
    if(decision==="snoozed"){
      // Say WHEN. A promise to bring something back is only reassuring if it names the time.
      // No clock time, on purpose: the return instant is fixed in the zone
      // where the card was deferred, so "8:00" becomes a lie the moment the user flies. The day
      // word stays dynamic because deferring before 08:00 brings it back the SAME morning, and
      // "tomorrow" would then be wrong in the other direction.
      const when=(()=>{ if(!res||!res.returns_at)return"soon";

      // Undo on a deferral too, since 2026-08-02. Every other decision the panel can produce offers
      // it, and a deferred card is the one that leaves NO trace on any screen: not in the deck, and
      // History excludes snoozed by design. Without this, tapping Later by mistake was unrecoverable
      // until the card woke up on its own. The exhausted branch keeps no undo: that card is expired,
      // not deferred, and the endpoint refuses it on purpose.
      if(res&&res.exhausted)toast("info","Kept in History.","you have put this off three times");
      else toast("info",`Back in your deck ${when}.`,null,{undo:()=>undo(card),ttl:S.undoGrace});
    }else if(decision==="dismissed"){
      // The reason was answered before the card was dismissed, so this toast confirms and offers
      // undo, with nothing to fill in. Filing the reason has to come after the dismissal lands:
      // the endpoint 409s unless the card is already dismissed.
      if(why){
        // S.undoGrace, never a literal: it mirrors the server's UNDO_GRACE_MS, and a toast that
        // offers Undo for longer than the server honours it is offering something that fails. This
        // was 7000, inherited from the old chip row which needed the extra time to be tapped.
        toast("no",why.copy.title,why.copy.sub,{undo:()=>undo(card),ttl:S.undoGrace});
        sendWhy(card.id,why.reason,why.note);

      }

      // A to-do is not "executed" anywhere; it becomes a follow-up. Saying "Executing to-do…" for
      // a note to yourself overstated what happened, which is the same overstatement that lets a
      // create_todo count as a kept commitment in the stats.
      const capture=card.actionType==="create_todo";
      // A text has already happened by the time this runs: Messages was opened above, before the
      // await. "Executing text…" would describe something still to come, and "undo within 5s" would
      // offer to undo a compose window this app cannot reach into. Say what is true instead.
      const handed=card.actionType==="send_text";

async function undo(card){

/* ---------------- the negative path: the fork, then the reason ----------------
   The card flew out; its decision stayed on the table. Nothing is sent until the user answers, and
   "Keep it in the deck" on both faces puts the card back with nothing recorded.

   There is no idle timer any more. The old one auto-resolved to Later after 12 seconds and stamped
   it `via:"timeout"`, which decided for a user who was still reading. Every face now carries an
   explicit way out, so a silent decision is not needed to guarantee the deck unblocks. */
let leftPending=null;

/* Reason keys are the SERVER's vocabulary, not labels: routes.ts validates them, jobs/extract.ts
   renders them into the prompt as corrections, and lib/distill.ts turns repeats into durable
   memory. `not_mine` is deliberately the key that already exists rather than a new one, because it
   means exactly what it always meant and every card already filed under it stays in one bucket. */
const REASONS=[
  {key:"not_committed",label:"Nobody committed to this",
   title:"Gone. Nothing was promised.",sub:"I'll be stricter about what counts as a commitment."},
  {key:"not_mine",label:"That was someone else's",
   title:"Gone. That one wasn't yours.",sub:"I'll listen for who is speaking, not just what is said."},
  {key:"already_done",label:"I've already handled it",
   title:"Gone. You were ahead of me.",sub:"I'll check what you have already done first."},
  {key:"too_small",label:"Not worth an action",
   title:"Gone. Noted as too small.",sub:"I'll leave the small stuff alone."}
];
const ICON_CLOCK='<svg class="oi" viewBox="0 0 19 19" aria-hidden="true"><circle cx="9.5" cy="9.5" r="7.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 5.6v4l2.7 1.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const ICON_NEVER='<svg class="oi" viewBox="0 0 19 19" aria-hidden="true"><circle cx="9.5" cy="9.5" r="7.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 4.5l10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const CANCEL_BTN='<button class="st-cancel" type="button">Keep it in the deck</button>';

function askLeft(card,via){
  const stub=$("#stub"),shield=$("#lshield");
  if(!stub||!shield){decide(card,"dismissed",null,via);return;} // markup missing: never lose the decision
  leftPending={card,via};
  shield.hidden=false;
  $("#deck").classList.add("asleep");
  const t=TYPES[card.actionType]||{};
  $("#stRule").style.background=t.color||"var(--hair)";
  $("#stT").textContent=card.title||"";
  const dh=$("#dhint");if(dh)dh.textContent="Choose one to continue";
  stub.hidden=false;stub.classList.remove("out");stub.classList.add("in");

}
function stRender(q,laneHtml,wire){
  if(q!==null)$("#stQ").textContent=q;
  const L=$("#stLane");L.innerHTML=laneHtml;if(wire)wire(L);
}
/* Face one: is this timing, or is it wrong? Only the second branch asks a follow-up, so someone who
   just wants the card back tomorrow answers one question and is done. */
function stFork(){
  stRender("What should happen to it?",
    `<button class="st-opt later" type="button">${ICON_CLOCK}<span class="ot"><span class="ol">Bring it back later</span><span class="os">Nothing wrong, just not now</span></span></button>
     <button class="st-opt never" type="button">${ICON_NEVER}<span class="ot"><span class="ol">Don't propose this again</span><span class="os">I'll ask one quick question</span></span></button>
     ${CANCEL_BTN}`,
    L=>{
      L.querySelector(".later").onclick=()=>resolveLeft("snoozed");
      L.querySelector(".never").onclick=stReason;
      L.querySelector(".st-cancel").onclick=keepLeft;

}
/* Face two. The keys ARE the data: each one is a different correction and extract.ts renders them
   into the prompt as different instructions, so "wrong" and "not mine" pull opposite ways. Free
   text carries `other` plus the note and never borrows a key, which is the bug the old toast had:
   it filed every note as `wrong` no matter what the note said. */
function stReason(){
  stRender("What was wrong with it?",
    REASONS.map((r,i)=>`<button class="st-rsn" type="button" data-i="${i}">${r.label}</button>`).join("")+
    `<label class="st-note"><input type="text" maxlength="500" placeholder="Or say it in your own words">
      <button class="go" type="button" aria-label="Save"><svg width="15" height="13" viewBox="0 0 15 13" aria-hidden="true"><path d="M1 6.5h12M8.4 2l4.6 4.5-4.6 4.5" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button></label>`+
    CANCEL_BTN,

/* Shared by both exits. Only closes the panel; who owns the card is the caller's business. */

/* ---------------- briefing ---------------- */
function briefBodyHtml(title,b,model,pv,writtenAt){
  // A pre-generated brief (4am batch) can be many hours old by the time it is read. Show the age
  // when it is material so staleness is visible rather than implied.
  let age="";
  if(writtenAt){
    const mins=Math.round((Date.now()-new Date(writtenAt).getTime())/60000);
    if(mins>=90)age=`<p class="sum" style="opacity:.6;font-size:11px;margin:-4px 0 10px">Written ${mins>=120?Math.round(mins/60)+" hours":mins+" minutes"} ago${b.tldr?", anything newer is not in here":""}.</p>`;
  }

  // player shows while it is speaking). The reading order IS the DOM order, so what is spoken can
  // never drift from what is on the page. The title, the age line and the feedback block are
  // deliberately not read: none of them is the brief.
  let n=0;
  const vu=(sec,text)=>`<span class="vu" data-u="${n++}" data-sec="${esc(sec)}">${esc(text)}</span>`;
  // The one thing is the only multi-sentence blob in a brief. Split it: read as a single unit it
  // would hold the highlight over a whole paragraph and scroll nowhere for twenty seconds.
  const sentences=s=>(String(s??"").match(/[^.!?]+[.!?]*\s*/g)||[]).filter(x=>x.trim());
  return `
    <h2 class="btitle">${esc(title)}</h2>
    ${age}
    <p class="tldr"><span class="lead">✦ the one thing</span>${sentences(b.tldr).map(s=>vu("The one thing",s)).join("")}</p>
    ${(b.sections||[]).map(s=>`<div class="bsec"><h4>${vu(s.h,s.h)}</h4><ul>${(s.items||[]).map(i=>`<li>${vu(s.h,i)}</li>`).join("")}</ul></div>`).join("")}
    ${(b.last_met&&b.last_met.length)?`<div class="lm"><div class="h">Last time you met</div>
      <ul>${b.last_met.map(i=>`<li><span class="st ${i.st==="done"?"done":"open"}">${i.st==="done"?"done":"open"}</span>${vu("Last time you met",i.t)}</li>`).join("")}</ul></div>`:""}
    ${(b.open_threads&&b.open_threads.length)?`<div class="bsec"><h4>${vu("Open threads","Open threads")}</h4><ul>${b.open_threads.map(i=>`<li>${vu("Open threads",i)}</li>`).join("")}</ul></div>`:""}
    <div class="rate" id="rateRow"><p>Was this brief useful?</p>
      <div class="b"><button id="rUp" aria-label="Useful">👍</button><button id="rDn" aria-label="Not useful">👎</button></div>
      <div class="why" id="rWhy" hidden>
        <button class="rwhy" data-r="too_long">Too long</button>
        <button class="rwhy" data-r="wrong_people">Wrong people</button>
        <button class="rwhy" data-r="missed_the_point">Led with the wrong thing</button>
      </div>
      <div class="note" id="rNote">
        <button class="nlink" id="rNoteOpen">Something missing? Tell Haii</button>
        <div class="nbox" id="rNoteBox" hidden>
          <textarea id="rNoteText" rows="2" placeholder="What did it miss, or what would have helped?"></textarea>
          <button class="fbtn nsave" id="rNoteSave">Save note</button>
        </div>
      </div></div>
    ${""/* The model name, prompt version and "grounded in your live streams" line lived here and
          were removed 2026-08-01. It was build plumbing shown to the reader: nobody opening a brief
          ten minutes before a call needs to know which model wrote it, and the tagline asserted
          trustworthiness rather than demonstrating it. None of it is lost, promptVersion and model
          are stamped on every briefings row, which is where a "why did it write that" investigation
          actually resolves them. */}`;
}

/* ---------------- the brief, read aloud ----------------
 *  Browser speech. No vendor, no API key, no marginal cost, and the spoken text IS the text on the
 *  page, walked in DOM order through [data-u]. That is the whole design: a separately generated
 *  spoken script would be a second source of truth for what the brief says, and the two would
 *  drift within a week.
 *
 *  Two limits are structural, not bugs to fix later. Browser speech STOPS when the phone locks or
 *  the app goes to the background, so there is a `locked` state that says so out loud. And it
 *  cannot SEEK, so the strip is a progress readout and must never look draggable.
 *
 *  There is no simulated-playback mode. Shipping one would mean a silent highlight walking the
 *  page while the phone makes no sound, which is the app pretending to talk. If nothing will
 *  speak, say so.
 */
const V={mode:"idle",units:[],idx:0,token:0,bars:[],probe:0,gap:0,voice:null};

/** Rate, and a beat between utterances. BOTH PARKED AT THEIR NO-OP VALUES, 2026-08-03.
 *
 *  They shipped together and iPhone Safari got WORSE than it had been before, while desktop
 *  Chrome got better. Three things reached the phone in that change: these two, and the voice
 *  pick. Only the voice pick has any evidence behind it and that evidence
 *  is desktop-only, so these two go back to no-ops and the phone is left with exactly one
 *  difference to judge.
 *
 *  Both are plausible iOS-specific culprits, which is why neither is defended. A rate below 1.0
 *  time-stretches Apple's concatenative on-device voices, where Google's neural ones on desktop
 *  absorb it cleanly. And iOS is known to clip the opening of an utterance that begins after
 *  silence, which is precisely what a gap between seventeen short utterances creates.
 *
 *  The machinery is kept, not deleted, so restoring either is a one-line change once an iPhone has
 *  actually judged it. Do not raise either of these back off zero on reasoning alone. */
const V_RATE=1,V_BEAT=0,V_SECTION_BEAT=0;

/** Pick a voice instead of taking the system default, which on most platforms is the oldest and
 *  most robotic one installed. This is the single biggest change available to how it sounds and it
 *  costs nothing: no vendor, no key, no per-brief charge. Scored rather than a fixed list, because
 *  the installed set differs on every device and a name that exists on one phone is absent on the
 *  next. The bad list is the novelty and legacy voices that sound like 1998. */
const V_GOOD=/natural|neural|online|google|samantha|karen|serena|moira|tessa|daniel|aria|jenny|libby/i;
/** Apple's three tiers, compact < enhanced < premium, and the only hard quality fact the platform
 *  exposes. Scored ABOVE a V_GOOD name match on purpose: a name list is a guess about which voices
 *  are decent, while a downloaded tier is megabytes of better audio. A premium Ava lost to a
 *  compact Samantha while these were equal, which is the wrong way round. */
const V_PREMIUM=/premium/i,V_ENHANCED=/enhanced/i;
/** `compact` WAS in this list and picking it apart is the whole lesson. On iOS it is not a quality
 *  marker, it is Apple's namespace for essentially every modern voice: Samantha is
 *  com.apple.voice.compact.en-US.Samantha. Penalising it demoted the good voices while the genuinely
 *  ancient ones sailed through, because they live in a DIFFERENT namespace,
 *  com.apple.speech.synthesis.voice.*, and are not called compact anything. A test iPhone picked
 *  Fred, from 1993, over the Samantha chosen in Settings, and the score was 0 to -1.
 *
 *  So the rule is the namespace, not the names. One pattern retires the entire legacy family, Fred
 *  and Albert and Zarvox and Bad News and the rest, instead of a list that is always one voice short.
 *  The names are kept as a fallback for platforms that do not expose a useful voiceURI. */
const V_LEGACY_APPLE=/com\.apple\.speech\.synthesis\.voice/i;
const V_BAD=/espeak|\bfred\b|albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|hysterical|jester|superstar|trinoids|whisper|wobble|zarvox|grandma|grandpa|rocko|shelley|\b(sandy|eddy|flo|reed|organ)\b/i;
function vPickVoice(){
  const sp=vEngine();if(!sp)return null;
  let list=[];
  try{list=sp.getVoices()||[];}catch(e){return null;}
  if(!list.length)return null;
  // AMERICAN ENGLISH, always. The product supports no other language, so the voice is a constant,
  // not a preference to be read off the device.
  //
  // NOT navigator.language, which is the phone's UI and has nothing to do with what the brief is
  // written in. A Turkish-locale Chrome reports `tr` with Microsoft Tolga, Turkish, as its only voice, and
  // the first version of this function dutifully picked it to read an English brief. On any
  // Turkish-locale phone that also had English installed it would have chosen wrong every time.
  //
  // Any other English accent is the fallback, because a British voice reading American copy is a
  // far smaller problem than a Turkish engine doing it.
  const us=list.filter(v=>/^en[-_]us/i.test(String(v.lang||"")));
  const pool=us.length?us:list.filter(v=>/^en/i.test(String(v.lang||"")));
  // No English voice on the device at all. Choose nothing: the engine's own default still reads the
  // text, badly, which is exactly where this was before any of it.
  if(!pool.length)return null;
  const score=v=>{
    const n=`${v.name||""} ${v.voiceURI||""}`;
    let s=0;
    if(V_GOOD.test(n))s+=3;
    if(V_PREMIUM.test(n))s+=5;else if(V_ENHANCED.test(n))s+=3;
    if(V_BAD.test(n)||V_LEGACY_APPLE.test(n))s-=4;
    // A remote voice is usually the better-sounding one and a brief is short enough that the round
    // trip is not felt. A tiebreak, never a requirement: an offline phone must still read.
    if(v.localService===false)s+=1;
    return s;
  };
  const best=pool.slice().sort((a,b)=>score(b)-score(a))[0]||null;
  // THE DEVICE'S OWN VOICE IS THE BASELINE, and beating it needs a POSITIVE reason, not merely a
  // less negative one. `default` is what its owner chose in Settings, so it is the best evidence
  // of quality on a platform that gives us no tier field at all.
  //
  // "Strictly better score" was the first version of this rule and it was not enough: an UNKNOWN
  // voice scores 0, a known-good one that tripped a bad pattern scored -1, and 0 > -1 handed the
  // iPhone to Fred. Scoring zero means we recognised nothing about a voice, and that is never
  // grounds for overruling a deliberate choice.
  const def=pool.find(v=>v.default);
  if(def&&(!best||!(score(best)>0&&score(best)>score(def))))return def;
  return best;
}
const V_META={
  idle:"One minute, read aloud. The words follow along.",
  paused:"Paused. I will pick up at this sentence.",
  locked:"Playback stopped when you left. Play picks up here.",
  done:"That was all of it. Play it again if you like."
};
const V_PLAY='<svg width="16" height="18" viewBox="0 0 17 19" aria-hidden="true"><path d="M4 2.4 14.6 9.5 4 16.6z" fill="currentColor"/></svg>';
const V_PAUSE='<svg width="14" height="16" viewBox="0 0 15 17" aria-hidden="true"><rect x="2" y="1.6" width="4" height="13.8" rx="1.7" fill="currentColor"/><rect x="9" y="1.6" width="4" height="13.8" rx="1.7" fill="currentColor"/></svg>';

/** The engine, or null. Absent on older Android WebViews and some locked-down builds. That is a
 *  supported state, not a failure: the brief is still entirely readable. */
function vEngine(){
  try{
    return (window.speechSynthesis&&typeof window.SpeechSynthesisUtterance==="function")?window.speechSynthesis:null;
  }catch(e){return null;}
}

/** Cancel everything in flight. The token is what makes it safe: an onend the browser has already
 *  queued still fires, and without the check it would advance a read the user just stopped. */
function vStop(){
  V.token++;
  clearTimeout(V.probe);
  clearTimeout(V.gap);
  const sp=vEngine();
  if(sp){try{sp.cancel();}catch(e){}}
}

/** No engine at all, or an engine that accepted an utterance and made no sound. From the reader's
 *  side those are the same fact, so they get the same sentence and the same amber note. */
function vNoVoice(){
  vStop();
  V.mode="none";
  document.querySelectorAll(".vu.on").forEach(el=>el.classList.remove("on"));
  const p=$("#vPlay"),nv=$("#vNone");
  if(p)p.hidden=true;
  if(nv)nv.hidden=V.units.length===0;
}

/** Called every time a brief opens, including the same brief twice. Rebuilds the unit list from
 *  the DOM that was just written, so it is impossible for the two to disagree. */
function vReset(){
  vStop();
  V.mode="idle";V.idx=0;
  const body=$("#brBody");
  V.units=body?Array.from(body.querySelectorAll("[data-u]"))
    .map(el=>({el,text:(el.textContent||"").trim(),sec:el.dataset.sec||""}))
    .filter(u=>u.text):[];
  document.querySelectorAll(".vu.on").forEach(el=>el.classList.remove("on"));
  V.voice=vPickVoice();
  const engine=!!vEngine(),any=V.units.length>0;
  $("#vPlay").hidden=!(engine&&any);
  $("#vNone").hidden=!(!engine&&any);
  if(engine&&any)vBuildWave();
  vPaint();
}

/** 58 bars, mapped onto the units by cumulative WORD count rather than by unit, so the fill tracks
 *  how much has been read: a two-word heading and a thirty-word paragraph must not advance it
 *  equally. Heights are deterministic, so the strip does not reshuffle every time a brief opens. */
function vBuildWave(){
  const N=58,words=u=>u.text.split(/\s+/).length;
  const total=V.units.reduce((n,u)=>n+words(u),0)||1;
  let acc=0;
  const marks=V.units.map(u=>{acc+=words(u);return acc/total;});
  V.bars=[];
  const frag=document.createDocumentFragment();
  for(let i=0;i<N;i++){
    const f=(i+.5)/N;
    let ui=marks.findIndex(m=>f<=m);
    if(ui<0)ui=V.units.length-1;
    const h=8+((i*37)%11)+((i*13)%8);
    V.bars.push({ui,h});
    const bar=document.createElement("i");
    bar.style.height=h+"px";
    frag.appendChild(bar);
  }
  const wave=$("#vWave");
  wave.innerHTML="";
  wave.appendChild(frag);
}

/** ONE function owns every visible piece of player state: the icon, the accessible name, the meta
 *  line, the restart button and the strip. Five states painted from five places is how they
 *  drift out of agreement with each other. */
function vPaint(){
  const btn=$("#vBtn"),meta=$("#vMeta"),wave=$("#vWave"),rst=$("#vRst");
  if(!btn||!meta||!wave||!rst)return;
  const speaking=V.mode==="speaking";
  btn.innerHTML=speaking?V_PAUSE:V_PLAY;
  btn.setAttribute("aria-label",speaking?"Pause":(V.mode==="paused"||V.mode==="locked")?"Continue reading":"Play the brief");
  const active=V.units[V.idx];
  meta.textContent=speaking?(active?active.sec:""):(V_META[V.mode]||"");
  meta.classList.toggle("warn",V.mode==="locked");
  rst.hidden=V.mode!=="locked";
  // The last unit index the strip should show as read. -1 means nothing yet.
  const played=V.mode==="done"?V.units.length
    :(speaking||V.mode==="paused"||V.mode==="locked")?V.idx:-1;
  let head=-1;
  V.bars.forEach((b,i)=>{if(b.ui<=played)head=i;});
  Array.from(wave.children).forEach((el,i)=>{
    const b=V.bars[i];if(!b)return;
    const isHead=played>=0&&i===head;
    el.className=(b.ui<=played?"on":"")+(isHead&&speaking?" hd":"");
    // Height is written inline for every bar including the head, so no rule has to fight an
    // inline style with !important to make the head taller.
    el.style.height=(isHead?26:b.h)+"px";
  });
}

/** Speaks unit by unit rather than the whole brief in one utterance. Three reasons, all real: the
 *  highlight needs a per-sentence boundary to follow, several engines truncate a long utterance,
 *  and a stop then lands on a sentence rather than mid-paragraph. */
function vSpeakFrom(i){
  const sp=vEngine();
  if(!sp||!V.units.length)return vNoVoice();
  vStop();
  // Re-pick if opening the brief found nothing. iOS Safari can report an EMPTY voice list well
  // past first paint and does not reliably fire voiceschanged, so the voice chosen at open time is
  // null on exactly the platform that most needs one picked. By the time a thumb reaches play the
  // list is populated.
  if(!V.voice)V.voice=vPickVoice();
  V.idx=Math.max(0,Math.min(i,V.units.length-1));
  V.mode="speaking";
  // Paint before the beat below, never after: a tap that leaves the button reading Play for half a
  // second reads as a tap that did not land.
  vPaint();
  vStep();
}

function vStep(){
  const my=V.token,u=V.units[V.idx];
  if(!u||!vEngine())return vFinish();
  // The beat goes BEFORE the unit, where a reader would take one, and is longer when the section
  // changes. None at all before the first sentence, so pressing play is answered immediately.
  const prev=V.units[V.idx-1];
  const gap=!prev?0:(prev.sec!==u.sec?V_SECTION_BEAT:V_BEAT);
  clearTimeout(V.gap);
  if(!gap)return vSay(u,my);
  V.gap=setTimeout(()=>{if(my!==V.token)return;vSay(u,my);},gap);
}

function vSay(u,my){
  const sp=vEngine();
  if(!sp)return vNoVoice();
  vHighlight(u.el);
  vPaint();
  let ut;
  try{ut=new window.SpeechSynthesisUtterance(u.text);}catch(e){return vNoVoice();}
  ut.rate=V_RATE;ut.pitch=1;
  // Voice only. `ut.lang` was set alongside it and is now gone: with a voice assigned the language
  // is already decided, so it added nothing, and iOS has a history of re-resolving the voice when
  // lang is set explicitly. A redundant line that can only do harm is not worth keeping while an
  // iOS regression is unexplained.
  if(V.voice)ut.voice=V.voice;
  ut.onend=()=>{if(my!==V.token)return;V.idx++;vStep();};
  // An engine error mid-read is not fixed by retrying the same sentence, and walking the highlight
  // on regardless would be the app pretending to talk.
  ut.onerror=()=>{if(my!==V.token)return;vNoVoice();};
  try{sp.speak(ut);}catch(e){return vNoVoice();}
  // Some engines accept an utterance and never make a sound: no installed voice, an autoplay
  // policy, a backgrounded tab. NOTHING fires in that case, not even onerror, so probe for it.
  clearTimeout(V.probe);
  V.probe=setTimeout(()=>{
    if(my!==V.token||V.mode!=="speaking")return;
    if(!sp.speaking&&!sp.pending)vNoVoice();
  },1200);
}

function vFinish(){
  vStop();
  V.mode="done";V.idx=V.units.length;
  document.querySelectorAll(".vu.on").forEach(el=>el.classList.remove("on"));
  vPaint();
  const sc=$("#brBody");
  if(sc)sc.scrollTop=sc.scrollHeight;
}

/** Distance from the top of the scroller, summed up the offsetParent chain rather than read off
 *  the element. A single el.offsetTop is measured against the nearest POSITIONED ancestor, and
 *  `.bsec li` is position:relative because its bullet dot is absolute inside it. Every unit that
 *  lives in a list therefore reported an offsetTop of 2, the scroll target clamped to zero, and
 *  the page did not follow the voice at all for most of a brief. Found by watching it, not by
 *  reading it. .ovbody is position:relative so this loop always terminates there. */
function vTopWithin(el,sc){
  let top=0,n=el;
  while(n&&n!==sc){top+=n.offsetTop;n=n.offsetParent;}
  return n?top:el.offsetTop;
}

/** Follows the voice down the page. A direct scrollTop assignment, NOT a requestAnimationFrame
 *  tween: rAF does not fire in a hidden tab, so an rAF version cannot be tested there. The easing
 *  comes from scroll-behavior:smooth on .ovbody instead. When testing in a hidden tab, force
 *  scroll-behavior:auto, because smooth scrolling is also driven by frames and would move nothing. */
function vHighlight(el){
  document.querySelectorAll(".vu.on").forEach(e=>e.classList.remove("on"));
  if(!el)return;
  el.classList.add("on");
  const sc=$("#brBody");
  if(!sc)return;
  sc.scrollTop=Math.max(0,Math.min(vTopWithin(el,sc)-sc.clientHeight*.34,sc.scrollHeight-sc.clientHeight));
}

function vTap(){
  if(!vEngine())return vNoVoice();
  if(V.mode==="speaking"){
    // Pause is a full stop that remembers the sentence, deliberately NOT speechSynthesis.pause():
    // that call is unreliable across engines (iOS can talk straight through it, or never resume),
    // and a player reading "Paused" while the phone keeps talking is a lie. Units are sentences,
    // so the worst this costs is re-hearing one from its start, which is what the label promises.
    vStop();V.mode="paused";vPaint();return;
  }
  if(V.mode==="paused"||V.mode==="locked")return vSpeakFrom(V.idx);
  return vSpeakFrom(0);
}

/** There is no event for "the phone locked": visibility is the only signal, and the speech is
 *  already dead by the time it arrives. Say what happened rather than leaving a play button that
 *  looks like it is still going. */
function vOnHide(){
  if(V.mode!=="speaking"&&V.mode!=="paused")return;
  vStop();V.mode="locked";vPaint();
}

$("#vBtn").addEventListener("click",vTap);
$("#vRst").addEventListener("click",()=>vSpeakFrom(0));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")vOnHide();});
// speechSynthesis is global and outlives the DOM: without this it keeps reading a brief that is
// no longer on screen, and on a phone that means it follows you out of the app.
window.addEventListener("pagehide",vStop);
// Voices load asynchronously on Chrome and Android, so an engine that looks unusable at first
// paint can become usable a moment later. Only re-decide when nothing is playing.
try{
  if(window.speechSynthesis&&window.speechSynthesis.addEventListener){
    window.speechSynthesis.addEventListener("voiceschanged",()=>{
      if((V.mode==="idle"||V.mode==="none")&&$("#ovBrief").classList.contains("open"))vReset();
    });
  }
}catch(e){}

function showBrief(bid,title,sub,b,model,pv,rating,writtenAt,note){
  $("#brSub").textContent=sub;
  S.briefReadStart=Date.now();
  S.briefId=bid;
  $("#brBody").innerHTML=briefBodyHtml(title,b,model,pv,writtenAt);
  $("#rUp").addEventListener("click",()=>rate(bid,"up"));
  $("#rDn").addEventListener("click",()=>rate(bid,"down"));
  $("#rWhy").querySelectorAll(".rwhy").forEach(b2=>b2.addEventListener("click",()=>rate(bid,"down",b2.dataset.r)));
  wireNote(bid,note);
  if(rating)markRate(rating);
  // After the body exists, because the reading order is read out of the DOM that was just written.
  vReset();
  $("#ovBrief").classList.add("open");
}

/** The note affordance. Deliberately reachable whatever the rating: the case it exists for is a
 *  brief that was fine but missed something, where there is nothing to rate. An existing note
 *  reopens expanded and prefilled, so it reads as editable rather than as a second blank box. */
function wireNote(bid,existing){
  const open=$("#rNoteOpen"),box=$("#rNoteBox"),txt=$("#rNoteText"),save=$("#rNoteSave");
  if(!open||!box||!txt||!save)return;
  // Baseline for saveNoteOnClose below: only a textarea that has actually moved past this value
  // gets posted, so closing a brief no one typed into never fires a spurious save.
  S.noteSaved=existing||"";
  if(existing){txt.value=existing;box.hidden=false;open.textContent="Edit your note";}
  open.addEventListener("click",()=>{
    box.hidden=!box.hidden;
    if(!box.hidden)txt.focus();
  });
  save.addEventListener("click",async()=>{
    save.disabled=true;const was=save.textContent;save.textContent="Saving…";
    try{
      const r=await api(`/api/v1/briefings/${bid}/note`,{method:"POST",body:JSON.stringify({note:txt.value})});
      open.textContent=r.saved?"Edit your note":"Something missing? Tell Haii";
      box.hidden=true;
      toast("info",r.saved?"Note saved.":"Note cleared.");
      if(S.feed&&S.feed.next_meeting&&S.feed.next_meeting.briefing)S.feed.next_meeting.briefing.note=txt.value.trim()||null;
      S.noteSaved=txt.value;
    }catch(e){toast("err","Could not save the note",e.message);}
    finally{save.disabled=false;save.textContent=was;}
  });
}
function openBrief(){
  const m=S.feed&&S.feed.next_meeting;if(!m||!m.briefing)return;
  showBrief(m.briefing.id,m.title,
    `${m.title} · ${new Date(m.startsAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}`,
    m.briefing.content||{},m.briefing.model,m.briefing.prompt_version,m.briefing.rating,m.briefing.written_at,m.briefing.note);
}
async function openBriefById(bid,title){
  try{
    const row=await api(`/api/v1/briefings/${bid}`);
    showBrief(bid,title||"Briefing",title||"Briefing",row.contentJson||{},row.model,row.promptVersion,row.rating,row.createdAt,row.feedbackNote);
  }catch(e){toast("err","Couldn't load brief",e.message);}
}
function briefSecs(){return S.briefReadStart?Math.round((Date.now()-S.briefReadStart)/1000):0;}

/** Report how long the brief was on screen. This is the ONLY writer of read_seconds, and it fires
 *  whether or not the brief was ever rated: while rating was the only writer, the column measured
 *  "briefs rated" and the gauge built on it could not see a brief that was read and closed in
 *  silence. keepalive so the report survives the tab being backgrounded or closed. The server takes
 *  the max, so reporting twice for one reading session is harmless. */
function reportBriefRead(clear){
  const id=S.briefId,secs=briefSecs();
  if(clear){S.briefId=null;S.briefReadStart=0;}
  if(!id||secs<=0)return;
  try{
    fetch(`/api/v1/briefings/${id}/read`,{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({read_seconds:secs}),keepalive:true}).catch(()=>{});
  }catch(e){/* a lost measurement must never surface to the reader */}
}
/** Companion to reportBriefRead, fired at the same three exits: a typed note is real work, and the
 *  back arrow is the natural "I'm done" gesture, not a "throw it away" one. Compares against the
 *  last value this brief actually saved (the Save button or this function) so an untouched or
 *  already-saved textarea never fires a second, redundant POST. Same keepalive fetch shape as
 *  reportBriefRead, for the same reason: the tab may already be gone before this would resolve. */
function saveNoteOnClose(){
  const id=S.briefId,txt=$("#rNoteText");
  if(!id||!txt||txt.value===S.noteSaved)return;
  S.noteSaved=txt.value;
  try{
    fetch(`/api/v1/briefings/${id}/note`,{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({note:txt.value}),keepalive:true}).catch(()=>{});
  }catch(e){/* a lost note must never surface to the reader */}
}
async function rate(id,r,reason){
  // Every other async control here shows progress (Saving…, Retrying…, Working…); an emoji pair
  // and a row of short chips have no room for that, so disabling is the only signal available.
  // Without it a slow connection lets a second tap land before the first POST resolves, e.g.
  // "Too long" then "Wrong people" in the same window, and both rate the brief.
  const u=$("#rUp"),d=$("#rDn"),chips=$("#rWhy").querySelectorAll(".rwhy");
  u.disabled=true;d.disabled=true;chips.forEach(c=>c.disabled=true);
  try{
    const body={rating:r};if(reason)body.reason=reason;
    await api(`/api/v1/briefings/${id}/rating`,{method:"POST",body:JSON.stringify(body)});
    // A thumbs down asks why, in place, and deliberately does NOT toast at the same moment: two
    // things appearing at once means one of them is never seen. The toast waits for the chip.
    if(r==="down"&&!reason){markRate(r,true);return;}
    markRate(r);toast("info","Noted. Haii tunes the next brief.");
    if(S.feed&&S.feed.next_meeting&&S.feed.next_meeting.briefing)S.feed.next_meeting.briefing.rating=r;
  }catch(e){toast("err","Rating failed",e.message);}
  finally{u.disabled=false;d.disabled=false;chips.forEach(c=>c.disabled=false);}
}
function markRate(r,askWhy){
  const u=$("#rUp"),d=$("#rDn");if(u)u.className=r==="up"?"up":"";if(d)d.className=r==="down"?"dn":"";
  const w=$("#rWhy");if(w)w.hidden=!askWhy;
  const p=document.querySelector("#rateRow p");
  if(p)p.textContent=askWhy?"What was wrong with it?":"Feedback saved.";
}
// vStop deliberately leaves the highlight alone, because pausing has to keep it on the sentence it
// stopped at. Closing is the one exit that should take it with it.
$("#brBack").addEventListener("click",()=>{
  vStop();document.querySelectorAll(".vu.on").forEach(e=>e.classList.remove("on"));
  saveNoteOnClose();reportBriefRead(true);$("#ovBrief").classList.remove("open");
});
// Leaving the app counts as closing the brief: on a phone this is the common exit, and without it
// every read that ends by switching away would be recorded as no read at all. A typed note gets
// the same treatment: the back arrow, backgrounding, and pagehide are all "done", not "discard".
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){saveNoteOnClose();reportBriefRead(false);}});
window.addEventListener("pagehide",()=>{saveNoteOnClose();reportBriefRead(false);});

/* ---------------- countdown ---------------- */
function tickCountdown(){
  const m=S.feed&&S.feed.next_meeting;const cd=$("#cd"),l=$("#cdL"),w=$("#bcWhen");
  if(!m||!cd)return;
  const starts=new Date(m.startsAt);

  const left=(starts.getTime()-Date.now())/1000;
  if(left>0){

    cd.textContent=h>0?`${h}:${pad(mm)}:${pad(ss)}`:`${mm}:${pad(ss)}`;l.textContent="until start";
  }else{cd.textContent="LIVE";l.textContent="happening now";}

/* ---------------- history ---------------- */
const stCls=s=>s==="dismissed"?"no":s==="executed"?"ok":s==="failed"?"no":s==="expired"?"gray":"ed";
const stTxt=c=>{
  const ex=(c.feedback||{}).executed;
  // A to-do kept in Haii's own list is saved, not done: nothing happened outside Haii.
  if(c.status==="executed"){const kept=c.actionType==="create_todo"?"saved":"done";return ex?(ex.mode==="real"?kept:"not sent"):kept;}
  return c.status;
};
// A failure used to be terminal: the row sat here forever and the work was unrecoverable.
function histRow(c){
  const t=TYPES[c.actionType]||{};
  const ex=(c.feedback||{}).executed;
  const retry=c.status==="failed"?`<button class="hretry" data-retry="${esc(c.id)}">Retry</button>`:"";
  return`<div class="hr2" style="--tc:${t.color||"var(--gold)"}">
    <div class="hi2">${t.glyph||"•"}</div>
    <div class="hx"><div class="t">${esc(c.title)}</div>
    <div class="s">${new Date(c.decidedAt||c.createdAt).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}${ex?` · ${esc(ex.detail)}`:""}</div></div>
    ${retry}<span class="hst ${stCls(c.status)}">${stTxt(c)}</span></div>`;
}
// Patches one row in place after a retry. A full renderHistory() would reset histOffset/histSeen/
// histLastDay and bounce the reader back to the top of a list they may have already paged through
// several times; this fetches only page one (a retried card is always recent, so it is always
// there) and, if the card is still rendered, swaps just that row for a freshly rendered one.
async function patchHistoryRow(id,btn){
  try{
    const h=await api("/api/v1/history");
    const c=(h.cards||[]).find(x=>x.id===id);
    if(!c)return;
    const row=btn.closest(".hr2");
    if(!row)return;
    const scratch=document.createElement("div");
    scratch.innerHTML=histRow(c);
    const fresh=scratch.firstElementChild;
    row.replaceWith(fresh);
    const retryBtn=fresh.querySelector("[data-retry]");
    if(retryBtn)wireRetry(retryBtn);
  }catch(e){/* the row just keeps showing "Retrying…"; the next real visit to History catches it up */}
}
function wireRetry(b){
  b.addEventListener("click",async()=>{
    b.disabled=true;b.textContent="Retrying…";
    try{
      const r=await api(`/api/v1/cards/${b.dataset.retry}/retry`,{method:"POST"});
      toast("yes","Retrying",r.detail);
      // The executor polls every 5s; re-read once it has had a chance to run. Patches this one row
      // in place: histOffset/histSeen/histLastDay and scroll position belong to the reader, not to
      // this retry.
